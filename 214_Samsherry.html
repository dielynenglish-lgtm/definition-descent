<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. Balloon Pop - Vocabulary Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #111827;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Command Center (中央透明控制台) */
        #command-center {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 72%;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 16px;
            padding: 12px 20px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 10;
        }
        #command-center h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffd700;
            margin-bottom: 4px;
        }
        #command-center .definition {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        /* HUD 計分與計時器 */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.45);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        /* Overlays 畫面浮層 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }
        .overlay h1 {
            font-size: 52px;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .overlay p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #cbd5e1;
            text-align: center;
            max-width: 80%;
        }
        .btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.5);
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.7);
        }
        /* 劇烈震動效果 */
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-6px, -4px, 0); }
            20%, 80% { transform: translate3d(8px, 6px, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, -8px, 0); }
            40%, 60% { transform: translate3d(10px, 8px, 0); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD Dashboard -->
        <div id="hud">
            <div class="hud-card">Score: <span id="score-val">0</span></div>
            <div class="hud-card">Time: <span id="timer-val">90</span>s</div>
        </div>

        <!-- Command Center -->
        <div id="command-center">
            <h2>COMMAND CENTER</h2>
            <div class="definition" id="def-text">Loading target definition...</div>
        </div>

        <!-- Canvas Game World -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Start Overlay -->
        <div id="start-screen" class="overlay">
            <h1>3. Balloon Pop</h1>
            <p>Pop the matching balloon for the target definition in the Command Center!<br>Gain +10 pts for correct pops, lose -5 pts for errors.</p>
            <button class="btn" onclick="startGame()">Start Challenge</button>
        </div>

        <!-- Game Over Overlay -->
        <div id="game-over-screen" class="overlay" style="display: none;">
            <h1>Time's Up!</h1>
            <p>Your Final Score: <span id="final-score" style="color: #ffd700; font-weight: bold;">0</span></p>
            <button class="btn" onclick="startGame()">Play Again</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            { word: "coincidence", def: "A remarkable concurrence of events without apparent causal connection." },
            { word: "invade", def: "To enter a country or region with an armed force to conquer or occupy it." },
            { word: "overthrow", def: "To remove a ruler or government from power by force." },
            { word: "rigid", def: "Not able to be bent or forced out of shape; inflexible." },
            { word: "labor", def: "Hard physical work, or the workers considered as a group." },
            { word: "peasant", def: "A poor farmer of low social status who owns or rents a small piece of land." },
            { word: "noble", def: "Belonging to a high social class with a title, or having high moral principles." },
            { word: "revolution", def: "A forcible overthrow of a government or social order for a new system." },
            { word: "tyranny", def: "Cruel and oppressive government or rule." },
            { word: "rebel", def: "A person who rises in opposition or armed resistance against an established government." }
        ];

        const balloonColors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#eccc68', '#ff78ae', '#00d2d3'];

        // 遊戲狀態變數
        let canvas, ctx;
        let score = 0;
        let timeLeft = 90;
        let gameActive = false;
        let balloons = [];
        let currentTarget = null;
        let spawnInterval = null;
        let timerInterval = null;
        let animFrameId = null; // 新增：用於追蹤與取消 requestAnimationFrame

        window.onload = () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            canvas.addEventListener('mousedown', handleCanvasClick);
        };

        function startGame() {
            // 清除之前的動畫幀，避免重複加載 leading to 速度暴增
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
            }

            score = 0;
            timeLeft = 90;
            balloons = [];
            gameActive = true;

            document.getElementById('score-val').innerText = score;
            document.getElementById('timer-val').innerText = timeLeft;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';

            pickNewTarget();

            clearInterval(spawnInterval);
            clearInterval(timerInterval);

            // 每秒產生 1 個氣球
            spawnInterval = setInterval(spawnBalloon, 1000);

            // 90 秒倒數計時
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // 遊戲開始時預先填充 15 個氣球
            for (let i = 0; i < 15; i++) {
                let b = createBalloon();
                b.y = Math.random() * (canvas.height - 150) + 100;
                balloons.push(b);
            }

            gameLoop();
        }

        function pickNewTarget() {
            const randomIndex = Math.floor(Math.random() * vocabulary.length);
            currentTarget = vocabulary[randomIndex];
            document.getElementById('def-text').innerText = `"${currentTarget.def}"`;
        }

        function createBalloon() {
            let wordObj;
            if (Math.random() < 0.35 && currentTarget) {
                wordObj = currentTarget;
            } else {
                wordObj = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            }

            const radius = 36 + Math.random() * 8;
            return {
                x: radius + Math.random() * (canvas.width - radius * 2),
                y: canvas.height + radius + 20,
                radius: radius,
                color: balloonColors[Math.floor(Math.random() * balloonColors.length)],
                speed: 1.0 + Math.random() * 1.5,
                word: wordObj.word,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.03 + Math.random() * 0.02
            };
        }

        function spawnBalloon() {
            if (balloons.length < 20 && gameActive) {
                balloons.push(createBalloon());
            }
        }

        function triggerScreenShake() {
            const container = document.getElementById('game-container');
            container.classList.remove('shake');
            void container.offsetWidth; 
            container.classList.add('shake');
        }

        function handleCanvasClick(e) {
            if (!gameActive) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = balloons.length - 1; i >= 0; i--) {
                let b = balloons[i];
                let dist = Math.hypot(clickX - b.x, clickY - b.y);

                if (dist < b.radius + 8) {
                    if (b.word === currentTarget.word) {
                        score += 10;
                        document.getElementById('score-val').innerText = score;
                        balloons.splice(i, 1);
                        pickNewTarget();
                    } else {
                        score = Math.max(0, score - 5);
                        document.getElementById('score-val').innerText = score;
                        triggerScreenShake();
                        balloons.splice(i, 1);
                    }
                    break;
                }
            }
        }

        function update() {
            for (let i = balloons.length - 1; i >= 0; i--) {
                let b = balloons[i];
                b.y -= b.speed;
                b.wobble += b.wobbleSpeed;
                b.x += Math.sin(b.wobble) * 0.7;

                if (b.y < -b.radius * 2) {
                    balloons.splice(i, 1);
                }
            }
        }

        function drawBalloon(b) {
            ctx.save();

            // 氣球繩子
            ctx.beginPath();
            ctx.moveTo(b.x, b.y + b.radius);
            ctx.quadraticCurveTo(b.x + Math.sin(b.wobble) * 12, b.y + b.radius + 20, b.x, b.y + b.radius + 45);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 氣球本體
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.fill();

            // 氣球打結處
            ctx.beginPath();
            ctx.moveTo(b.x - 5, b.y + b.radius);
            ctx.lineTo(b.x + 5, b.y + b.radius);
            ctx.lineTo(b.x, b.y + b.radius + 6);
            ctx.closePath();
            ctx.fillStyle = b.color;
            ctx.fill();

            // 高光
            ctx.beginPath();
            ctx.arc(b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.22, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
            ctx.fill();

            // 單字文字
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
            ctx.shadowBlur = 4;
            ctx.fillText(b.word, b.x, b.y);

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            balloons.forEach(drawBalloon);
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            render();
            animFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(timerInterval);
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
            }
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
