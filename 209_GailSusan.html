<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Vocab Tetris</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --neon-blue: #00f3ff;
            --neon-pink: #ff007f;
            --neon-green: #0ff0fc;
            --neon-yellow: #ffe600;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            font-size: 28px;
            letter-spacing: 2px;
        }

        #game-container {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        #canvas-container {
            position: relative;
        }

        canvas {
            background-color: #050508;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            border-radius: 4px;
        }

        #ui-panel {
            display: flex;
            flex-direction: column;
            width: 260px;
            gap: 15px;
        }

        .card {
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid rgba(255, 0, 127, 0.4);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.1);
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #def-box {
            font-size: 15px;
            min-height: 60px;
            color: #fff;
            line-height: 1.4;
        }

        .stat-val {
            font-size: 24px;
            font-weight: bold;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        #controls-info {
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }

        #controls-info span {
            color: var(--neon-blue);
            font-weight: bold;
        }

        .btn {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 21, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            text-align: center;
            padding: 10px;
        }

        #overlay h2 {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 20px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <h1>VOCAB TETRIS</h1>

    <div id="game-container">
        <div id="canvas-container">
            <canvas id="tetris" width="240" height="480"></canvas>
            <div id="overlay">
                <h2>NEON TETRIS</h2>
                <button class="btn" onclick="startGame()">START GAME</button>
            </div>
        </div>

        <div id="ui-panel">
            <div class="card">
                <h3>Current Definition</h3>
                <div id="def-box">Click START to begin...</div>
            </div>

            <div class="card">
                <h3>Match Key</h3>
                <div>Press <span>'Y'</span> for Yes (Match)</div>
                <div>Press <span>'N'</span> for No (Mismatch)</div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="card" style="flex: 1;">
                    <h3>Score</h3>
                    <div id="score" class="stat-val">0</div>
                </div>
                <div class="card" style="flex: 1;">
                    <h3>Time</h3>
                    <div id="timer" class="stat-val">60</div>
                </div>
            </div>

            <div class="card" id="controls-info">
                <h3>Controls (Unlocked)</h3>
                <div><span>← / →</span> : Move Left/Right</div>
                <div><span>↑</span> : Rotate</div>
                <div><span>↓</span> : Soft Drop</div>
                <div><span>Space</span> : Hard Drop</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const grid = 24; // 10x20 grid -> 240x480

        const vocabulary = [
            { word: "luxurious", def: "Extremely comfortable, elegant, or enjoyable, especially in a way that involves great expense." },
            { word: "innovation", def: "A new method, idea, product, or feature that creates significant change." },
            { word: "terrifying", def: "Causing extreme fear or terror." },
            { word: "physically", def: "In a manner relating to the body rather than the mind." },
            { word: "procedure", def: "An established or official way of doing something step-by-step." },
            { word: "agony", def: "Extreme physical or mental suffering." },
            { word: "surgery", def: "Medical treatment involving an operation to repair or remove damaged body parts." },
            { word: "resilient", def: "Able to withstand or recover quickly from difficult conditions." },
            { word: "meticulous", def: "Showing great attention to detail; very careful and precise." },
            { word: "ubiquitous", def: "Present, appearing, or found everywhere." }
        ];

        const SHAPES = {
            'I': [[1, 1, 1, 1]],
            'L': [[0, 0, 1], [1, 1, 1]],
            'O': [[1, 1], [1, 1]],
            'T': [[0, 1, 0], [1, 1, 1]]
        };

        const COLORS = {
            'I': '#00f3ff',
            'L': '#ff9900',
            'O': '#ffe600',
            'T': '#ff007f'
        };

        let arena = createMatrix(10, 20);
        let player = {
            pos: {x: 0, y: 0},
            matrix: null,
            type: '',
            word: '',
            isCorrectMatch: false,
            unlocked: false,
            speedMultiplier: 1
        };

        let score = 0;
        let timeLeft = 60;
        let gameTimer = null;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isGameOver = true;
        let currentDef = "";

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function spawnBlock() {
            const types = ['I', 'L', 'O', 'T'];
            player.type = types[Math.floor(Math.random() * types.length)];
            player.matrix = SHAPES[player.type];
            player.pos.y = 0;
            player.pos.x = Math.floor((arena[0].length - player.matrix[0].length) / 2);
            
            // Vocab logic
            const vocabObj = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            player.word = vocabObj.word;
            
            // 50% chance match or mismatch
            player.isCorrectMatch = Math.random() < 0.5;
            if (player.isCorrectMatch) {
                currentDef = vocabObj.def;
            } else {
                let randomWrong;
                do {
                    randomWrong = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                } while (randomWrong.word === player.word);
                currentDef = randomWrong.def;
            }

            document.getElementById('def-box').innerText = currentDef;

            player.unlocked = false;
            player.speedMultiplier = 1;

            if (collide(arena, player)) {
                endGame("Game Over!\nStacked to Top!");
            }
        }

        function draw() {
            context.fillStyle = '#050508';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            drawMatrix(arena, {x: 0, y: 0});
            drawPlayer();
        }

        function drawGrid() {
            context.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            context.lineWidth = 1;
            for (let r = 0; r < 20; r++) {
                for (let c = 0; c < 10; c++) {
                    context.strokeRect(c * grid, r * grid, grid, grid);
                }
            }
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = value;
                        context.fillRect((x + offset.x) * grid, (y + offset.y) * grid, grid - 1, grid - 1);
                        context.shadowColor = value;
                        context.shadowBlur = 8;
                    }
                });
            });
            context.shadowBlur = 0;
        }

        function drawPlayer() {
            if (!player.matrix) return;
            
            context.save();
            if (!player.unlocked) {
                context.globalAlpha = 0.4;
            }

            const color = COLORS[player.type];
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = color;
                        context.fillRect((x + player.pos.x) * grid, (y + player.pos.y) * grid, grid - 1, grid - 1);
                        context.shadowColor = color;
                        context.shadowBlur = 10;
                    }
                });
            });
            context.restore();

            // Draw Word Overlay
            context.fillStyle = "#ffffff";
            context.font = "bold 11px Arial";
            context.textAlign = "center";
            const textX = (player.pos.x + player.matrix[0].length / 2) * grid;
            const textY = (player.pos.y + player.matrix.length / 2) * grid + 4;
            context.fillText(player.word, textX, textY);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = COLORS[player.type];
                    }
                });
            });
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                arenaSweep();
                spawnBlock();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (!player.unlocked) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerRotate() {
            if (!player.unlocked) return;
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            matrix.forEach(row => row.reverse());
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y >= 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                score += rowCount * 10;
                rowCount *= 2;
            }
            document.getElementById('score').innerText = score;
        }

        function handleAnswer(pressedYes) {
            if (player.unlocked || isGameOver) return;

            const isCorrect = (pressedYes === player.isCorrectMatch);

            if (isCorrect) {
                player.unlocked = true;
                player.speedMultiplier = 1;
            } else {
                player.unlocked = false;
                player.speedMultiplier = 2;
            }
        }

        function update(time = 0) {
            if (isGameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime * player.speedMultiplier;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startTimer() {
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame("Time's Up!");
                }
            }, 1000);
        }

        function startGame() {
            arena = createMatrix(10, 20);
            score = 0;
            timeLeft = 60;
            isGameOver = false;
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('overlay').style.display = 'none';

            clearInterval(gameTimer);
            startTimer();
            spawnBlock();
            lastTime = performance.now();
            update();
        }

        function endGame(reason) {
            isGameOver = true;
            clearInterval(gameTimer);
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('overlay').querySelector('h2').innerText = reason + "\nFinal Score: " + score;
        }

        document.addEventListener('keydown', event => {
            if (isGameOver) return;

            if (event.key === 'y' || event.key === 'Y') {
                handleAnswer(true);
            } else if (event.key === 'n' || event.key === 'N') {
                handleAnswer(false);
            }

            if (event.key === 'ArrowLeft') {
                playerMove(-1);
            } else if (event.key === 'ArrowRight') {
                playerMove(1);
            } else if (event.key === 'ArrowDown') {
                if (player.unlocked) playerDrop();
            } else if (event.key === 'ArrowUp') {
                playerRotate();
            } else if (event.key === ' ') {
                if (player.unlocked) {
                    while (!collide(arena, player)) {
                        player.pos.y++;
                    }
                    player.pos.y--;
                    merge(arena, player);
                    arenaSweep();
                    spawnBlock();
                }
            }
        });
    </script>
</body>
</html>
