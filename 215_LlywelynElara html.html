<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11th Grade Vocabulary Challenge</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --correct: #22c55e;
            --wrong: #ef4444;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #94a3b8;
        }

        .word-display {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
            color: #ffffff;
            background: #334155;
            padding: 15px;
            border-radius: 8px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #334155;
            color: var(--text);
            border: 2px solid transparent;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background-color: #475569;
        }

        .option-btn.correct {
            background-color: var(--correct);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
        }

        .next-btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            margin: 0 auto;
        }

        .next-btn:hover {
            background-color: var(--accent-hover);
        }

        .results {
            display: none;
        }

        .restart-btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>11th Grade Vocab Challenge</h1>
    
    <div id="quiz-screen">
        <div class="score-board">
            Question <span id="current-q">1</span> of <span id="total-q">7</span> | Score: <span id="score">0</span>
        </div>
        
        <p>Select the correct definition for the word below:</p>
        <div class="word-display" id="target-word">LOADING</div>

        <div class="options-grid" id="options-container"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Word →</button>
    </div>

    <div class="results" id="results-screen">
        <h2>Game Complete!</h2>
        <p style="font-size: 1.3rem;">Final Score: <span id="final-score">0</span> / <span id="max-score">7</span></p>
        <button class="restart-btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
    const vocabulary = [
        {
            word: "participant",
            correct: "A person who takes part in something.",
            options: [
                "A person who takes part in something.",
                "An officer in charge of rules.",
                "A spectator watching an event.",
                "An opponent in a debate."
            ]
        },
        {
            word: "implication",
            correct: "A conclusion that can be drawn although it is not explicitly stated.",
            options: [
                "A direct command given by a leader.",
                "A conclusion that can be drawn although it is not explicitly stated.",
                "A written law or regulation.",
                "A clear and obvious fact."
            ]
        },
        {
            word: "motivation",
            correct: "The reason or desire to act or behave in a particular way.",
            options: [
                "A physical skill acquired through practice.",
                "A temporary state of confusion.",
                "The reason or desire to act or behave in a particular way.",
                "An obstacle that prevents progress."
            ]
        },
        {
            word: "polished",
            correct: "Refined, sophisticated, or free from flaws.",
            options: [
                "Rough and unfinished around the edges.",
                "Refined, sophisticated, or free from flaws.",
                "Darkened or shadowed by weather.",
                "Extremely large or vast in size."
            ]
        },
        {
            word: "outfit",
            correct: "A set of clothes worn together for a particular occasion or purpose.",
            options: [
                "A set of tools used for gardening.",
                "A set of clothes worn together for a particular occasion or purpose.",
                "An exit door in a large venue.",
                "A formal speech delivered in public."
            ]
        },
        {
            word: "reinforce",
            correct: "To strengthen or support an object, idea, or structure.",
            options: [
                "To reduce or weaken the strength of something.",
                "To replace an old object with a new one.",
                "To ignore an issue until it resolves itself.",
                "To strengthen or support an object, idea, or structure."
            ]
        },
        {
            word: "accessible",
            correct: "Easy to approach, reach, enter, use, or understand.",
            options: [
                "Easy to approach, reach, enter, use, or understand.",
                "Hidden far away from human contact.",
                "Overly complex and difficult to grasp.",
                "Extremely expensive or high in cost."
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let shuffledVocab = [];

    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        currentQuestionIndex = 0;
        score = 0;
        shuffledVocab = shuffleArray([...vocabulary]);
        document.getElementById('total-q').innerText = shuffledVocab.length;
        document.getElementById('max-score').innerText = shuffledVocab.length;
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('results-screen').style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        const currentData = shuffledVocab[currentQuestionIndex];
        document.getElementById('current-q').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('target-word').innerText = currentData.word.toUpperCase();
        document.getElementById('next-btn').style.display = 'none';

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const shuffledOptions = shuffleArray([...currentData.options]);

        shuffledOptions.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(btn, option, currentData.correct);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedOption, correctOption) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        if (selectedOption === correctOption) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
        } else {
            selectedBtn.classList.add('wrong');
            buttons.forEach(btn => {
                if (btn.innerText === correctOption) {
                    btn.classList.add('correct');
                }
            });
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < shuffledVocab.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;
    }

    function restartGame() {
        startGame();
    }

    startGame();
</script>
</body>
</html>
