<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definition Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #111;
        }
        #definition-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid #00d2ff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffea00;
            display: none;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shield-container {
            width: 150px;
            height: 16px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
        }
        #shield-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #00ffcc);
            transition: width 0.2s ease;
        }
        .screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .screen h1 {
            font-size: 42px;
            color: #00ffcc;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        .screen p {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 20px;
            max-width: 600px;
            line-height: 1.5;
        }
        .btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #00d2ff;
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="definition-bar">DEFINITION: <span id="def-text">...</span></div>

        <div id="hud">
            <div class="hud-item">
                <span>SHIELD:</span>
                <div class="shield-container">
                    <div id="shield-bar"></div>
                </div>
            </div>
            <div class="hud-item">
                <span>SCORE: <span id="dist-text">0</span>m</span>
            </div>
            <div class="hud-item">
                <span>SPEED: <span id="speed-text">1.0</span>x</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <div id="start-screen" class="screen">
            <h1>DEFINITION RUNNER</h1>
            <p>Run endless tracks, dodge obstacles, and choose the correct vocabulary gates!</p>
            <button class="btn" onclick="startGame()">START GAME</button>
            <div class="controls-hint">
                <strong>Controls:</strong> Left/Right Arrows = Change Lanes | Up Arrow = Jump
            </div>
        </div>

        <div id="game-over-screen" class="screen" style="display: none;">
            <h1 style="color: #ff0055;">GAME OVER</h1>
            <p id="final-stats">You ran 0 meters!</p>
            <button class="btn" onclick="startGame()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        // --- 10 VOCABULARY WORDS & ENGLISH DEFINITIONS ---
        // (Includes your 7 words + 3 added vocabulary words)
        const VOCABULARY = [
            { word: "Miraculous", def: "Remarkable and extraordinary, as if brought about by a miracle." },
            { word: "Massive", def: "Large and heavy or solid; exceptionally great in size." },
            { word: "Vomit", def: "Eject matter from the stomach through the mouth." },
            { word: "Physician", def: "A person qualified to practice medicine; a medical doctor." },
            { word: "Does", def: "Performs or executes an action (third-person singular of do)." },
            { word: "Established", def: "Having been in existence for a long time and recognized." },
            { word: "Undergo", def: "Experience or be subjected to something (a test, change, etc.)." },
            { word: "Obstacle", def: "A thing that blocks one's way or prevents progress." },
            { word: "Shield", def: "A broad piece of armor used to protect against danger or damage." },
            { word: "Velocity", def: "The speed of something moving in a given direction." }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const defBar = document.getElementById('definition-bar');
        const defText = document.getElementById('def-text');
        const shieldBar = document.getElementById('shield-bar');
        const distText = document.getElementById('dist-text');
        const speedText = document.getElementById('speed-text');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalStats = document.getElementById('final-stats');

        const LANES = [180, 400, 620];
        const GROUND_Y = 380;
        const GATE_INTERVAL_TIME = 10;

        let gameState = "MENU";
        let distance = 0;
        let baseSpeed = 5;
        let currentSpeed = 5;
        let shield = 100;
        let lastTime = 0;
        let gateTimer = 0;

        const player = {
            lane: 1,
            x: LANES[1],
            y: GROUND_Y,
            width: 40,
            height: 60,
            velocityY: 0,
            gravity: 0.8,
            jumpStrength: -14,
            isJumping: false,
            color: '#00ffcc'
        };

        let obstacles = [];
        let gates = [];
        let particles = [];
        let bgOffset = 0;

        window.addEventListener('keydown', (e) => {
            if (gameState !== "PLAYING") return;

            if (e.key === "ArrowLeft" && player.lane > 0) {
                player.lane--;
            } else if (e.key === "ArrowRight" && player.lane < 2) {
                player.lane++;
            } else if (e.key === "ArrowUp" && !player.isJumping) {
                player.velocityY = player.jumpStrength;
                player.isJumping = true;
            }
        });

        function startGame() {
            gameState = "PLAYING";
            distance = 0;
            baseSpeed = 5;
            currentSpeed = 5;
            shield = 100;
            gateTimer = 0;
            obstacles = [];
            gates = [];
            particles = [];
            player.lane = 1;
            player.x = LANES[1];
            player.y = GROUND_Y;
            player.velocityY = 0;
            player.isJumping = false;

            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            defBar.style.display = "none";

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function triggerGateEvent() {
            const targetObj = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
            let wrongObj = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
            while (wrongObj.word === targetObj.word) {
                wrongObj = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
            }

            const correctLane = Math.random() < 0.5 ? 0 : 2;
            const wrongLane = correctLane === 0 ? 2 : 0;

            defText.textContent = targetObj.def;
            defBar.style.display = "block";

            gates.push({
                x: LANES[correctLane],
                y: -150,
                width: 140,
                height: 120,
                word: targetObj.word,
                isCorrect: true,
                lane: correctLane
            });

            gates.push({
                x: LANES[wrongLane],
                y: -150,
                width: 140,
                height: 120,
                word: wrongObj.word,
                isCorrect: false,
                lane: wrongLane
            });
        }

        function createParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 6 + 2,
                    color: color,
                    life: 1.0
                });
            }
        }

        function update(deltaTime) {
            baseSpeed += 0.0005 * deltaTime * 60;
            currentSpeed = baseSpeed;

            distance += Math.round(currentSpeed * 0.1);
            distText.textContent = distance;
            speedText.textContent = (currentSpeed / 5).toFixed(1);

            const targetX = LANES[player.lane];
            player.x += (targetX - player.x) * 0.2;

            if (player.isJumping) {
                player.velocityY += player.gravity;
                player.y += player.velocityY;

                if (player.y >= GROUND_Y) {
                    player.y = GROUND_Y;
                    player.isJumping = false;
                    player.velocityY = 0;
                }
            }

            bgOffset = (bgOffset + currentSpeed) % 40;

            gateTimer += deltaTime;
            if (gateTimer >= GATE_INTERVAL_TIME && gates.length === 0) {
                gateTimer = 0;
                triggerGateEvent();
            }

            if (gates.length === 0 && Math.random() < 0.02) {
                const randomLane = Math.floor(Math.random() * 3);
                const lastObstacle = obstacles[obstacles.length - 1];
                if (!lastObstacle || lastObstacle.y > 150) {
                    obstacles.push({
                        x: LANES[randomLane],
                        y: -40,
                        width: 50,
                        height: 35,
                        lane: randomLane
                    });
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += currentSpeed;

                if (
                    obs.lane === player.lane &&
                    player.y + player.height > obs.y &&
                    player.y < obs.y + obs.height &&
                    player.y > GROUND_Y - 20
                ) {
                    shield -= 20;
                    createParticles(player.x, player.y, '#ff0055', 10);
                    obstacles.splice(i, 1);
                    updateShieldUI();
                    continue;
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            if (gates.length > 0) {
                for (let i = gates.length - 1; i >= 0; i--) {
                    let g = gates[i];
                    g.y += currentSpeed;

                    if (g.y + g.height >= player.y && g.y <= player.y + player.height) {
                        if (player.lane === g.lane) {
                            if (g.isCorrect) {
                                shield = Math.min(100, shield + 15);
                                distance += 500;
                                baseSpeed += 1.2;
                                createParticles(player.x, player.y, '#00ffcc', 25);
                            } else {
                                shield -= 35;
                                baseSpeed = Math.max(4, baseSpeed - 2);
                                createParticles(player.x, player.y, '#ff0055', 25);
                            }
                            updateShieldUI();
                            defBar.style.display = "none";
                            gates = [];
                            break;
                        }
                    }

                    if (g.y > canvas.height) {
                        gates.splice(i, 1);
                        defBar.style.display = "none";
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shield <= 0) {
                gameOver();
            }
        }

        function updateShieldUI() {
            shieldBar.style.width = Math.max(0, shield) + "%";
        }

        function gameOver() {
            gameState = "GAMEOVER";
            defBar.style.display = "none";
            finalStats.textContent = `You covered a distance of ${distance} meters!`;
            gameOverScreen.style.display = "flex";
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(300, 0); ctx.lineTo(50, canvas.height);
            ctx.moveTo(367, 0); ctx.lineTo(290, canvas.height);
            ctx.moveTo(433, 0); ctx.lineTo(510, canvas.height);
            ctx.moveTo(500, 0); ctx.lineTo(750, canvas.height);
            ctx.stroke();

            ctx.strokeStyle = "rgba(0, 255, 204, 0.1)";
            ctx.lineWidth = 2;
            for (let y = bgOffset; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0055";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x - obs.width / 2, obs.y, obs.width, obs.height);
            }

            for (let g of gates) {
                ctx.fillStyle = "#222";
                ctx.strokeStyle = g.isCorrect ? "#00ffcc" : "#ff0055";
                ctx.lineWidth = 4;
                ctx.shadowBlur = 15;
                ctx.shadowColor = ctx.strokeStyle;

                ctx.fillRect(g.x - g.width / 2, g.y, g.width, g.height);
                ctx.strokeRect(g.x - g.width / 2, g.y, g.width, g.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 0;
                ctx.fillText(g.word, g.x, g.y + g.height / 2 + 5);
            }

            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillRect(player.x - player.width / 2, player.y - player.height, player.width, player.height);

            ctx.fillStyle = "#000";
            ctx.fillRect(player.x - 10, player.y - player.height + 12, 6, 6);
            ctx.fillRect(player.x + 4, player.y - player.height + 12, 6, 6);

            ctx.shadowBlur = 0;
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        function gameLoop(timestamp) {
            if (gameState !== "PLAYING") return;

            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(deltaTime);
            render();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
