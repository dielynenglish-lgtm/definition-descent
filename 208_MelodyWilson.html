<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 11: Sports Endless Runner</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f0f0f0; font-family: sans-serif; }
        #gameCanvas { display: block; border: 2px solid black; margin: auto;}
        #uiOverlay {
            position: absolute; top: 10px; left: 10px; right: 10px; height: 100px;
            background: rgba(0, 0, 0, 0.7); color: white; display: grid; grid-template-columns: 1fr 1fr 1fr;
            border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 1.2em; text-align: center;
        }
        #shieldBar { width: 100%; height: 20px; background-color: #555; border-radius: 10px; overflow: hidden; }
        #shieldFill { height: 100%; background-color: #00ff00; width: 100%; }
        #definitionText { grid-column: 1 / span 3; color: cyan; font-weight: bold; font-size: 1.1em; padding: 5px;}
        #gameOverScreen, #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        button { padding: 10px 20px; font-size: 1.2em; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="uiOverlay">
    <div id="distanceMeter">Distance: 0m</div>
    <div id="livesMeter">Shields: <span id="shieldBar"><div id="shieldFill"></div></span></div>
    <div id="currentLevel">Speed: Level 1</div>
    <div id="definitionText">Running towards a match? Good luck!</div>
</div>

<div id="startScreen">
    <h1>Sports Endless Runner: Definition Gates</h1>
    <p>Practice Grade 11 Sports vocabulary!</p>
    <p>Use LEFT/RIGHT arrows to switch lanes.</p>
    <p>Click START to begin!</p>
    <button onclick="startGame()">START</button>
</div>

<div id="gameOverScreen" style="display: none;">
    <h1>GAME OVER!</h1>
    <p>Your journey is complete.</p>
    <p id="finalDistance">Distance Run: 0m</p>
    <p id="finalRank"></p>
    <button onclick="startGame()">PLAY AGAIN</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// Vocabulary and Definitions
const vocab = {
    "Tournament": "a competition in which players play a series of games to decide who is the winner",
    "Shortage": "a situation in which there is not enough of something that people need",
    "Thrilling": "extremely exciting or enjoyable",
    "Unforgettable": "impossible to forget; memorable",
    "Eliminate": "to completely remove something that is not wanted or needed",
    "Defeat": "the state of being beaten by another person or team",
    "Victory": "the condition of winning a competition, game, or war",
    "Defend": "to keep something safe from harm, attack, or danger",
    "Olympics": "a multi-sport competition featuring thousands of athletes",
    "Determined": "having a strong desire to do something"
};
const words = Object.keys(vocab);
const definitions = Object.values(vocab);

// Game variables
let currentWordIndex = 0;
let distanceRun = 0;
let distanceTimer;
let currentLevel = 1;
let currentSpeed = 3;
let speedIncrementInterval;
let gameIsOver = false;
let currentShields = 100;

// Set up UI
const shieldFill = document.getElementById("shieldFill");
const distanceMeter = document.getElementById("distanceMeter");
const livesMeter = document.getElementById("livesMeter");
const levelMeter = document.getElementById("currentLevel");
const definitionText = document.getElementById("definitionText");
const finalDistanceText = document.getElementById("finalDistance");
const finalRankText = document.getElementById("finalRank");
const gameOverScreen = document.getElementById("gameOverScreen");
const startScreen = document.getElementById("startScreen");

// Game Loop and Canvas setup (simple version for single file)
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let animationId;
const lanes = 3;
let playerLane = 1;

// Define player object for single-file demo
const player = {
    x: 0,
    y: 0,
    width: 30,
    height: 30,
    laneWidth: 0,
};

// Initial setup to avoid blank canvas on start (or before start)
function initialSetup() {
    canvas.width = 800; // Define dimensions
    canvas.height = 400;
    player.laneWidth = canvas.width / lanes;
    player.x = player.laneWidth * playerLane + (player.laneWidth - player.width) / 2;
    player.y = canvas.height - player.height - 20;
    drawStartScreenBoard();
}

function drawStartScreenBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Lanes
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    for (let i = 1; i < lanes; i++) {
        ctx.beginPath();
        ctx.moveTo(i * player.laneWidth, 0);
        ctx.lineTo(i * player.laneWidth, canvas.height);
        ctx.stroke();
    }
    // Player on start screen (no movement yet)
    ctx.fillStyle = "blue";
    ctx.fillRect(player.x, player.y, player.width, player.height);
}

// Function to update the vocabulary/definition pair
function updateVocabulary() {
    definitionText.innerText = definitions[currentWordIndex];
}

// Distance meter logic
function startDistanceTracking() {
    distanceTimer = setInterval(() => {
        distanceRun += 1; // Basic distance, could be more complex
        distanceMeter.innerText = `Distance: ${distanceRun}m`;
    }, 1000); // Update every second
}

function stopDistanceTracking() {
    clearInterval(distanceTimer);
}

// Level and Speed logic
function startSpeedProgression() {
    speedIncrementInterval = setInterval(() => {
        currentSpeed += 1;
        currentLevel += 1;
        levelMeter.innerText = `Speed: Level ${currentLevel}`;
    }, 15000); // Speed up every 15 seconds
}

function stopSpeedProgression() {
    clearInterval(speedIncrementInterval);
}

// Handle player input
window.addEventListener("keydown", (e) => {
    if (gameIsOver) return;

    if (e.key === "ArrowLeft" && playerLane > 0) {
        playerLane -= 1;
    } else if (e.key === "ArrowRight" && playerLane < lanes - 1) {
        playerLane += 1;
    }

    // Lane positioning
    player.x = player.laneWidth * playerLane + (player.laneWidth - player.width) / 2;
});

// Start and End game logic
function startGame() {
    gameOverScreen.style.display = "none";
    startScreen.style.display = "none";
    gameIsOver = false;
    currentWordIndex = 0;
    distanceRun = 0;
    currentSpeed = 3;
    currentLevel = 1;
    currentShields = 100;
    playerLane = 1; // Reset to center lane

    // Reset UI
    shieldFill.style.width = "100%";
    shieldFill.style.backgroundColor = "#00ff00";
    distanceMeter.innerText = `Distance: 0m`;
    levelMeter.innerText = `Speed: Level 1`;
    updateVocabulary();

    // Start background systems
    startDistanceTracking();
    startSpeedProgression();
    drawStartScreenBoard();
    gameLoop(); // Initiate game loop
}

function gameOver() {
    gameIsOver = true;
    stopDistanceTracking();
    stopSpeedProgression();
    cancelAnimationFrame(animationId);
    gameOverScreen.style.display = "flex";
    finalDistanceText.innerText = `Distance Run: ${distanceRun}m`;

    // Add a simple "rank" based on distance for variety
    if (distanceRun < 30) {
        finalRankText.innerText = "Rank: Warm-up Complete!";
    } else if (distanceRun < 60) {
        finalRankText.innerText = "Rank: Amateur Athlete!";
    } else if (distanceRun < 90) {
        finalRankText.innerText = "Rank: Local Hero!";
    } else {
        finalRankText.innerText = "Rank: Tournament Champion!";
    }
}

function damageShield(amount) {
    currentShields -= amount;
    if (currentShields <= 0) {
        currentShields = 0;
        gameOver();
    }
    const widthPercent = (currentShields / 100) * 100;
    shieldFill.style.width = widthPercent + "%";

    // Change shield bar color as it depletes
    if (currentShields > 50) {
        shieldFill.style.backgroundColor = "#00ff00"; // Green
    } else if (currentShields > 25) {
        shieldFill.style.backgroundColor = "#ffaa00"; // Orange
    } else {
        shieldFill.style.backgroundColor = "#ff3333"; // Red
    }
}

// Simple Game Loop for single file
function gameLoop() {
    if (gameIsOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Lanes (re-drawing each loop)
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    for (let i = 1; i < lanes; i++) {
        ctx.beginPath();
        ctx.moveTo(i * player.laneWidth, 0);
        ctx.lineTo(i * player.laneWidth, canvas.height);
        ctx.stroke();
    }

    // Player (always blue for demo)
    ctx.fillStyle = "blue";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    animationId = requestAnimationFrame(gameLoop);
}

// Final setup to create starting canvas
initialSetup();

</script>
</body>
</html>
