<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Tower Defense: Vocabulary Reload</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a24; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .game-wrapper { display: flex; flex-direction: column; width: 1000px; background-color: #252636; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        header { background-color: #0f1017; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #33364d; }
        .stats-container { display: flex; gap: 25px; font-size: 1.1rem; font-weight: bold; }
        .health-bar-container { width: 150px; height: 18px; background-color: #444; border-radius: 9px; overflow: hidden; display: inline-block; vertical-align: middle; border: 1px solid #666; }
        .health-bar { width: 100%; height: 100%; background-color: #2ecc71; transition: width 0.3s ease, background-color 0.3s ease; }
        .main-container { display: flex; height: 500px; position: relative; }
        #gameCanvas { background-color: #2d3238; flex-grow: 1; }
        .sidebar { width: 320px; background-color: #1e1f2c; border-left: 2px solid #33364d; padding: 20px; display: flex; flex-direction: column; position: relative; }
        .sidebar h2 { font-size: 1.2rem; color: #e2b714; margin-bottom: 15px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .turret-status { margin-bottom: 15px; background: #282a3d; padding: 10px; border-radius: 8px; }
        .turret-info { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        .ammo-bar-bg { width: 100%; height: 8px; background-color: #444; border-radius: 4px; overflow: hidden; }
        .ammo-bar { height: 100%; width: 100%; background-color: #3498db; transition: width 0.2s ease; }
        .turret-locked { color: #e74c3c; font-weight: bold; }
        
        .puzzle-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 16, 23, 0.95); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; z-index: 10; display: none; }
        .puzzle-overlay.active { display: flex; }
        .puzzle-title { color: #e74c3c; font-size: 1.1rem; text-align: center; margin-bottom: 10px; }
        .definition-box { background-color: #282a3d; border-left: 4px solid #e2b714; padding: 12px; border-radius: 4px; font-size: 0.95rem; line-height: 1.4; margin-bottom: 20px; color: #dddddd; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background-color: #34495e; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background-color 0.2s, transform 0.1s; }
        .option-btn:hover { background-color: #415b76; transform: translateY(-2px); }
        .game-over-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; display: none; }
        .game-over-overlay.active { display: flex; }
        .game-over-title { font-size: 2.5rem; color: #e74c3c; margin-bottom: 15px; }
        .restart-btn { background-color: #2ecc71; color: white; border: none; padding: 12px 25px; font-size: 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .restart-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <header>
        <h1>Word Tower Defense</h1>
        <div class="stats-container">
            <div>Wave: <span id="waveDisplay">1</span></div>
            <div>
                Base HP: 
                <div class="health-bar-container">
                    <div id="healthBar" class="health-bar"></div>
                </div>
                <span id="healthText">100%</span>
            </div>
        </div>
    </header>

    <div class="main-container">
        <canvas id="gameCanvas" width="680" height="500"></canvas>
        
        <div class="sidebar">
            <h2>Turret Status</h2>
            <div id="turrets-list"></div>

            <div id="puzzleOverlay" class="puzzle-overlay">
                <div class="puzzle-title">⚠️ AMMO EMPTY ⚠️</div>
                <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 10px; text-align: center;">Solve the definition puzzle to reload!</p>
                <div id="definitionBox" class="definition-box">Loading...</div>
                <div id="optionsContainer" class="options-container"></div>
            </div>
        </div>

        <div id="gameOverOverlay" class="game-over-overlay">
            <div class="game-over-title">BASE DESTROYED</div>
            <p>You survived <span id="finalWave">1</span> wave(s).</p>
            <button class="restart-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>
</div>

<script>
const vocabularyList = [
    { word: "solo", definition: "Done by one person alone; unaccompanied." },
    { word: "flexibility", definition: "The ability to bend easily or adapt to new situations." },
    { word: "compromise", definition: "An agreement reached when both sides meet in the middle." },
    { word: "destination", definition: "The place to which someone or something is going." },
    { word: "split", definition: "To divide or cause to divide into two or more parts." },
    { word: "arise", definition: "To emerge, occur, or come into notice." },
    { word: "occasionally", definition: "At times; from time to time; now and then." }
];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let baseHealth = 100;
let currentWave = 1;
let enemies = [];
let bullets = [];
let gameInterval;
let spawnInterval;
let activePuzzle = false;
let currentPuzzleTarget = null;
let isGameOver = false;
let spawningFinished = false;

const path = [
    {x: 0, y: 250}, {x: 180, y: 250}, {x: 180, y: 100},
    {x: 380, y: 100}, {x: 380, y: 380}, {x: 550, y: 380},
    {x: 550, y: 250}, {x: 680, y: 250}
];

class Turret {
    constructor(id, x, y) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.maxAmmo = 10;
        this.ammo = 10;
        this.range = 140;
        this.cooldown = 0;
        this.fireRate = 30;
        this.locked = false;
        this.lockTimer = 0;
    }

    update() {
        if (this.locked) {
            this.lockTimer--;
            if (this.lockTimer <= 0) {
                this.locked = false;
            }
            return;
        }

        if (this.cooldown > 0) this.cooldown--;

        if (this.ammo <= 0 && !activePuzzle && !this.locked) {
            triggerReloadPuzzle(this);
            return;
        }

        if (this.ammo > 0 && this.cooldown === 0) {
            let target = this.findTarget();
            if (target) {
                this.shoot(target);
                this.ammo--;
                this.cooldown = this.fireRate;
            }
        }
    }

    findTarget() {
        for (let enemy of enemies) {
            let dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
            if (dist <= this.range) return enemy;
        }
        return null;
    }

    shoot(target) {
        bullets.push(new Bullet(this.x, this.y, target));
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.stroke();

        ctx.fillStyle = this.locked ? "#7f8c8d" : "#34495e";
        ctx.beginPath();
        ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.locked ? "#c0392b" : "#e2b714";
        ctx.beginPath();
        ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
        ctx.fill();

        if (this.locked) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "12px sans-serif";
            ctx.fillText("🔒 " + Math.ceil(this.lockTimer/60) + "s", this.x - 15, this.y - 25);
        }
    }
}

const turrets = [
    new Turret(1, 280, 190),
    new Turret(2, 280, 300),
    new Turret(3, 470, 250)
];

class Enemy {
    constructor() {
        this.x = path[0].x;
        this.y = path[0].y;
        this.pathIndex = 0;
        this.speed = 1 + (currentWave * 0.2);
        this.hp = 30 + (currentWave * 10);
        this.maxHp = this.hp;
        this.radius = 12;
    }

    update() {
        let target = path[this.pathIndex + 1];
        if (!target) return;

        let dx = target.x - this.x;
        let dy = target.y - this.y;
        let dist = Math.hypot(dx, dy);

        if (dist < this.speed) {
            this.x = target.x;
            this.y = target.y;
            this.pathIndex++;
            if (this.pathIndex >= path.length - 1) {
                damageBase(10);
                this.hp = 0;
            }
        } else {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#000";
        ctx.fillRect(this.x - 12, this.y - 18, 24, 4);
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(this.x - 12, this.y - 18, (this.hp / this.maxHp) * 24, 4);
    }
}

class Bullet {
    constructor(x, y, target) {
        this.x = x;
        this.y = y;
        this.target = target;
        this.speed = 6;
        this.damage = 15;
        this.active = true;
    }

    update() {
        if (!this.target || this.target.hp <= 0) {
            this.active = false;
            return;
        }

        let dx = this.target.x - this.x;
        let dy = this.target.y - this.y;
        let dist = Math.hypot(dx, dy);

        if (dist < this.speed) {
            this.target.hp -= this.damage;
            this.active = false;
        } else {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.fillStyle = "#f1c40f";
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function damageBase(amount) {
    baseHealth -= amount;
    if (baseHealth < 0) baseHealth = 0;

    const healthBar = document.getElementById('healthBar');
    const healthText = document.getElementById('healthText');
    
    healthBar.style.width = baseHealth + "%";
    healthText.textContent = baseHealth + "%";

    if (baseHealth <= 30) healthBar.style.backgroundColor = "#e74c3c";
    else if (baseHealth <= 60) healthBar.style.backgroundColor = "#f39c12";

    if (baseHealth <= 0) triggerGameOver();
}

function spawnWave() {
    let spawned = 0;
    let maxEnemies = 5 + (currentWave * 2);
    spawningFinished = false;
    
    if (spawnInterval) clearInterval(spawnInterval);
    
    spawnInterval = setInterval(() => {
        if (isGameOver || activePuzzle) return;
        enemies.push(new Enemy());
        spawned++;
        if (spawned >= maxEnemies) {
            clearInterval(spawnInterval);
            spawningFinished = true;
        }
    }, 1500 / Math.min(currentWave, 3));
}

function triggerReloadPuzzle(turret) {
    activePuzzle = true;
    currentPuzzleTarget = turret;

    const overlay = document.getElementById('puzzleOverlay');
    const defBox = document.getElementById('definitionBox');
    const optionsContainer = document.getElementById('optionsContainer');

    const targetItem = vocabularyList[Math.floor(Math.random() * vocabularyList.length)];
    defBox.textContent = `"${targetItem.definition}"`;

    let options = [targetItem.word];
    while (options.length < 3) {
        let randWord = vocabularyList[Math.floor(Math.random() * vocabularyList.length)].word;
        if (!options.includes(randWord)) options.push(randWord);
    }

    options.sort(() => Math.random() - 0.5);

    optionsContainer.innerHTML = '';
    options.forEach(optionWord => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = optionWord;
        btn.onclick = () => handleAnswer(optionWord, targetItem.word);
        optionsContainer.appendChild(btn);
    });

    overlay.classList.add('active');
}

function handleAnswer(selectedWord, correctWord) {
    const overlay = document.getElementById('puzzleOverlay');

    if (selectedWord === correctWord) {
        turrets.forEach(t => {
            t.ammo = t.maxAmmo;
            t.locked = false;
        });
    } else {
        if (currentPuzzleTarget) {
            currentPuzzleTarget.locked = true;
            currentPuzzleTarget.lockTimer = 300;
        }
    }

    overlay.classList.remove('active');
    activePuzzle = false;
    currentPuzzleTarget = null;
    updateSidebarUI();
}

function updateSidebarUI() {
    const container = document.getElementById('turrets-list');
    container.innerHTML = '';

    turrets.forEach((t) => {
        const div = document.createElement('div');
        div.className = 'turret-status';

        let statusText = `${t.ammo} / ${t.maxAmmo}`;
        if (t.locked) {
            statusText = `<span class="turret-locked">LOCKED (${Math.ceil(t.lockTimer / 60)}s)</span>`;
        } else if (t.ammo === 0) {
            statusText = `<span style="color: #e2b714;">RELOADING...</span>`;
        }

        div.innerHTML = `
            <div class="turret-info">
                <span>Turret #${t.id}</span>
                <span>${statusText}</span>
            </div>
            <div class="ammo-bar-bg">
                <div class="ammo-bar" style="width: ${(t.ammo / t.maxAmmo) * 100}%;"></div>
            </div>
        `;
        container.appendChild(div);
    });
}

function drawPath() {
    ctx.strokeStyle = "#404552";
    ctx.lineWidth = 30;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) {
        ctx.lineTo(path[i].x, path[i].y);
    }
    ctx.stroke();

    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(660, 220, 20, 60);
}

function updateGame() {
    if (isGameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawPath();

    if (!activePuzzle) {
        turrets.forEach(t => t.update());
        bullets.forEach((b, index) => {
            b.update();
            if (!b.active) bullets.splice(index, 1);
        });
        enemies.forEach((e, index) => {
            e.update();
            if (e.hp <= 0) enemies.splice(index, 1);
        });

        if (enemies.length === 0 && spawningFinished) {
            spawningFinished = false;
            currentWave++;
            document.getElementById('waveDisplay').textContent = currentWave;
            spawnWave();
        }
    }

    turrets.forEach(t => t.draw());
    bullets.forEach(b => b.draw());
    enemies.forEach(e => e.draw());

    updateSidebarUI();
}

function triggerGameOver() {
    isGameOver = true;
    clearInterval(gameInterval);
    if (spawnInterval) clearInterval(spawnInterval);
    document.getElementById('finalWave').textContent = currentWave;
    document.getElementById('gameOverOverlay').classList.add('active');
}

function resetGame() {
    baseHealth = 100;
    currentWave = 1;
    enemies = [];
    bullets = [];
    isGameOver = false;
    spawningFinished = false;

    document.getElementById('healthBar').style.width = "100%";
    document.getElementById('healthBar').style.backgroundColor = "#2ecc71";
    document.getElementById('healthText').textContent = "100%";
    document.getElementById('waveDisplay').textContent = "1";
    document.getElementById('gameOverOverlay').classList.remove('active');

    turrets.forEach(t => {
        t.ammo = t.maxAmmo;
        t.locked = false;
        t.lockTimer = 0;
    });

    clearInterval(gameInterval);
    gameInterval = setInterval(updateGame, 1000 / 60);
    spawnWave();
}

gameInterval = setInterval(updateGame, 1000 / 60);
spawnWave();
</script>
</body>
</html>
