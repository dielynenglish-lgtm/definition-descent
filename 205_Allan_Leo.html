<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crossword Arcade Frogger</title>
<style>
    body {
        background-color: #1e1e2f;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
    }

    #game-header {
        text-align: center;
        max-width: 680px;
        width: 100%;
        margin-bottom: 10px;
        background: #2b2b40;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        box-sizing: border-box;
    }

    /* Increased Header Text Size */
    #puzzle-definition {
        font-size: 1.4rem;
        font-weight: bold;
        color: #ffd700;
        margin-bottom: 8px;
        line-height: 1.3;
    }

    #timer-score {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        font-size: 1.25rem;
    }

    #game-container {
        position: relative;
        width: 680px;
        height: 500px;
        background-color: #333;
        overflow: hidden;
        border: 4px solid #fff;
        border-radius: 8px;
    }

    /* Lanes Styling */
    .lane {
        position: absolute;
        width: 100%;
        height: 50px;
        box-sizing: border-box;
    }

    .safety-zone { top: 0px; background-color: #2e7d32; display: flex; justify-content: space-around; align-items: center; }
    .river-lane  { background-color: #1565c0; border-bottom: 1px dashed rgba(255,255,255,0.2); }
    .middle-bank { top: 200px; background-color: #4e342e; }
    .road-lane   { background-color: #424242; border-bottom: 1px dashed #757575; }
    .start-zone  { top: 450px; background-color: #2e7d32; }

    /* Top Safety Slots - Increased Font Size & Width */
    .top-slot {
        width: 120px;
        height: 42px;
        background-color: #1b5e20;
        border: 2px solid #ffd700;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 1.1rem;
        border-radius: 6px;
        text-align: center;
    }

    /* Moving Objects - Increased Font Size */
    .game-object {
        position: absolute;
        height: 42px;
        top: 4px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        font-weight: bold;
        color: #fff;
        padding: 0 8px;
        box-sizing: border-box;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .log { background-color: #8d6e63; border: 2px solid #5d4037; }
    .car { background-color: #d32f2f; border: 2px solid #b71c1c; }

    /* Player Character */
    #player {
        position: absolute;
        width: 32px;
        height: 32px;
        background-color: #00e676;
        border: 2px solid #fff;
        border-radius: 50%;
        z-index: 10;
        transition: transform 0.1s;
    }

    /* Overlay Message */
    #overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 20;
    }

    #overlay h2 { font-size: 2.2rem; margin-bottom: 10px; color: #ffd700; }
    #overlay p { font-size: 1.1rem; line-height: 1.4; }
    #overlay button {
        padding: 12px 24px;
        font-size: 1.2rem;
        background-color: #00e676;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="game-header">
    <div id="puzzle-definition">Loading Definition...</div>
    <div id="timer-score">
        <span>Time Left: <span id="timer">60</span>s</span>
        <span>Score: <span id="score">0</span></span>
    </div>
</div>

<div id="game-container">
    <!-- Top Safety Zone -->
    <div class="lane safety-zone">
        <div class="top-slot" id="slot-0">Word A</div>
        <div class="top-slot" id="slot-1">Word B</div>
        <div class="top-slot" id="slot-2">Word C</div>
        <div class="top-slot" id="slot-3">Word D</div>
    </div>

    <!-- River Lanes (Logs labeled with Vocab) -->
    <div class="lane river-lane" style="top: 50px;" id="lane-1"></div>
    <div class="lane river-lane" style="top: 100px;" id="lane-2"></div>
    <div class="lane river-lane" style="top: 150px;" id="lane-3"></div>

    <!-- Safe Middle Bank -->
    <div class="lane middle-bank"></div>

    <!-- Road Lanes (Cars labeled with Definitions) -->
    <div class="lane road-lane" style="top: 250px;" id="lane-5"></div>
    <div class="lane road-lane" style="top: 300px;" id="lane-6"></div>
    <div class="lane road-lane" style="top: 350px;" id="lane-7"></div>
    <div class="lane road-lane" style="top: 400px;" id="lane-8"></div>

    <!-- Safe Start Zone -->
    <div class="lane start-zone"></div>

    <!-- Player Character -->
    <div id="player"></div>

    <!-- Game Overlay -->
    <div id="overlay">
        <h2 id="overlay-title">Crossword Arcade Frogger</h2>
        <p id="overlay-desc" style="text-align: center; margin: 0 20px 20px 20px;">
            Reach the correct word at the top safety zone matching the definition puzzle!<br>
            Ride the logs (Vocabulary) and avoid the cars (Definitions).
        </p>
        <button id="start-btn" onclick="startGame()">Play Game</button>
    </div>
</div>

<script>
    // Vocabulary Data
    const vocabList = [
        { word: "grip", def: "A firm hold or grasp" },
        { word: "adjustment", def: "A small change made to achieve fit" },
        { word: "strain", def: "A force pulling or stretching tight" },
        { word: "flexible", def: "Capable of bending easily" },
        { word: "loosen", def: "To make or become less tight" },
        { word: "slightly", def: "To a small degree; a little bit" },
        { word: "demonstrate", def: "To clearly show how something works" }
    ];

    // Game Constants & Variables
    const GRID_SIZE = 50;
    const GAME_WIDTH = 680;
    const GAME_HEIGHT = 500;
    
    let playerPos = { x: 324, y: 460 }; // Start at bottom center
    let currentTargetWord = "";
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let gameLoopId = null;
    let isPlaying = false;

    // Movement Lane Matrices (Slowing Speeds down significantly for ease of playing)
    const lanes = [
        { id: 'lane-1', type: 'river', speed: 0.6, direction: 1, items: [] },
        { id: 'lane-2', type: 'river', speed: -0.8, direction: -1, items: [] },
        { id: 'lane-3', type: 'river', speed: 0.7, direction: 1, items: [] },
        { id: 'lane-5', type: 'road', speed: -1.0, direction: -1, items: [] },
        { id: 'lane-6', type: 'road', speed: 0.9, direction: 1, items: [] },
        { id: 'lane-7', type: 'road', speed: -0.7, direction: -1, items: [] },
        { id: 'lane-8', type: 'road', speed: 1.1, direction: 1, items: [] }
    ];

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        score = 0;
        document.getElementById('score').innerText = score;
        isPlaying = true;
        
        setupRound();
        
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function setupRound() {
        resetPlayer();

        // Start/Reset Timer (Extended to 60 seconds for easier gameplay)
        clearInterval(timerInterval);
        timeLeft = 60;
        document.getElementById('timer').innerText = timeLeft;
        timerInterval = setInterval(() => {
            if (!isPlaying) return;
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                gameOver("Time's Up!");
            }
        }, 1000);

        // Select Target Vocabulary Word
        const targetObj = vocabList[Math.floor(Math.random() * vocabList.length)];
        currentTargetWord = targetObj.word;
        document.getElementById('puzzle-definition').innerText = `Puzzle: "${targetObj.def}"`;

        // Populate Top Safety Slots (1 correct, 3 distractors)
        let choices = [currentTargetWord];
        while (choices.length < 4) {
            let randWord = vocabList[Math.floor(Math.random() * vocabList.length)].word;
            if (!choices.includes(randWord)) choices.push(randWord);
        }
        choices.sort(() => Math.random() - 0.5);

        for (let i = 0; i < 4; i++) {
            const slot = document.getElementById(`slot-${i}`);
            slot.innerText = choices[i];
            slot.dataset.word = choices[i];
        }

        // Initialize Objects in Lanes with wider clickable/standable widths
        lanes.forEach(lane => {
            lane.items = [];
            const container = document.getElementById(lane.id);
            container.innerHTML = '';

            for (let i = 0; i < 2; i++) {
                const itemEl = document.createElement('div');
                itemEl.className = `game-object ${lane.type === 'river' ? 'log' : 'car'}`;
                
                let text = "";
                let itemWidth = 160;

                if (lane.type === 'river') {
                    text = vocabList[Math.floor(Math.random() * vocabList.length)].word;
                    itemWidth = 160; // Wider logs to make staying on easy
                } else {
                    text = vocabList[Math.floor(Math.random() * vocabList.length)].def;
                    itemWidth = 180;
                }
                
                itemEl.style.width = itemWidth + 'px';
                itemEl.innerText = text;
                const xPos = i * 350 + Math.random() * 40;
                
                container.appendChild(itemEl);
                lane.items.push({
                    el: itemEl,
                    x: xPos,
                    width: itemWidth
                });
            }
        });
    }

    function resetPlayer() {
        playerPos = { x: 324, y: 460 };
        updatePlayerDOM();
    }

    function updatePlayerDOM() {
        const p = document.getElementById('player');
        p.style.left = playerPos.x + 'px';
        p.style.top = playerPos.y + 'px';
    }

    // Controls
    window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;

        if (e.key === 'ArrowUp' && playerPos.y > 10) playerPos.y -= GRID_SIZE;
        if (e.key === 'ArrowDown' && playerPos.y < 450) playerPos.y += GRID_SIZE;
        if (e.key === 'ArrowLeft' && playerPos.x > 10) playerPos.x -= GRID_SIZE;
        if (e.key === 'ArrowRight' && playerPos.x < GAME_WIDTH - 40) playerPos.x += GRID_SIZE;

        updatePlayerDOM();
    });

    // Main Loop
    function gameLoop() {
        if (!isPlaying) return;

        // Move items horizontally
        lanes.forEach(lane => {
            lane.items.forEach(item => {
                item.x += lane.speed;
                if (lane.speed > 0 && item.x > GAME_WIDTH) item.x = -item.width;
                if (lane.speed < 0 && item.x < -item.width) item.x = GAME_WIDTH;

                item.el.style.left = item.x + 'px';
            });
        });

        const playerCenter = playerPos.x + 16;

        // Top Zone
        if (playerPos.y === 10) {
            checkTopSafetyZone(playerCenter);
        }
        // River Zone
        else if (playerPos.y >= 60 && playerPos.y <= 160) {
            const laneIndex = (playerPos.y - 60) / 50;
            const currentLane = lanes[laneIndex];
            let onLog = false;

            currentLane.items.forEach(item => {
                if (playerCenter >= item.x && playerCenter <= item.x + item.width) {
                    onLog = true;
                    playerPos.x += currentLane.speed;
                }
            });

            if (playerPos.x < 0 || playerPos.x > GAME_WIDTH - 32) {
                resetPlayer();
            }

            if (!onLog) {
                resetPlayer();
            } else {
                updatePlayerDOM();
            }
        }
        // Road Zone
        else if (playerPos.y >= 260 && playerPos.y <= 410) {
            const laneIndex = (playerPos.y - 60) / 50;
            const currentLane = lanes[laneIndex];

            currentLane.items.forEach(item => {
                if (playerCenter >= item.x && playerCenter <= item.x + item.width) {
                    resetPlayer();
                }
            });
        }

        requestAnimationFrame(gameLoop);
    }

    function checkTopSafetyZone(playerX) {
        // Updated landing zones based on new container width (680px)
        const slots = [
            { id: 'slot-0', minX: 10, maxX: 160 },
            { id: 'slot-1', minX: 180, maxX: 330 },
            { id: 'slot-2', minX: 350, maxX: 500 },
            { id: 'slot-3', minX: 520, maxX: 670 }
        ];

        let landedSlot = slots.find(s => playerX >= s.minX && playerX <= s.maxX);

        if (landedSlot) {
            const slotEl = document.getElementById(landedSlot.id);
            if (slotEl.dataset.word === currentTargetWord) {
                score += 100;
                document.getElementById('score').innerText = score;
                setupRound();
            } else {
                resetPlayer();
            }
        } else {
            resetPlayer();
        }
    }

    function gameOver(reason) {
        isPlaying = false;
        clearInterval(timerInterval);
        document.getElementById('overlay-title').innerText = "Game Over!";
        document.getElementById('overlay-desc').innerHTML = `${reason}<br>Final Score: <b>${score}</b>`;
        document.getElementById('start-btn').innerText = "Try Again";
        document.getElementById('overlay').style.display = 'flex';
    }
</script>

</body>
</html>
