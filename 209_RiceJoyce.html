<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Snake-Definition Hunt</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            text-align: center;
            position: relative;
        }

        #ui-panel {
            background: #1f2833;
            border: 2px solid #66fcf1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            width: 870px;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
            box-sizing: border-box;
        }

        #definition-box {
            font-size: 1.3rem;
            color: #45f3ff;
            margin-top: 10px;
            min-height: 50px;
            font-weight: bold;
        }

        #status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: bold;
        }

        canvas {
            background-color: #0d1117;
            border: 3px solid #45f3ff;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.3);
            border-radius: 4px;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff0055;
        }

        #game-over-screen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0055;
        }

        button {
            background: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 10px #66fcf1;
            margin-top: 15px;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-panel">
        <div id="status-bar">
            <span>SCORE: <span id="score">0</span></span>
            <span id="lock-status" style="color: #ff0055;"></span>
        </div>
        <div id="definition-box">TARGET DEFINITION: <span id="definition">Loading...</span></div>
    </div>

    <!-- Scaled canvas to maintain clean 50px grid proportions -->
    <canvas id="gameCanvas" width="900" height="550"></canvas>

    <div id="game-over-screen">
        <h1>SYSTEM OVERRIDE</h1>
        <p style="color: #66fcf1; font-size: 1.4rem;">FINAL SCORE: <span id="final-score">0</span></p>
        <button onclick="resetGame()">REBOOT SYSTEM</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Increased GRID_SIZE to 50 for larger snake, food tiles, and clear text layout
    const GRID_SIZE = 50;
    const TILE_COUNT_X = canvas.width / GRID_SIZE;
    const TILE_COUNT_Y = canvas.height / GRID_SIZE;

    const vocabData = [
        { word: "UNIDENTIFIED", def: "Not recognized or not able to be identified." },
        { word: "PHENOMENON", def: "A remarkable fact, event, or occurrence that is observed." },
        { word: "RADAR", def: "A system for detecting the presence, direction, distance, and speed of objects using radio waves." },
        { word: "SENSOR", def: "A device that detects or measures a physical property and records or responds to it." },
        { word: "PERSONNEL", def: "People employed in an organization or engaged in an organized undertaking." },
        { word: "STRENGTHEN", def: "To make or become stronger or more resilient." },
        { word: "MYSTERIOUS", def: "Difficult or impossible to understand, explain, or identify." },
        { word: "ANOMALY", def: "Something that deviates from what is standard, normal, or expected." },
        { word: "ANALYZE", def: "To examine methodically and in detail for explanation or interpretation." },
        { word: "FREQUENCY", def: "The rate at which a vibration occurs or a signal repeats over time." }
    ];

    let snake = [];
    let dx = GRID_SIZE;
    let dy = 0;
    let score = 0;
    let movementLocked = false;
    let gameInterval;
    let currentTarget = null;
    let pellets = [];

    function init() {
        snake = [
            { x: 5 * GRID_SIZE, y: 5 * GRID_SIZE },
            { x: 4 * GRID_SIZE, y: 5 * GRID_SIZE },
            { x: 3 * GRID_SIZE, y: 5 * GRID_SIZE }
        ];
        dx = GRID_SIZE;
        dy = 0;
        score = 0;
        movementLocked = false;
        document.getElementById("score").innerText = score;
        document.getElementById("game-over-screen").style.display = "none";
        document.getElementById("lock-status").innerText = "";
        
        spawnPellets();
        if (gameInterval) clearInterval(gameInterval);
        
        // Increased interval from 130ms to 200ms to significantly slow down the speed/pace
        gameInterval = setInterval(gameLoop, 200);
    }

    function spawnPellets() {
        const targetIndex = Math.floor(Math.random() * vocabData.length);
        currentTarget = vocabData[targetIndex];
        document.getElementById("definition").innerText = `"${currentTarget.def}"`;

        let distractors = vocabData.filter((_, idx) => idx !== targetIndex);
        distractors = distractors.sort(() => 0.5 - Math.random()).slice(0, 2);

        const currentWords = [
            { word: currentTarget.word, isCorrect: true },
            { word: distractors[0].word, isCorrect: false },
            { word: distractors[1].word, isCorrect: false }
        ].sort(() => 0.5 - Math.random());

        pellets = [];
        currentWords.forEach(item => {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * TILE_COUNT_X) * GRID_SIZE,
                    y: Math.floor(Math.random() * TILE_COUNT_Y) * GRID_SIZE,
                    word: item.word,
                    isCorrect: item.isCorrect
                };
            } while (isOccupied(pos));
            pellets.push(pos);
        });
    }

    function isOccupied(pos) {
        return snake.some(segment => segment.x === pos.x && segment.y === pos.y) ||
               pellets.some(p => p.x === pos.x && p.y === pos.y);
    }

    function gameLoop() {
        moveSnake();
        if (checkCollisions()) {
            triggerGameOver();
            return;
        }
        checkPelletCollision();
        draw();
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);
        snake.pop();
    }

    function checkCollisions() {
        const head = snake[0];
        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
            return true;
        }
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                return true;
            }
        }
        return false;
    }

    function checkPelletCollision() {
        const head = snake[0];
        pellets.forEach((pellet) => {
            if (head.x === pellet.x && head.y === pellet.y) {
                if (pellet.isCorrect) {
                    score += 10;
                    document.getElementById("score").innerText = score;
                    const tail = { ...snake[snake.length - 1] };
                    snake.push(tail);
                    spawnPellets();
                } else {
                    score = Math.max(0, score - 5);
                    document.getElementById("score").innerText = score;
                    
                    snake.pop();
                    if (snake.length > 1) snake.pop();

                    movementLocked = true;
                    document.getElementById("lock-status").innerText = "CONTROLS LOCKED (1.5s)";
                    setTimeout(() => {
                        movementLocked = false;
                        document.getElementById("lock-status").innerText = "";
                    }, 1500);

                    spawnPellets();
                }
            }
        });
    }

    function draw() {
        ctx.fillStyle = "#0d1117";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw grid lines
        ctx.strokeStyle = "rgba(102, 252, 241, 0.08)";
        for (let x = 0; x < canvas.width; x += GRID_SIZE) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += GRID_SIZE) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // Render Snake
        snake.forEach((segment, index) => {
            ctx.fillStyle = index === 0 ? "#66fcf1" : "#45a29e";
            ctx.shadowBlur = index === 0 ? 12 : 0;
            ctx.shadowColor = "#66fcf1";
            ctx.fillRect(segment.x, segment.y, GRID_SIZE - 2, GRID_SIZE - 2);
        });
        ctx.shadowBlur = 0;

        // Render Pellets and Words with larger labels
        pellets.forEach(pellet => {
            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0055";
            ctx.fillRect(pellet.x, pellet.y, GRID_SIZE - 2, GRID_SIZE - 2);

            // Increased font size from 16px to bold 22px
            ctx.font = "bold 22px 'Courier New', monospace";
            ctx.textAlign = "center";

            // Scaled text background box for higher readability
            const textWidth = ctx.measureText(pellet.word).width;
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(
                pellet.x + (GRID_SIZE / 2) - (textWidth / 2) - 8,
                pellet.y - 32,
                textWidth + 16,
                28
            );

            // High-contrast text label placed clearly above the pellet
            ctx.fillStyle = "#66fcf1";
            ctx.fillText(pellet.word, pellet.x + GRID_SIZE / 2, pellet.y - 10);
        });
        ctx.shadowBlur = 0;
    }

    window.addEventListener("keydown", e => {
        if (movementLocked) return;

        switch (e.key) {
            case "ArrowUp":
                if (dy === 0) { dx = 0; dy = -GRID_SIZE; }
                break;
            case "ArrowDown":
                if (dy === 0) { dx = 0; dy = GRID_SIZE; }
                break;
            case "ArrowLeft":
                if (dx === 0) { dx = -GRID_SIZE; dy = 0; }
                break;
            case "ArrowRight":
                if (dx === 0) { dx = GRID_SIZE; dy = 0; }
                break;
        }
    });

    function triggerGameOver() {
        clearInterval(gameInterval);
        document.getElementById("final-score").innerText = score;
        document.getElementById("game-over-screen").style.display = "flex";
    }

    function resetGame() {
        init();
    }

    init();
</script>

</body>
</html>
