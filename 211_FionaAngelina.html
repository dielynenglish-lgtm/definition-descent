<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hidden Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    #game-container { width: 800px; height: 600px; background: #16213e; border-radius: 12px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    /* Header Info */
    .top-bar { width: 100%; display: flex; justify-content: space-between; font-size: 24px; font-weight: bold; color: #f1c40f; }
    
    /* Vault & Animation */
    .vault-container { position: relative; width: 180px; height: 180px; display: flex; justify-content: center; align-items: center; }
    .vault { width: 160px; height: 160px; background: #95a5a6; border: 8px solid #7f8c8d; border-radius: 20px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 15px #000; transition: transform 0.1s; }
    .vault-handle { width: 60px; height: 60px; border: 8px solid #34495e; border-radius: 50%; position: relative; }
    .vault-handle::after { content: ''; position: absolute; top: 18px; left: -10px; width: 64px; height: 8px; background: #34495e; }
    
    /* Vault Animations */
    .shake { animation: shakeAnim 0.5s; background: #e74c3c !important; }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .open { background: #f1c40f !important; border-color: #f39c12 !important; }
    
    /* Clue Tablet */
    .clue-tablet { width: 90%; background: #0f3460; border: 3px solid #e94560; border-radius: 10px; padding: 15px; text-align: center; min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    
    /* Treasure Chests (Options) */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; margin-bottom: 10px; }
    .chest-btn { background: #e94560; color: #fff; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .chest-btn:hover { background: #ff6b81; transform: translateY(-2px); }
    
    /* Overlays */
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; z-index: 10; }
    .overlay h1 { font-size: 48px; color: #f1c40f; margin-bottom: 20px; }
    .overlay p { font-size: 24px; margin-bottom: 30px; }
    .start-btn { padding: 15px 40px; font-size: 22px; font-weight: bold; background: #2ecc71; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .start-btn:hover { background: #27ae60; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div>Time Left: <span id="timer">60</span>s</div>
    <div>Score: <span id="score">0</span></div>
  </div>

  <!-- Silver Vault -->
  <div class="vault-container">
    <div id="vault" class="vault">
      <div class="vault-handle"></div>
    </div>
  </div>

  <!-- Clue Tablet -->
  <div class="clue-tablet">
    <p id="clue-text">Click Start Mission to begin!</p>
  </div>

  <!-- Treasure Chest Options -->
  <div class="options-grid" id="options-container">
    <button class="chest-btn" disabled>-</button>
    <button class="chest-btn" disabled>-</button>
    <button class="chest-btn" disabled>-</button>
    <button class="chest-btn" disabled>-</button>
  </div>

  <!-- Start Overlay -->
  <div id="start-overlay" class="overlay">
    <h1>THE HIDDEN VAULT</h1>
    <button class="start-btn" onclick="startGame()">MISSION START</button>
  </div>

  <!-- End Overlay -->
  <div id="end-overlay" class="overlay" style="display: none;">
    <h1>MISSION COMPLETE</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <button class="start-btn" onclick="startGame()">TRY AGAIN</button>
  </div>
</div>

<script>
  const wordList = [
    { word: "Communication", clue: "The process of sharing information, ideas, or feelings with others." },
    { word: "Conventional", clue: "Following traditional ways of doing things rather than new or unusual methods." },
    { word: "Fascinating", clue: "Extremely interesting, attractive, or captivating." },
    { word: "Generate", clue: "To produce or create something, such as heat, electricity, or new ideas." },
    { word: "Scent", clue: "A pleasant smell, especially one given off by a flower, plant, or perfume." },
    { word: "Prompt", clue: "Done quickly and without delay, or causing someone to take action." },
    { word: "Nutrient", clue: "A substance that plants, animals, and people need to live and grow." }
  ];

  let currentQuestion = {};
  let score = 0;
  let timeLeft = 60;
  let timerInterval = null;
  let questionPool = []; // 題目池

  function startGame() {
    score = 0;
    timeLeft = 60;
    questionPool = [...wordList]; // 重置並複製完整題目庫
    
    document.getElementById("score").innerText = score;
    document.getElementById("timer").innerText = timeLeft;
    document.getElementById("start-overlay").style.display = "none";
    document.getElementById("end-overlay").style.display = "none";
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById("timer").innerText = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);

    nextQuestion();
  }

  function nextQuestion() {
    // 當題目池空了（7個單字都考過），重新補充，達到不重複輪播效果
    if (questionPool.length === 0) {
      questionPool = [...wordList];
    }

    // 從題目池隨機抽一題並移除，確保不會連續重複
    const randomIndex = Math.floor(Math.random() * questionPool.length);
    currentQuestion = questionPool.splice(randomIndex, 1)[0];

    document.getElementById("clue-text").innerText = currentQuestion.clue;

    // 產生選項（確保包含正解與 3 個干擾項）
    let choices = [currentQuestion.word];
    while (choices.length < 4) {
      let randomWord = wordList[Math.floor(Math.random() * wordList.length)].word;
      if (!choices.includes(randomWord)) {
        choices.push(randomWord);
      }
    }
    choices.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "chest-btn";
      btn.innerText = choice;
      btn.onclick = () => checkAnswer(choice);
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(selectedWord) {
    const vault = document.getElementById("vault");
    if (selectedWord === currentQuestion.word) {
      score += 10;
      document.getElementById("score").innerText = score;
      vault.classList.add("open");
      setTimeout(() => {
        vault.classList.remove("open");
        nextQuestion();
      }, 500);
    } else {
      vault.classList.add("shake");
      setTimeout(() => {
        vault.classList.remove("shake");
      }, 500);
    }
  }

  function endGame() {
    clearInterval(timerInterval);
    document.getElementById("final-score").innerText = score;
    document.getElementById("end-overlay").style.display = "flex";
  }
</script>

</body>
</html>
