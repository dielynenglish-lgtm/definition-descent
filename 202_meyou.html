<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Pop Vocabulary Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            color: #fff;
        }

        /* Screen Shake Effect */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); }
            20%, 80% { transform: translate3d(6px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* HUD Header */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Command Center Box */
        #command-center {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(8px);
            z-index: 10;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #command-center h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #definition-display {
            font-size: 22px;
            line-height: 1.4;
            font-weight: 600;
        }

        /* Balloon Area */
        #game-area {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .balloon {
            position: absolute;
            bottom: -120px;
            width: 85px;
            height: 105px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 3px 3px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 12px solid inherit;
        }

        .balloon-text {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            padding: 5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            word-break: break-word;
            pointer-events: none;
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: #16a34a;
            transform: scale(1.05);
        }
    </style>
</head>
<body id="game-body">

    <!-- HUD -->
    <div id="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div>TIME: <span id="timer">90</span>s</div>
    </div>

    <!-- Command Center -->
    <div id="command-center">
        <h2>Target Definition</h2>
        <div id="definition-display">Press Start to Play!</div>
    </div>

    <!-- Game Playing Field -->
    <div id="game-area"></div>

    <!-- Start Overlay -->
    <div id="start-screen" class="overlay">
        <h1>🎈 BALLOON POP 🎈</h1>
        <p>Pop the balloon matching the definition in the Command Center!</p>
        <button class="btn" onclick="startGame()">START GAME</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="end-screen" class="overlay" style="display: none;">
        <h1>TIME'S UP!</h1>
        <h2>FINAL SCORE: <span id="final-score">0</span></h2>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>

    <script>
        // 10 Vocabulary Words and Definitions
        const vocabulary = [
            { word: "grip", def: "To hold tightly with your hand." },
            { word: "adjustment", def: "A small change made to improve or correct something." },
            { word: "strain", def: "A force or pressure pulling or pushing on something." },
            { word: "flexible", def: "Capable of bending easily without breaking." },
            { word: "loosen", def: "To make or become less tight." },
            { word: "slightly", def: "To a small degree; a little bit." },
            { word: "demonstrate", def: "To clearly show or explain how to do something." },
            { word: "carefully", def: "Done with caution, attention, and thought." },
            { word: "flooded", def: "Covered or filled completely with a large amount." },
            { word: "penalty", def: "A punishment or loss of points for a mistake or rule break." }
        ];

        const balloonColors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

        let score = 0;
        let timeLeft = 90;
        let gameInterval = null;
        let spawnInterval = null;
        let currentTarget = null;
        let activeBalloons = [];

        const gameArea = document.getElementById('game-area');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const definitionDisplay = document.getElementById('definition-display');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameBody = document.getElementById('game-body');

        function startGame() {
            score = 0;
            timeLeft = 90;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            
            // Clear existing balloons
            gameArea.innerHTML = '';
            activeBalloons = [];

            startScreen.style.display = 'none';
            endScreen.style.display = 'none';

            selectNewTarget();

            // Main 90s countdown timer
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Spawn rate: 1 balloon per second
            spawnInterval = setInterval(spawnBalloon, 1000);
            
            // Pre-fill screen with initial balloons
            for(let i = 0; i < 8; i++) {
                spawnBalloon(true);
            }
        }

        function selectNewTarget() {
            const randomIndex = Math.floor(Math.random() * vocabulary.length);
            currentTarget = vocabulary[randomIndex];
            definitionDisplay.textContent = `"${currentTarget.def}"`;
        }

        function spawnBalloon(randomStartHeight = false) {
            // Cap visible floating balloons around 15-20 max to avoid clutter
            if (activeBalloons.length >= 18) return;

            const balloon = document.createElement('div');
            balloon.className = 'balloon';

            // Pick random word (50% chance to pick the correct target to keep it frequent)
            let chosenVocab;
            if (Math.random() < 0.5) {
                chosenVocab = currentTarget;
            } else {
                chosenVocab = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            }

            balloon.dataset.word = chosenVocab.word;

            // Random color
            const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
            balloon.style.backgroundColor = color;
            balloon.style.color = color; // For the arrow pseudoelement match

            // Random Horizontal position
            const posX = Math.random() * (window.innerWidth - 100);
            balloon.style.left = `${posX}px`;

            // Text Label
            const label = document.createElement('span');
            label.className = 'balloon-text';
            label.textContent = chosenVocab.word;
            balloon.appendChild(label);

            // Floating speed
            const speed = 1.5 + Math.random() * 2;
            let currentY = randomStartHeight ? Math.random() * (window.innerHeight - 200) : -120;

            balloon.style.bottom = `${currentY}px`;
            gameArea.appendChild(balloon);

            const balloonData = {
                element: balloon,
                y: currentY,
                speed: speed,
                interval: null
            };

            // Animate Balloon upward
            balloonData.interval = setInterval(() => {
                balloonData.y += balloonData.speed;
                balloon.style.bottom = `${balloonData.y}px`;

                // Remove balloon when it goes off screen top
                if (balloonData.y > window.innerHeight + 120) {
                    removeBalloon(balloonData);
                }
            }, 20);

            // Click listener
            balloon.addEventListener('pointerdown', () => handleBalloonClick(balloonData));

            activeBalloons.push(balloonData);
        }

        function handleBalloonClick(balloonData) {
            const word = balloonData.element.dataset.word;

            if (word === currentTarget.word) {
                // Correct match: +10 points
                score += 10;
                scoreDisplay.textContent = score;
                removeBalloon(balloonData);
                selectNewTarget();
            } else {
                // Incorrect match: -5 points & violent screen shake
                score = Math.max(0, score - 5);
                scoreDisplay.textContent = score;
                
                gameBody.classList.remove('shake');
                void gameBody.offsetWidth; // Trigger reflow
                gameBody.classList.add('shake');

                removeBalloon(balloonData);
            }
        }

        function removeBalloon(balloonData) {
            clearInterval(balloonData.interval);
            if (balloonData.element.parentNode) {
                balloonData.element.parentNode.removeChild(balloonData.element);
            }
            activeBalloons = activeBalloons.filter(b => b !== balloonData);
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            activeBalloons.forEach(b => clearInterval(b.interval));
            
            finalScoreDisplay.textContent = score;
            endScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
