<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vocabulary Money Ladder Game Show</title>
  <style>
    :root {
      --bg-color: #0b1d3a;
      --panel-bg: #162a4d;
      --gold: #ffd700;
      --white: #ffffff;
      --correct: #28a745;
      --wrong: #dc3545;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--white);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }

    .game-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      background: var(--panel-bg);
      border: 4px solid var(--gold);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
    }

    .main-stage {
      flex: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 10px;
    }

    .timer-box {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--gold);
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--gold);
    }

    .question-box {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      min-height: 80px;
      font-size: 1.2rem;
      text-align: center;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn-option {
      background: var(--panel-bg);
      color: var(--white);
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 15px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .btn-option:hover {
      background: var(--gold);
      color: var(--bg-color);
    }

    .ladder-panel {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column-reverse;
      gap: 5px;
    }

    .ladder-step {
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      color: var(--gold);
      background: rgba(255, 215, 0, 0.1);
    }

    .ladder-step.active {
      background: var(--gold);
      color: var(--bg-color);
      box-shadow: 0 0 10px var(--gold);
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 29, 58, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      text-align: center;
    }

    .hidden { display: none !important; }

    .btn-action {
      background: var(--gold);
      color: var(--bg-color);
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-action:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div class="game-container" style="position: relative;">

  <!-- Main Stage -->
  <div class="main-stage">
    <div class="header-bar">
      <h2>VOCABULARY GAME SHOW</h2>
      <div class="timer-box">⏰ <span id="timer">60</span>s</div>
    </div>

    <div class="question-box" id="question">
      Definition will appear here...
    </div>

    <div class="options-grid" id="options">
      <!-- Options injected by JS -->
    </div>
  </div>

  <!-- Money Ladder Panel -->
  <div class="ladder-panel" id="ladder">
    <!-- Steps populated by JS -->
  </div>

  <!-- Start / Game Over Overlay -->
  <div id="overlay" class="overlay">
    <h1 id="overlay-title" style="color: var(--gold); font-size: 2.5rem;">MONEY LADDER TRIVIA</h1>
    <p id="overlay-msg" style="font-size: 1.2rem;">Answer 10 vocabulary questions to reach the top!</p>
    <button class="btn-action" id="start-btn" onclick="startGame()">PLAY GAME</button>
  </div>

</div>

<script>
  const moneyValues = ["$100", "$500", "$1,000", "$2,500", "$5,000", "$10,000", "$25,000", "$50,000", "$100,000", "$1,000,000"];

  const vocabularyBank = [
    { word: "breakthrough", def: "A sudden, dramatic, and important discovery or development." },
    { word: "laboratory", def: "A room or building equipped for scientific experiments or research." },
    { word: "workshop", def: "A room or building in which tools and work are used to manufacture or repair things." },
    { word: "calculation", def: "A mathematical determination of the size or number of something." },
    { word: "envision", def: "To imagine as a future possibility; visualize." },
    { word: "striking", def: "Attracting attention or notice through being unusual or extreme." },
    { word: "insight", def: "The capacity to gain an accurate and deep intuitive understanding." },
    { word: "innovation", def: "A new method, idea, or product that brings creative progress." },
    { word: "hypothesis", def: "A proposed explanation made on the basis of limited evidence as a starting point." },
    { word: "formulate", def: "To create or prepare methodically; to express systematically." }
  ];

  let currentLevel = 0;
  let questions = [];
  let timerInterval = null;
  let timeLeft = 60;

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function initLadder() {
    const ladderEl = document.getElementById("ladder");
    ladderEl.innerHTML = "";
    moneyValues.forEach((val, idx) => {
      const step = document.createElement("div");
      step.className = `ladder-step ${idx === currentLevel ? 'active' : ''}`;
      step.id = `step-${idx}`;
      step.innerText = `${idx + 1}. ${val}`;
      ladderEl.appendChild(step);
    });
  }

  function startGame() {
    currentLevel = 0;
    timeLeft = 60;
    questions = shuffle([...vocabularyBank]);
    document.getElementById("overlay").classList.add("hidden");
    document.getElementById("timer").innerText = timeLeft;
    
    initLadder();
    startTimer();
    loadQuestion();
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById("timer").innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endGame(false, "Time's up! You ran out of time.");
      }
    }, 1000);
  }

  function loadQuestion() {
    const currentQ = questions[currentLevel];
    document.getElementById("question").innerText = `Which word means: "${currentQ.def}"?`;

    // Create 4 choices: correct answer + 3 random incorrect choices
    let choices = [currentQ.word];
    let wrongPool = vocabularyBank.filter(item => item.word !== currentQ.word);
    shuffle(wrongPool);
    
    for (let i = 0; i < 3; i++) {
      choices.push(wrongPool[i].word);
    }
    choices = shuffle(choices);

    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";
    
    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "btn-option";
      btn.innerText = choice;
      btn.onclick = () => checkAnswer(choice, currentQ.word);
      optionsContainer.appendChild(btn);
    });

    updateLadder();
  }

  function updateLadder() {
    moneyValues.forEach((_, idx) => {
      const step = document.getElementById(`step-${idx}`);
      if (idx === currentLevel) {
        step.classList.add("active");
      } else {
        step.classList.remove("active");
      }
    });
  }

  function checkAnswer(selected, correct) {
    if (selected === correct) {
      currentLevel++;
      if (currentLevel >= questions.length) {
        clearInterval(timerInterval);
        endGame(true, "CONGRATULATIONS! You won $1,000,000!");
      } else {
        loadQuestion();
      }
    } else {
      clearInterval(timerInterval);
      endGame(false, `Wrong choice! The correct word was "${correct}".`);
    }
  }

  function endGame(isWin, message) {
    const overlay = document.getElementById("overlay");
    const title = document.getElementById("overlay-title");
    const msg = document.getElementById("overlay-msg");
    const btn = document.getElementById("start-btn");

    title.innerText = isWin ? "GRAND PRIZE WINNER!" : "GAME OVER";
    title.style.color = isWin ? "var(--gold)" : "var(--wrong)";
    msg.innerText = message;
    btn.innerText = "TRY AGAIN";
    overlay.classList.remove("hidden");
  }
</script>

</body>
</html
