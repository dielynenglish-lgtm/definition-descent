<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defend the Castle: Spellcaster Typing Ramp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 600px;
            background: linear-gradient(to bottom, #16213e, #0f3460);
            border: 4px solid #e94560;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }

        /* Battlefield & Background */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background-color: #272744;
            border-top: 4px solid #4f3b78;
        }

        /* Castle Elements */
        #castle {
            position: absolute;
            right: 0;
            bottom: 120px;
            width: 140px;
            height: 320px;
            background-color: #4a4e69;
            border-left: 6px solid #22223b;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .crenellation {
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(
                90deg,
                #4a4e69,
                #4a4e69 20px,
                transparent 20px,
                transparent 40px
            );
        }

        /* Active Definition Scroll */
        #definition-box {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            padding: 15px;
            background: rgba(15, 52, 96, 0.95);
            border: 2px solid #e94560;
            border-radius: 8px;
            color: #f8f9fa;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }

        #definition-box h3 {
            font-size: 16px;
            color: #e94560;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #definition-text {
            font-size: 16px;
            font-style: italic;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* HUD Headers */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(22, 33, 62, 0.85);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #4f3b78;
        }

        #health-bar-container {
            width: 180px;
            height: 18px;
            background-color: #22223b;
            border-radius: 9px;
            overflow: hidden;
            margin-top: 5px;
            border: 1px solid #9a8c98;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.3s ease;
        }

        /* Play Area & Enemies */
        #spawn-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 860px;
            height: 100%;
        }

        .monster {
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #ff0055;
            border: 3px solid #ff5400;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: transform 0.1s;
            z-index: 5;
        }

        .monster:hover {
            transform: scale(1.08);
        }

        .monster-icon {
            font-size: 38px;
            pointer-events: none;
        }

        /* Floating Input Above Enemy - Enlarged Text & Input */
        .input-container {
            position: absolute;
            top: -75px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #00f5d4;
            white-space: nowrap;
            z-index: 10;
        }

        .word-hint {
            font-size: 18px;
            font-weight: bold;
            color: #00f5d4;
            margin-bottom: 4px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 5px rgba(0, 245, 212, 0.5);
        }

        .spell-input {
            width: 140px;
            background: #111;
            border: 2px solid #00f5d4;
            color: #fff;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            padding: 4px 6px;
            outline: none;
        }

        /* Floating Combat Text FX */
        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 20;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-30px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(0.8);
            }
        }

        /* AoE Visual Effect */
        .aoe-effect {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 245, 212, 0.8) 0%, rgba(241, 91, 181, 0) 70%);
            pointer-events: none;
            animation: explode 0.5s ease-out forwards;
            z-index: 15;
        }

        @keyframes explode {
            0% {
                width: 0px;
                height: 0px;
                opacity: 1;
            }
            100% {
                width: 260px;
                height: 260px;
                opacity: 0;
            }
        }

        /* Game Over / Victory Overlay */
        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #game-overlay h1 {
            font-size: 48px;
            color: #e94560;
            margin-bottom: 10px;
        }

        #game-overlay p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #cccccc;
        }

        #start-btn {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        #start-btn:hover {
            background-color: #ff6b6b;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-panel">
            <div>Castle Integrity</div>
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>
        </div>
        <div class="hud-panel">
            <div>Wave</div>
            <div id="wave-display" style="font-size: 20px; font-weight: bold; color: #00f5d4;">1 / 3</div>
        </div>
    </div>

    <div id="definition-box">
        <h3>Active Spell Scroll</h3>
        <div id="definition-text">Type the word above an enemy to defend!</div>
    </div>

    <div id="spawn-area"></div>

    <div id="castle">
        <div class="crenellation"></div>
    </div>
    <div id="ground"></div>

    <div id="game-overlay">
        <h1 id="overlay-title">Spellcaster Defense</h1>
        <p id="overlay-desc">Type the vocabulary words above enemies to destroy them before they reach the castle!</p>
        <button id="start-btn" onclick="startGame()">Begin Battle</button>
    </div>
</div>

<script>
    const vocabularyList = [
        { word: "conduct", definition: "To organize, lead, or carry out a specific task or activity." },
        { word: "commander", definition: "A person in authority who holds official control or leadership." },
        { word: "research", definition: "The systematic investigation and study of materials to establish facts." },
        { word: "immune", definition: "Protected, resistant, or safe from a particular disease or effect." },
        { word: "colleague", definition: "A person with whom one works in a profession or business." },
        { word: "stance", definition: "A mental attitude, position, or physical posture taken regarding something." },
        { word: "defend", definition: "To protect from harm, attack, or danger." },
        { word: "magical", definition: "Having powers derived from or relating to supernatural forces." },
        { word: "spellcaster", definition: "A practitioner who uses power to cast incantations." },
        { word: "barrier", definition: "A structure or obstacle that prevents movement or access." }
    ];

    let castleHealth = 100;
    let currentWave = 1;
    const maxWaves = 3;
    let enemiesActive = [];
    let gameInterval = null;
    let spawnInterval = null;
    let isGameRunning = false;
    let activeDefinitionWord = null;

    const spawnArea = document.getElementById('spawn-area');
    const healthBar = document.getElementById('health-bar');
    const waveDisplay = document.getElementById('wave-display');
    const definitionText = document.getElementById('definition-text');
    const overlay = document.getElementById('game-overlay');

    function startGame() {
        castleHealth = 100;
        currentWave = 1;
        enemiesActive = [];
        spawnArea.innerHTML = '';
        updateHUD();
        overlay.style.display = 'none';
        isGameRunning = true;

        selectRandomDefinition();
        startWave();

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 50);
    }

    function selectRandomDefinition() {
        const randomIndex = Math.floor(Math.random() * vocabularyList.length);
        const selected = vocabularyList[randomIndex];
        activeDefinitionWord = selected.word;
        definitionText.textContent = `"${selected.definition}"`;
    }

    function startWave() {
        let spawnedCount = 0;
        const totalToSpawn = currentWave * 4 + 2;

        if (spawnInterval) clearInterval(spawnInterval);

        // Increased spawn delay (5000ms instead of 3000ms) to give players more time
        spawnInterval = setInterval(() => {
            if (!isGameRunning) return;
            if (spawnedCount < totalToSpawn) {
                spawnEnemy();
                spawnedCount++;
            } else {
                clearInterval(spawnInterval);
            }
        }, 5000 / currentWave);
    }

    function spawnEnemy() {
        const enemyElem = document.createElement('div');
        enemyElem.className = 'monster';
        
        const vocabObj = vocabularyList[Math.floor(Math.random() * vocabularyList.length)];
        
        const yPos = Math.floor(Math.random() * 240) + 180;
        enemyElem.style.left = '0px';
        enemyElem.style.top = `${yPos}px`;
        
        enemyElem.innerHTML = `<span class="monster-icon">👾</span>`;

        // Reduced movement speed (0.2 + wave multiplier) for slower progression
        const monsterData = {
            element: enemyElem,
            x: 0,
            y: yPos,
            speed: 0.2 + (currentWave * 0.1),
            word: vocabObj.word,
            inputContainer: null,
            inputElem: null
        };

        spawnArea.appendChild(enemyElem);
        enemiesActive.push(monsterData);

        // Display vocabulary word and input box on spawn automatically
        activateEnemyInput(monsterData);
    }

    function activateEnemyInput(monster) {
        const container = document.createElement('div');
        container.className = 'input-container';

        const hint = document.createElement('div');
        hint.className = 'word-hint';
        hint.textContent = monster.word.toUpperCase();

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'spell-input';
        input.placeholder = 'Type...';

        container.appendChild(hint);
        container.appendChild(input);
        monster.element.appendChild(container);

        monster.inputContainer = container;
        monster.inputElem = input;

        // Auto-focus input when clicked
        monster.element.addEventListener('click', (e) => {
            e.stopPropagation();
            input.focus();
        });

        // Automatically focus the newest enemy if nothing else is focused
        if (document.activeElement.tagName !== 'INPUT') {
            input.focus();
        }

        input.addEventListener('input', () => {
            const typed = input.value.trim().toLowerCase();
            if (typed === monster.word.toLowerCase()) {
                castSpell(monster);
            }
        });
    }

    function castSpell(targetMonster) {
        const isAoE = (targetMonster.word.toLowerCase() === activeDefinitionWord.toLowerCase());

        if (isAoE) {
            triggerAoE(targetMonster);
            createFloatingText("AoE BLAST! Defended!", targetMonster.x, targetMonster.y, "#00f5d4");
            selectRandomDefinition();
        } else {
            createFloatingText("Correct!", targetMonster.x, targetMonster.y, "#ffbe0b");
            destroyEnemy(targetMonster);
        }

        checkWaveProgress();
    }

    function triggerAoE(centerMonster) {
        const radius = 180;
        const centerX = centerMonster.x + 40;
        const centerY = centerMonster.y + 40;

        const blast = document.createElement('div');
        blast.className = 'aoe-effect';
        blast.style.left = `${centerX - 130}px`;
        blast.style.top = `${centerY - 130}px`;
        spawnArea.appendChild(blast);
        setTimeout(() => blast.remove(), 500);

        const toDestroy = enemiesActive.filter(m => {
            const mCenterX = m.x + 40;
            const mCenterY = m.y + 40;
            const dist = Math.hypot(mCenterX - centerX, mCenterY - centerY);
            return dist <= radius;
        });

        toDestroy.forEach(m => destroyEnemy(m));
    }

    function destroyEnemy(monster) {
        if (monster.inputContainer) monster.inputContainer.remove();
        monster.element.remove();
        enemiesActive = enemiesActive.filter(m => m !== monster);
    }

    function createFloatingText(text, x, y, color) {
        const ft = document.createElement('div');
        ft.className = 'floating-text';
        ft.textContent = text;
        ft.style.left = `${x}px`;
        ft.style.top = `${y - 20}px`;
        ft.style.color = color;
        spawnArea.appendChild(ft);

        setTimeout(() => ft.remove(), 1200);
    }

    function gameLoop() {
        if (!isGameRunning) return;

        const castleX = 840;

        for (let i = enemiesActive.length - 1; i >= 0; i--) {
            const m = enemiesActive[i];
            m.x += m.speed;
            m.element.style.left = `${m.x}px`;

            if (m.x >= castleX) {
                damageCastle(15);
                createFloatingText("Castle Hit!", m.x - 40, m.y, "#e94560");
                destroyEnemy(m);
                checkWaveProgress();
            }
        }
    }

    function damageCastle(amount) {
        castleHealth = Math.max(0, castleHealth - amount);
        updateHUD();

        if (castleHealth <= 0) {
            endGame(false);
        }
    }

    function checkWaveProgress() {
        if (enemiesActive.length === 0 && isGameRunning) {
            if (currentWave < maxWaves) {
                currentWave++;
                updateHUD();
                startWave();
            } else {
                endGame(true);
            }
        }
    }

    function updateHUD() {
        healthBar.style.width = `${castleHealth}%`;
        waveDisplay.textContent = `${currentWave} / ${maxWaves}`;
    }

    function endGame(victory) {
        isGameRunning = false;
        clearInterval(gameInterval);
        clearInterval(spawnInterval);

        document.getElementById('overlay-title').textContent = victory ? "Victory!" : "Defeated!";
        document.getElementById('overlay-desc').textContent = victory 
            ? "You successfully defended the castle walls with your vocabulary spells!" 
            : "The monsters breached your defenses. Study up and try again!";
        
        document.getElementById('start-btn').textContent = "Play Again";
        overlay.style.display = 'flex';
    }
</script>

</body>
</html>
