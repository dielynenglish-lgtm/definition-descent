<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Memory Matrix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    /* Dashboard Controls */
    .dashboard {
      display: flex;
      gap: 30px;
      margin-bottom: 20px;
      background: white;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2c3e50;
    }

    /* 4x4 Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 130px);
      grid-template-rows: repeat(4, 130px);
      gap: 15px;
      perspective: 1000px;
    }

    /* Card Styling */
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
      cursor: default;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      user-select: none;
    }

    .card-front {
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      font-size: 2rem;
      font-weight: bold;
    }

    .card-back {
      background-color: #ffffff;
      color: #2c3e50;
      transform: rotateY(180deg);
      border: 2px solid #3498db;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .card.matched .card-back {
      background-color: #e8f8f5;
      border-color: #2ecc71;
      color: #27ae60;
    }

    /* Modal / Completion Screen */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .modal p {
      margin: 10px 0;
      color: #555;
    }

    .rating {
      font-size: 1.4rem;
      font-weight: bold;
      color: #f39c12;
      margin: 15px 0;
    }

    .btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <h1>Memory Matrix</h1>

  <div class="dashboard">
    <div class="stat-box">
      <div class="stat-label">Time Left</div>
      <div class="stat-value" id="timer">90s</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Moves</div>
      <div class="stat-value" id="moves">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Matches</div>
      <div class="stat-value" id="matches">0/8</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <!-- Victory / Game Over Overlay -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modal-title">Victory!</h2>
      <p id="modal-msg">You matched all terms successfully.</p>
      <div class="rating" id="modal-rating"></div>
      <button class="btn" onclick="initGame()">Play Again</button>
    </div>
  </div>

  <script>
    // 8 Vocabulary pairs using your requested words
    const vocabData = [
      { word: "Version", def: "A particular form or iteration of something." },
      { word: "Vast", def: "Of very great extent, size, or quantity." },
      { word: "Undertake", def: "To commit oneself to and begin a task." },
      { word: "Extraordinary", def: "Very unusual, remarkable, or exceptional." },
      { word: "Landscape", def: "All the visible features of an area of land." },
      { word: "Dusty", def: "Covered with or full of fine dry powder." },
      { word: "Diverse", def: "Showing a great deal of variety; very different." },
      { word: "Dynamic", def: "Constant change, activity, or progress." }
    ];

    let cards = [];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let matches = 0;
    let timeLeft = 90;
    let timerInterval = null;

    const gridContainer = document.getElementById('grid');
    const timerDisplay = document.getElementById('timer');
    const movesDisplay = document.getElementById('moves');
    const matchesDisplay = document.getElementById('matches');
    const overlay = document.getElementById('overlay');

    function initGame() {
      gridContainer.innerHTML = '';
      overlay.classList.remove('active');
      firstCard = null;
      secondCard = null;
      lockBoard = false;
      moves = 0;
      matches = 0;
      timeLeft = 90;

      movesDisplay.textContent = moves;
      matchesDisplay.textContent = `0/8`;
      timerDisplay.textContent = `${timeLeft}s`;

      clearInterval(timerInterval);
      startTimer();

      cards = [];
      vocabData.forEach((pair, index) => {
        cards.push({ id: index, text: pair.word });
        cards.push({ id: index, text: pair.def });
      });

      cards.sort(() => Math.random() - 0.5);

      cards.forEach(data => {
        const cardEl = document.createElement('div');
        cardEl.classList.add('card');
        cardEl.dataset.id = data.id;

        cardEl.innerHTML = `
          <div class="card-face card-front">?</div>
          <div class="card-face card-back">${data.text}</div>
        `;

        cardEl.addEventListener('click', flipCard);
        gridContainer.appendChild(cardEl);
      });
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame(false);
        }
      }, 1000);
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return;

      this.classList.add('flipped');

      if (!firstCard) {
        firstCard = this;
        return;
      }

      secondCard = this;
      moves++;
      movesDisplay.textContent = moves;

      checkMatch();
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.id === secondCard.dataset.id;

      if (isMatch) {
        disableCards();
      } else {
        unflipCards();
      }
    }

    function disableCards() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');

      resetBoard();
      matches++;
      matchesDisplay.textContent = `${matches}/8`;

      if (matches === 8) {
        clearInterval(timerInterval);
        setTimeout(() => endGame(true), 500);
      }
    }

    function unflipCards() {
      lockBoard = true;

      // 1-second flip back delay
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [firstCard, secondCard] = [null, null];
      lockBoard = false;
    }

    function calculateRating(moveCount, timeRemaining) {
      if (moveCount <= 12 && timeRemaining >= 45) {
        return "⭐⭐⭐ (3/3 Stars - Master)";
      } else if (moveCount <= 18 && timeRemaining >= 20) {
        return "⭐⭐ (2/3 Stars - Proficient)";
      } else {
        return "⭐ (1/3 Star - Needs Practice)";
      }
    }

    function endGame(isVictory) {
      const title = document.getElementById('modal-title');
      const msg = document.getElementById('modal-msg');
      const rating = document.getElementById('modal-rating');

      if (isVictory) {
        title.textContent = "Congratulations!";
        msg.textContent = `Completed in ${moves} moves with ${timeLeft} seconds remaining.`;
        rating.textContent = calculateRating(moves, timeLeft);
      } else {
        title.textContent = "Time's Up!";
        msg.textContent = "You ran out of time before finding all matches.";
        rating.textContent = "Rating: FAILED";
      }

      overlay.classList.add('active');
    }

    initGame();
  </script>
</body>
</html>y
