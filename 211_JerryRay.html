<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-A-Word Arcade</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 5px;
      color: #f39c12;
      text-shadow: 2px 2px #000;
    }
    #game-info {
      display: flex;
      gap: 30px;
      font-size: 1.2rem;
      margin-bottom: 15px;
      font-weight: bold;
    }
    #definition-box {
      background: #2d2d44;
      border: 2px solid #f39c12;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 1.2rem;
      text-align: center;
      width: 80%;
      max-width: 600px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 600px;
    }
    .hole {
      position: relative;
      background: #3e2723;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #5d4037;
      box-shadow: inset 0 10px 10px rgba(0,0,0,0.7);
    }
    .mole {
      position: absolute;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 85%;
      background: #8d6e63;
      border-top-left-radius: 50px;
      border-top-right-radius: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: bottom 0.2s ease-out;
      box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3);
      padding: 5px;
      box-sizing: border-box;
      word-break: break-word;
    }
    .mole.up {
      bottom: 0;
    }
    .mole:active {
      background: #a1887f;
    }
    button {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 15px;
      box-shadow: 0 4px #1e8449;
    }
    button:active {
      box-shadow: 0 2px #1e8449;
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <h1>Whack-A-Word</h1>
  <button id="start-btn" onclick="startGame()">Start Game</button>

  <div id="game-info">
    <div>Time Left: <span id="timer">60</span>s</div>
    <div>Score: <span id="score">0</span></div>
  </div>

  <div id="definition-box">Click "Start Game" to begin!</div>

  <div id="grid">
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
  </div>

  <script>
    const vocabulary = [
      { word: "version", definition: "A particular form of something differing in certain respects from an earlier form." },
      { word: "vast", definition: "Of very great extent or quantity; immense." },
      { word: "undertake", definition: "To commit oneself to and begin (an enterprise or responsibility); take on." },
      { word: "extraordinary", definition: "Very unusual or remarkable." },
      { word: "landscape", definition: "All the visible features of an area of countryside or land." },
      { word: "dusty", definition: "Covered with, full of, or resembling dust." },
      { word: "diverse", definition: "Showing a great deal of variety; very different." }
    ];

    let score = 0;
    let timeLeft = 60;
    let timerId = null;
    let molePopInterval = null;
    let currentTarget = null;
    let gameActive = false;

    const moles = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const timerDisplay = document.getElementById('timer');
    const definitionBox = document.getElementById('definition-box');
    const startBtn = document.getElementById('start-btn');

    function getRandomTarget() {
      return vocabulary[Math.floor(Math.random() * vocabulary.length)];
    }

    function setNewTarget() {
      currentTarget = getRandomTarget();
      definitionBox.textContent = currentTarget.definition;
    }

    function popRandomMole() {
      if (!gameActive) return;

      // Hide all moles currently up
      moles.forEach(mole => mole.classList.remove('up'));

      // Choose a random hole
      const randomHoleIndex = Math.floor(Math.random() * moles.length);
      const selectedMole = moles[randomHoleIndex];

      // 60% chance to pop the correct target word (higher frequency)
      let wordToDisplay;
      if (Math.random() < 0.6) {
        wordToDisplay = currentTarget.word;
      } else {
        const otherWords = vocabulary.filter(v => v.word !== currentTarget.word);
        wordToDisplay = otherWords[Math.floor(Math.random() * otherWords.length)].word;
      }

      selectedMole.textContent = wordToDisplay;
      selectedMole.dataset.word = wordToDisplay;
      selectedMole.classList.add('up');

      // Hide mole automatically after 1.2 seconds if not whacked
      setTimeout(() => {
        selectedMole.classList.remove('up');
      }, 1200);
    }

    function whack(moleElement) {
      if (!gameActive || !moleElement.classList.contains('up')) return;

      const clickedWord = moleElement.dataset.word;

      if (clickedWord === currentTarget.word) {
        score += 10;
        scoreDisplay.textContent = score;
        moleElement.classList.remove('up');
        setNewTarget(); // Pick a new definition once correctly matched
      } else {
        score = Math.max(0, score - 5); // Penalty for wrong whack
        scoreDisplay.textContent = score;
        moleElement.classList.remove('up');
      }
    }

    function startGame() {
      score = 0;
      timeLeft = 60;
      gameActive = true;
      scoreDisplay.textContent = score;
      timerDisplay.textContent = timeLeft;
      startBtn.disabled = true;

      setNewTarget();

      // Countdown Timer
      timerId = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      // Mole pop interval
      molePopInterval = setInterval(popRandomMole, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerId);
      clearInterval(molePopInterval);
      moles.forEach(mole => mole.classList.remove('up'));
      definitionBox.textContent = `Game Over! Final Score: ${score}`;
      startBtn.disabled = false;
    }
  </script>
</body>
</html>
