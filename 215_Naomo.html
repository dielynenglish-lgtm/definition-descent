<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11th Grade Vocabulary Pinball</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #0f0c20;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 10px;
    }

    #game-container {
        position: relative;
        width: 440px;
        background: #181433;
        border: 4px solid #3d3470;
        border-radius: 12px;
        box-shadow: 0 0 30px rgba(110, 68, 255, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
    }

    #display-board {
        width: 100%;
        background: #080612;
        border: 2px solid #5d48bf;
        border-radius: 8px;
        padding: 10px 15px;
        margin-bottom: 8px;
        box-shadow: inset 0 0 10px rgba(0, 255, 200, 0.2);
    }

    .hud-line {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: bold;
        color: #00ffcc;
        text-shadow: 0 0 5px #00ffcc;
        margin-bottom: 5px;
    }

    #definition-box {
        background: #120e29;
        border: 1px dashed #7a5cff;
        padding: 8px;
        border-radius: 4px;
        text-align: center;
        font-size: 13px;
        color: #ffe600;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        text-shadow: 0 0 3px #ffe600;
    }

    canvas {
        background: #0d0a1a;
        border: 2px solid #2a2254;
        border-radius: 6px;
        display: block;
    }

    #controls-info {
        margin-top: 8px;
        font-size: 12px;
        color: #aaa;
        text-align: center;
    }

    .key {
        background: #332a63;
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid #5848a8;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="game-container">
    <div id="display-board">
        <div class="hud-line">
            <span>SCORE: <span id="score-val">0</span></span>
            <span>BALLS: <span id="balls-val">3</span></span>
        </div>
        <div id="definition-box">
            <span id="def-text">Press DOWN ARROW or SPACE to Launch Ball!</span>
        </div>
    </div>

    <canvas id="pinball" width="420" height="580"></canvas>

    <div id="controls-info">
        Flipper Left: <span class="key">Left Shift</span> | 
        Flipper Right: <span class="key">Right Shift</span> | 
        Launch: <span class="key">Space / Down</span>
    </div>
</div>

<script>
const vocabList = [
    { word: "breakthrough", def: "A sudden, dramatic, and important discovery or development." },
    { word: "laboratory", def: "A room or building equipped for scientific experiments or research." },
    { word: "workshop", def: "A room or building in which goods are manufactured or repaired." },
    { word: "calculation", def: "A mathematical determination of the size or number of something." },
    { word: "envision", def: "To imagine as a future possibility; to visualize." },
    { word: "striking", def: "Attracting attention or notice through being unusual or extreme." },
    { word: "insight", def: "The capacity to gain an accurate and deep intuitive understanding." }
];

const canvas = document.getElementById("pinball");
const ctx = canvas.getContext("2d");

let score = 0;
let ballsLeft = 3;
let currentTarget = null;
let currentOptions = [];
let gameOver = false;
let ballSaverActive = false;
let ballSaverTimer = 0;
let flipperShrinkTimer = 0;

const keys = { leftShift: false, rightShift: false, launch: false };

window.addEventListener("keydown", (e) => {
    if (e.code === "ShiftLeft") keys.leftShift = true;
    if (e.code === "ShiftRight") keys.rightShift = true;
    if (e.code === "ArrowDown" || e.code === "Space") keys.launch = true;
});

window.addEventListener("keyup", (e) => {
    if (e.code === "ShiftLeft") keys.leftShift = false;
    if (e.code === "ShiftRight") keys.rightShift = false;
    if (e.code === "ArrowDown" || e.code === "Space") keys.launch = false;
});

const ball = {
    x: 400,
    y: 520,
    vx: 0,
    vy: 0,
    radius: 8,
    inPlunger: true,
    reset() {
        this.x = 400;
        this.y = 520;
        this.vx = 0;
        this.vy = 0;
        this.inPlunger = true;
    }
};

const plunger = { charge: 0, maxCharge: 20 };
const baseFlipperLength = 65;

const flippers = {
    left: { x: 120, y: 510, angle: 0.3, restAngle: 0.3, activeAngle: -0.4, length: baseFlipperLength },
    right: { x: 250, y: 510, angle: -0.3, restAngle: -0.3, activeAngle: 0.4, length: baseFlipperLength }
};

const bumpers = [
    { x: 100, y: 160, radius: 38, word: "", flashTimer: 0 },
    { x: 185, y: 100, radius: 38, word: "", flashTimer: 0 },
    { x: 270, y: 160, radius: 38, word: "", flashTimer: 0 }
];

function nextQuestion() {
    const targetIdx = Math.floor(Math.random() * vocabList.length);
    currentTarget = vocabList[targetIdx];

    let distractors = vocabList.filter(item => item.word !== currentTarget.word);
    distractors.sort(() => 0.5 - Math.random());
    
    currentOptions = [currentTarget.word, distractors[0].word, distractors[1].word];
    currentOptions.sort(() => 0.5 - Math.random());

    for (let i = 0; i < 3; i++) {
        bumpers[i].word = currentOptions[i];
    }

    document.getElementById("def-text").innerText = `"${currentTarget.def}"`;
}

nextQuestion();

function updateFlipper(flipper, isActive, isLeft) {
    const targetAngle = isActive ? flipper.activeAngle : flipper.restAngle;
    flipper.angle += (targetAngle - flipper.angle) * 0.4;
}

function checkFlipperCollision(flipper, isLeft) {
    const endX = flipper.x + Math.cos(flipper.angle) * (isLeft ? flipper.length : -flipper.length);
    const endY = flipper.y + Math.sin(flipper.angle) * flipper.length;

    const dx = endX - flipper.x;
    const dy = endY - flipper.y;
    const len = Math.hypot(dx, dy);
    const u = (((ball.x - flipper.x) * dx) + ((ball.y - flipper.y) * dy)) / (len * len);

    if (u >= 0 && u <= 1) {
        const ix = flipper.x + u * dx;
        const iy = flipper.y + u * dy;
        const dist = Math.hypot(ball.x - ix, ball.y - iy);

        if (dist < ball.radius + 6) {
            const angle = Math.atan2(ball.y - iy, ball.x - ix);
            const active = (isLeft && keys.leftShift) || (!isLeft && keys.rightShift);
            const force = active ? 10 : 4;
            ball.vx = Math.cos(angle) * force;
            ball.vy = Math.sin(angle) * force;
        }
    }
}

function update() {
    if (gameOver) return;

    if (flipperShrinkTimer > 0) {
        flipperShrinkTimer--;
        flippers.left.length = baseFlipperLength * 0.65;
        flippers.right.length = baseFlipperLength * 0.65;
    } else {
        flippers.left.length = baseFlipperLength;
        flippers.right.length = baseFlipperLength;
    }

    if (ballSaverTimer > 0) {
        ballSaverTimer--;
        if (ballSaverTimer === 0) ballSaverActive = false;
    }

    if (ball.inPlunger) {
        if (keys.launch) {
            plunger.charge = Math.min(plunger.charge + 0.8, plunger.maxCharge);
        } else if (plunger.charge > 0) {
            ball.vy = -plunger.charge;
            ball.vx = -1.5;
            ball.inPlunger = false;
            plunger.charge = 0;
        }
    } else {
        ball.vy += 0.20;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.995;
        ball.vy *= 0.995;
    }

    // Walls Collision
    if (ball.x - ball.radius < 10) { ball.x = 10 + ball.radius; ball.vx *= -0.7; }
    if (ball.x + ball.radius > 370 && !ball.inPlunger) { 
        if (ball.y > 150) { ball.x = 370 - ball.radius; ball.vx *= -0.7; }
    }
    if (ball.x + ball.radius > 410) { ball.x = 410 - ball.radius; ball.vx *= -0.7; }
    if (ball.y - ball.radius < 10) { ball.y = 10 + ball.radius; ball.vy *= -0.7; }

    updateFlipper(flippers.left, keys.leftShift, true);
    updateFlipper(flippers.right, keys.rightShift, false);

    checkFlipperCollision(flippers.left, true);
    checkFlipperCollision(flippers.right, false);

    // Bumpers
    bumpers.forEach(b => {
        let dx = ball.x - b.x;
        let dy = ball.y - b.y;
        let dist = Math.hypot(dx, dy);

        if (dist < b.radius + ball.radius) {
            let angle = Math.atan2(dy, dx);
            let force = 8;
            ball.vx = Math.cos(angle) * force;
            ball.vy = Math.sin(angle) * force;
            b.flashTimer = 10;

            if (b.word === currentTarget.word) {
                score += 500;
                ballSaverActive = true;
                ballSaverTimer = 360;
                nextQuestion();
            } else {
                score = Math.max(0, score - 100);
                flipperShrinkTimer = 300;
            }
            document.getElementById("score-val").innerText = score;
        }
    });

    // Ball Saver Shield
    if (ballSaverActive && ball.y > 540 && ball.x > 100 && ball.x < 270) {
        ball.vy = -10;
    }

    // Out of bounds
    if (ball.y > 600) {
        ballsLeft--;
        document.getElementById("balls-val").innerText = ballsLeft;

        if (ballsLeft <= 0) {
            gameOver = true;
            document.getElementById("def-text").innerText = "GAME OVER! Final Score: " + score;
        } else {
            ball.reset();
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Playfield outlines
    ctx.strokeStyle = "#3d3470";
    ctx.lineWidth = 3;
    ctx.strokeRect(10, 10, 360, 560);

    // Plunger Lane
    ctx.beginPath();
    ctx.moveTo(370, 150);
    ctx.lineTo(370, 570);
    ctx.stroke();

    // Bumpers
    bumpers.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        if (b.flashTimer > 0) {
            ctx.fillStyle = "#ffffff";
            b.flashTimer--;
        } else {
            ctx.fillStyle = "#2a1f54";
        }
        ctx.fill();
        ctx.strokeStyle = "#00ffcc";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(b.word, b.x, b.y + 4);
    });

    // Flippers
    [flippers.left, flippers.right].forEach((f, idx) => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.fillStyle = "#ff007f";
        ctx.fillRect(0, -5, idx === 0 ? f.length : -f.length, 10);
        ctx.restore();
    });

    // Ball Saver Line
    if (ballSaverActive) {
        ctx.strokeStyle = "#00ffcc";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(100, 545);
        ctx.lineTo(270, 545);
        ctx.stroke();
    }

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#ffea00";
    ctx.fill();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
