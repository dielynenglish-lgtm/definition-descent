<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11th Grade Vocabulary Pinball</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #0f0c20;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 15px;
    }

    #game-container {
        position: relative;
        width: 500px;
        background: #181433;
        border: 4px solid #3d3470;
        border-radius: 12px;
        box-shadow: 0 0 30px rgba(110, 68, 255, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 15px;
    }

    #display-board {
        width: 100%;
        background: #080612;
        border: 2px solid #5d48bf;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
    }

    .hud-line {
        display: flex;
        justify-content: space-between;
        font-size: 16px;
        font-weight: bold;
        color: #00ffcc;
        margin-bottom: 8px;
    }

    #definition-box {
        background: #120e29;
        border: 2px solid #ffe600;
        padding: 10px;
        border-radius: 6px;
        text-align: center;
        font-size: 16px;
        color: #ffe600;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        line-height: 1.3;
    }

    .def-label {
        font-size: 12px;
        color: #00ffcc;
        text-transform: uppercase;
        margin-bottom: 4px;
    }

    canvas {
        background: #0d0a1a;
        border: 2px solid #2a2254;
        border-radius: 6px;
        display: block;
    }

    #controls-info {
        margin-top: 10px;
        font-size: 13px;
        color: #ccc;
        text-align: center;
    }

    .key {
        background: #332a63;
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid #5848a8;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="game-container">
    <div id="display-board">
        <div class="hud-line">
            <span>SCORE: <span id="score-val">0</span></span>
            <span>BALLS: <span id="balls-val">3</span></span>
        </div>
        <div id="definition-box">
            <div class="def-label">TARGET DEFINITION</div>
            <div id="def-text">Press SPACE or DOWN ARROW to Launch Ball!</div>
        </div>
    </div>

    <canvas id="pinball" width="460" height="580"></canvas>

    <div id="controls-info">
        <b>Controls:</b> 
        Left Flipper: <span class="key">Left Shift</span> | 
        Right Flipper: <span class="key">Right Shift</span> | 
        Launch: <span class="key">Space / Down</span>
    </div>
</div>

<script>
const vocabList = [
    { word: "breakthrough", def: "A sudden, dramatic, and important discovery or development." },
    { word: "laboratory", def: "A room equipped for scientific experiments or research." },
    { word: "workshop", def: "A room or building in which goods are manufactured or repaired." },
    { word: "calculation", def: "A mathematical determination of the size or number of something." },
    { word: "envision", def: "To imagine as a future possibility; to visualize." },
    { word: "striking", def: "Attracting attention or notice through being unusual." },
    { word: "insight", def: "The capacity to gain an accurate and deep understanding." }
];

const canvas = document.getElementById("pinball");
const ctx = canvas.getContext("2d");

let score = 0;
let ballsLeft = 3;
let currentTarget = null;
let currentOptions = [];
let gameOver = false;
let ballSaverActive = false;
let ballSaverTimer = 0;

const keys = { leftShift: false, rightShift: false, launch: false };

window.addEventListener("keydown", (e) => {
    if (e.code === "ShiftLeft") keys.leftShift = true;
    if (e.code === "ShiftRight") keys.rightShift = true;
    if (e.code === "ArrowDown" || e.code === "Space") {
        keys.launch = true;
        if (ball.inPlunger) launchBall();
    }
});

window.addEventListener("keyup", (e) => {
    if (e.code === "ShiftLeft") keys.leftShift = false;
    if (e.code === "ShiftRight") keys.rightShift = false;
    if (e.code === "ArrowDown" || e.code === "Space") keys.launch = false;
});

const ball = {
    x: 435,
    y: 520,
    vx: 0,
    vy: 0,
    radius: 10,
    inPlunger: true,
    reset() {
        this.x = 435;
        this.y = 520;
        this.vx = 0;
        this.vy = 0;
        this.inPlunger = true;
    }
};

const baseFlipperLength = 75;
const flippers = {
    left: { x: 130, y: 510, angle: 0.3, restAngle: 0.3, activeAngle: -0.45, length: baseFlipperLength },
    right: { x: 280, y: 510, angle: -0.3, restAngle: -0.3, activeAngle: 0.45, length: baseFlipperLength }
};

// Enlarged Bumpers for easy targets and clear reading
const bumpers = [
    { x: 110, y: 160, radius: 48, word: "", flashTimer: 0 },
    { x: 205, y: 90, radius: 48, word: "", flashTimer: 0 },
    { x: 300, y: 160, radius: 48, word: "", flashTimer: 0 }
];

function nextQuestion() {
    const targetIdx = Math.floor(Math.random() * vocabList.length);
    currentTarget = vocabList[targetIdx];

    let distractors = vocabList.filter(item => item.word !== currentTarget.word);
    distractors.sort(() => 0.5 - Math.random());
    
    currentOptions = [currentTarget.word, distractors[0].word, distractors[1].word];
    currentOptions.sort(() => 0.5 - Math.random());

    for (let i = 0; i < 3; i++) {
        bumpers[i].word = currentOptions[i];
    }

    document.getElementById("def-text").innerText = `"${currentTarget.def}"`;
}

function launchBall() {
    if (ball.inPlunger) {
        ball.vy = -15;
        ball.vx = -1.2;
        ball.inPlunger = false;
        ballSaverActive = true;
        ballSaverTimer = 240;
    }
}

nextQuestion();

function updateFlipper(flipper, isActive) {
    const targetAngle = isActive ? flipper.activeAngle : flipper.restAngle;
    flipper.angle += (targetAngle - flipper.angle) * 0.45;
}

function checkFlipperCollision(flipper, isLeft) {
    const endX = flipper.x + Math.cos(flipper.angle) * (isLeft ? flipper.length : -flipper.length);
    const endY = flipper.y + Math.sin(flipper.angle) * flipper.length;

    const dx = endX - flipper.x;
    const dy = endY - flipper.y;
    const len = Math.hypot(dx, dy);
    const u = (((ball.x - flipper.x) * dx) + ((ball.y - flipper.y) * dy)) / (len * len);

    if (u >= 0 && u <= 1) {
        const ix = flipper.x + u * dx;
        const iy = flipper.y + u * dy;
        const dist = Math.hypot(ball.x - ix, ball.y - iy);

        if (dist < ball.radius + 8) {
            const angle = Math.atan2(ball.y - iy, ball.x - ix);
            const active = (isLeft && keys.leftShift) || (!isLeft && keys.rightShift);
            const force = active ? 11 : 4.5;
            ball.vx = Math.cos(angle) * force;
            ball.vy = Math.sin(angle) * force;
        }
    }
}

function update() {
    if (gameOver) return;

    if (ballSaverTimer > 0) {
        ballSaverTimer--;
        if (ballSaverTimer === 0) ballSaverActive = false;
    }

    if (!ball.inPlunger) {
        ball.vy += 0.18; // Relaxed gravity
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.994;
        ball.vy *= 0.994;
    }

    // Playfield Walls
    if (ball.x - ball.radius < 10) { ball.x = 10 + ball.radius; ball.vx *= -0.7; }
    if (ball.x + ball.radius > 410 && !ball.inPlunger) { 
        if (ball.y > 140) { ball.x = 410 - ball.radius; ball.vx *= -0.7; }
    }
    if (ball.x + ball.radius > 450) { ball.x = 450 - ball.radius; ball.vx *= -0.7; }
    if (ball.y - ball.radius < 10) { ball.y = 10 + ball.radius; ball.vy *= -0.7; }

    updateFlipper(flippers.left, keys.leftShift);
    updateFlipper(flippers.right, keys.rightShift);

    checkFlipperCollision(flippers.left, true);
    checkFlipperCollision(flippers.right, false);

    // Bumpers Detection
    bumpers.forEach(b => {
        let dx = ball.x - b.x;
        let dy = ball.y - b.y;
        let dist = Math.hypot(dx, dy);

        if (dist < b.radius + ball.radius) {
            let angle = Math.atan2(dy, dx);
            let force = 8.5;
            ball.vx = Math.cos(angle) * force;
            ball.vy = Math.sin(angle) * force;
            b.flashTimer = 10;

            if (b.word === currentTarget.word) {
                score += 500;
                ballSaverActive = true;
                ballSaverTimer = 300;
                nextQuestion();
            } else {
                score = Math.max(0, score - 100);
            }
            document.getElementById("score-val").innerText = score;
        }
    });

    // Drain Protection Line
    if (ballSaverActive && ball.y > 535 && ball.x > 100 && ball.x < 310) {
        ball.vy = -10;
    }

    // Drain / Reset
    if (ball.y > 600) {
        ballsLeft--;
        document.getElementById("balls-val").innerText = ballsLeft;

        if (ballsLeft <= 0) {
            gameOver = true;
            document.getElementById("def-text").innerText = "GAME OVER! Final Score: " + score;
        } else {
            ball.reset();
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Playfield outer border
    ctx.strokeStyle = "#3d3470";
    ctx.lineWidth = 3;
    ctx.strokeRect(10, 10, 400, 560);

    // Plunger Lane Separator
    ctx.beginPath();
    ctx.moveTo(410, 140);
    ctx.lineTo(410, 570);
    ctx.stroke();

    // Word Bumpers
    bumpers.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        if (b.flashTimer > 0) {
            ctx.fillStyle = "#ffffff";
            b.flashTimer--;
        } else {
            ctx.fillStyle = "#241a4a";
        }
        ctx.fill();
        ctx.strokeStyle = "#00ffcc";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Large, Clear Word Labels
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px Arial";
        ctx.textAlign = "center";
        ctx.fillText(b.word, b.x, b.y + 5);
    });

    // Flippers
    [flippers.left, flippers.right].forEach((f, idx) => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.fillStyle = "#ff007f";
        ctx.fillRect(0, -6, idx === 0 ? f.length : -f.length, 12);
        ctx.restore();
    });

    // Ball Shield Line
    if (ballSaverActive) {
        ctx.strokeStyle = "#00ffcc";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(110, 540);
        ctx.lineTo(300, 540);
        ctx.stroke();
    }

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#ffea00";
    ctx.fill();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
