<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Screen Vocabulary Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Bar */
        #game-header {
            height: 60px;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid #333;
            z-index: 10;
        }

        .p1-score-display {
            color: #ff4d4d;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .p2-score-display {
            color: #2ecc71;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #timer {
            font-size: 2rem;
            font-weight: 900;
            color: #f39c12;
            background: #222;
            padding: 2px 20px;
            border-radius: 8px;
            border: 2px solid #444;
        }

        #q-count {
            font-size: 1rem;
            color: #aaa;
        }

        /* Main Game Arena */
        #game-arena {
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 60px);
            position: relative;
        }

        /* Player Sides */
        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            transition: background-color 0.2s;
        }

        #player1-side {
            background-color: #2b1111;
            border-right: 4px solid #444;
        }

        #player2-side {
            background-color: #0f2b1d;
        }

        /* Card Container */
        .definition-card {
            background-color: #222;
            border-radius: 12px;
            padding: 20px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 2px solid #444;
        }

        .p1-side .definition-card { border-color: #ff4d4d; }
        .p2-side .definition-card { border-color: #2ecc71; }

        .card-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        .definition-text {
            font-size: 1.2rem;
            line-height: 1.4;
            font-weight: 600;
        }

        /* Controls / Option Grids */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            height: 60%;
        }

        .btn-option {
            background-color: #333;
            border: 3px solid #555;
            border-radius: 10px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: capitalize;
        }

        .key-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: monospace;
        }

        /* Lockout Overlay */
        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px #000;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .locked .lock-overlay {
            opacity: 1;
        }

        /* Penalty Flash Animation */
        @keyframes flash-red {
            0% { background-color: rgba(255, 0, 0, 0.8); }
            100% { background-color: rgba(255, 0, 0, 0); }
        }

        .flash-penalty {
            animation: flash-red 0.4s ease-out;
        }

        /* Victory Screen Modal */
        #victory-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        .victory-title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
        }

        .winner-declaration {
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .scoreboard {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            background: #222;
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid #444;
        }

        .score-box {
            text-align: center;
        }

        .score-box .name {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .score-box .val {
            font-size: 3rem;
            font-weight: bold;
        }

        .btn-rematch {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1e8449;
            transition: transform 0.1s;
        }

        .btn-rematch:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1e8449;
        }
    </style>
</head>
<body>

    <!-- Top Info Bar -->
    <div id="game-header">
        <div class="p1-score-display">P1 Score: <span id="p1-score">0</span></div>
        <div style="text-align: center;">
            <div id="timer">60</div>
            <div id="q-count">Question 1 / 10</div>
        </div>
        <div class="p2-score-display">P2 Score: <span id="p2-score">0</span></div>
    </div>

    <!-- Arena divided vertically -->
    <div id="game-arena">
        
        <!-- Player 1 Side (Left - Red) -->
        <div id="player1-side" class="player-side p1-side">
            <div class="lock-overlay">LOCKED OUT ❌</div>
            <div class="definition-card">
                <div class="card-label">Target Definition</div>
                <div class="definition-text" id="p1-def">Loading...</div>
            </div>
            <div class="grid-container">
                <div class="btn-option" id="p1-opt-0"><span class="key-badge">Q</span><span class="word-text"></span></div>
                <div class="btn-option" id="p1-opt-1"><span class="key-badge">W</span><span class="word-text"></span></div>
                <div class="btn-option" id="p1-opt-2"><span class="key-badge">A</span><span class="word-text"></span></div>
                <div class="btn-option" id="p1-opt-3"><span class="key-badge">S</span><span class="word-text"></span></div>
            </div>
        </div>

        <!-- Player 2 Side (Right - Green) -->
        <div id="player2-side" class="player-side p2-side">
            <div class="lock-overlay">LOCKED OUT ❌</div>
            <div class="definition-card">
                <div class="card-label">Target Definition</div>
                <div class="definition-text" id="p2-def">Loading...</div>
            </div>
            <div class="grid-container">
                <div class="btn-option" id="p2-opt-0"><span class="key-badge">I</span><span class="word-text"></span></div>
                <div class="btn-option" id="p2-opt-1"><span class="key-badge">O</span><span class="word-text"></span></div>
                <div class="btn-option" id="p2-opt-2"><span class="key-badge">K</span><span class="word-text"></span></div>
                <div class="btn-option" id="p2-opt-3"><span class="key-badge">L</span><span class="word-text"></span></div>
            </div>
        </div>

    </div>

    <!-- End Game Overlay -->
    <div id="victory-screen" class="hidden">
        <div class="victory-title">MISSION COMPLETE</div>
        <div class="winner-declaration" id="winner-text">PLAYER 1 WINS!</div>
        <div class="scoreboard">
            <div class="score-box">
                <div class="name" style="color: #ff4d4d;">PLAYER 1</div>
                <div class="val" id="final-p1-score">0</div>
            </div>
            <div class="score-box">
                <div class="name" style="color: #2ecc71;">PLAYER 2</div>
                <div class="val" id="final-p2-score">0</div>
            </div>
        </div>
        <button class="btn-rematch" onclick="resetGame()">REMATCH</button>
    </div>

    <script>
        // Vocabulary list populated with words extracted from source prompt
        const vocabulary = [
            { word: "luxurious", definition: "Extremely comfortable, elegant, or enjoyable, especially in a way that involves great expense." },
            { word: "innovation", definition: "A new method, idea, product, or a new way of doing something." },
            { word: "surgery", definition: "Medical treatment involving an operation to cut into the body to repair or remove parts." },
            { word: "terrifying", definition: "Causing extreme fear or dread; frightening." },
            { word: "physically", definition: "In a manner relating to the body rather than the mind." },
            { word: "procedure", definition: "An established or official way of doing something, or a series of medical actions." },
            { word: "agony", definition: "Extreme physical or mental suffering." },
            { word: "accurate", definition: "Correct, precise, or exact in details, measurements, or information." },
            { word: "frequently", definition: "Occurring or done on many occasions; habitually or regularly." },
            { word: "reluctant", definition: "Unwilling and hesitant to do something; disinclined." }
        ];

        // Key bindings mapping
        const P1_KEYS = { 'q': 0, 'w': 1, 'a': 2, 's': 3 };
        const P2_KEYS = { 'i': 0, 'o': 1, 'k': 2, 'l': 3 };

        // Game State Variables
        let currentQuestions = [];
        let currentQIndex = 0;
        let p1Score = 0;
        let p2Score = 0;
        let p1Locked = false;
        let p2Locked = false;
        let timerInterval = null;
        let timeLeft = 60;
        let gameActive = false;

        // Shuffle utility
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize Game
        function resetGame() {
            p1Score = 0;
            p2Score = 0;
            currentQIndex = 0;
            timeLeft = 60;
            gameActive = true;

            document.getElementById('p1-score').innerText = p1Score;
            document.getElementById('p2-score').innerText = p2Score;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('victory-screen').classList.add('hidden');

            // Generate randomized 10 question pool
            currentQuestions = vocabulary.map(item => {
                // Get 3 incorrect options randomly
                let distractors = vocabulary.filter(v => v.word !== item.word);
                distractors = shuffle(distractors).slice(0, 3).map(v => v.word);
                
                // Combine and shuffle choices
                let choices = shuffle([item.word, ...distractors]);
                let correctIdx = choices.indexOf(item.word);

                return {
                    definition: item.definition,
                    choices: choices,
                    correctIdx: correctIdx
                };
            });

            currentQuestions = shuffle(currentQuestions);

            // Start Timer
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            loadQuestion();
        }

        // Load Question state into UI
        function loadQuestion() {
            if (currentQIndex >= 10 || currentQIndex >= currentQuestions.length) {
                endGame();
                return;
            }

            // Reset Lockouts
            p1Locked = false;
            p2Locked = false;
            document.getElementById('player1-side').classList.remove('locked');
            document.getElementById('player2-side').classList.remove('locked');

            const qData = currentQuestions[currentQIndex];

            // Update Headers
            document.getElementById('q-count').innerText = `Question ${currentQIndex + 1} / 10`;

            // Update Definitions
            document.getElementById('p1-def').innerText = qData.definition;
            document.getElementById('p2-def').innerText = qData.definition;

            // Update Buttons
            for (let i = 0; i < 4; i++) {
                document.querySelector(`#p1-opt-${i} .word-text`).innerText = qData.choices[i];
                document.querySelector(`#p2-opt-${i} .word-text`).innerText = qData.choices[i];
            }
        }

        // Handle Player Input Answer
        function handleAnswer(player, chosenIdx) {
            if (!gameActive) return;

            // Lockout checks
            if (player === 1 && p1Locked) return;
            if (player === 2 && p2Locked) return;

            const currentQ = currentQuestions[currentQIndex];

            if (chosenIdx === currentQ.correctIdx) {
                // Correct Answer
                if (player === 1) p1Score++;
                if (player === 2) p2Score++;

                document.getElementById('p1-score').innerText = p1Score;
                document.getElementById('p2-score').innerText = p2Score;

                // Advance to next round
                currentQIndex++;
                loadQuestion();
            } else {
                // Wrong Answer Penalty
                if (player === 1) {
                    p1Locked = true;
                    const side = document.getElementById('player1-side');
                    side.classList.add('locked', 'flash-penalty');
                    setTimeout(() => side.classList.remove('flash-penalty'), 400);
                } else if (player === 2) {
                    p2Locked = true;
                    const side = document.getElementById('player2-side');
                    side.classList.add('locked', 'flash-penalty');
                    setTimeout(() => side.classList.remove('flash-penalty'), 400);
                }

                // If both players lock out, advance question automatically
                if (p1Locked && p2Locked) {
                    setTimeout(() => {
                        currentQIndex++;
                        loadQuestion();
                    }, 800);
                }
            }
        }

        // Keyboard Controls Handler
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (key in P1_KEYS) {
                handleAnswer(1, P1_KEYS[key]);
            } else if (key in P2_KEYS) {
                handleAnswer(2, P2_KEYS[key]);
            }
        });

        // Game Over Trigger
        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);

            const victoryScreen = document.getElementById('victory-screen');
            const winnerText = document.getElementById('winner-text');

            document.getElementById('final-p1-score').innerText = p1Score;
            document.getElementById('final-p2-score').innerText = p2Score;

            if (p1Score > p2Score) {
                winnerText.innerText = "PLAYER 1 WINS!";
                winnerText.style.color = "#ff4d4d";
            } else if (p2Score > p1Score) {
                winnerText.innerText = "PLAYER 2 WINS!";
                winnerText.style.color = "#2ecc71";
            } else {
                winnerText.innerText = "IT'S A TIE!";
                winnerText.style.color = "#f1c40f";
            }

            victoryScreen.classList.remove('hidden');
        }

        // Start Game on Boot
        resetGame();
    </script>
</body>
</html>
