<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vocab Pinball Arcade (Easy Mode)</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    #game-container {
      position: relative;
      width: 550px;
      margin-top: 5px;
    }
    #hud {
      width: 550px;
      background: #222;
      border: 3px solid #ff007f;
      border-radius: 10px 10px 0 0;
      box-sizing: border-box;
      padding: 10px;
      text-align: center;
    }
    #display-board {
      background: #000;
      border: 2px solid #00f3ff;
      border-radius: 5px;
      padding: 10px;
      color: #00f3ff;
      font-size: 18px;
      font-weight: bold;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px #00f3ff;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 20px;
      font-weight: bold;
      color: #ff007f;
    }
    /* Vocabulary Reference Card */
    #vocab-card {
      width: 550px;
      background: #1c1c2e;
      border: 2px solid #00f3ff;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      box-sizing: border-box;
      max-height: 120px;
      overflow-y: auto;
    }
    #vocab-card h4 {
      margin: 0 0 6px 0;
      color: #ffd700;
      text-align: center;
      font-size: 14px;
      text-transform: uppercase;
    }
    .vocab-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 13px;
    }
    .vocab-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 6px;
      border-radius: 4px;
    }
    .vocab-item strong {
      color: #00f3ff;
    }
    canvas {
      background: #181825;
      border: 3px solid #ff007f;
      border-top: none;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      display: block;
    }
    #instructions {
      margin-top: 10px;
      text-align: center;
      font-size: 15px;
      color: #aaa;
    }
    kbd {
      background: #333;
      border: 1px solid #666;
      border-radius: 3px;
      padding: 2px 6px;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Vocabulary Reference Display -->
  <div id="vocab-card">
    <h4>Vocabulary Reference Sheet</h4>
    <div class="vocab-grid" id="vocab-list-container"></div>
  </div>

  <div id="game-container">
    <div id="hud">
      <div id="display-board">Press SPACEBAR to Launch Ball!</div>
      <div class="stats">
        <span>SCORE: <span id="score">0</span></span>
        <span>BALLS: <span id="balls">∞ (Practice Mode)</span></span>
      </div>
    </div>
    <canvas id="pinball" width="550" height="650"></canvas>
  </div>

  <div id="instructions">
    <p><strong>Controls:</strong> <kbd>SPACE</kbd> (Hold & Release) to Launch | <kbd>Left Shift</kbd> Left Flipper | <kbd>Right Shift</kbd> Right Flipper</p>
  </div>

  <script>
    const canvas = document.getElementById('pinball');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const displayBoard = document.getElementById('display-board');
    const vocabListContainer = document.getElementById('vocab-list-container');

    // Vocab Dataset with meanings
    const vocabList = [
      { word: "SOLO", def: "Done by one person alone." },
      { word: "FLEXIBILITY", def: "The ability to bend or adapt easily." },
      { word: "COMPROMISE", def: "An agreement where both sides make concessions." },
      { word: "DESTINATION", def: "The place where someone is going." },
      { word: "SPLIT", def: "To divide or break into parts." },
      { word: "ARISE", def: "To come into existence or notice." },
      { word: "OCCASIONALLY", def: "From time to time; now and then." },
      { word: "OBSTACLE", def: "Something that blocks your way." },
      { word: "ADAPT", def: "To adjust or make suitable for a new purpose." },
      { word: "STRATEGY", def: "A plan to achieve a goal." }
    ];

    // Populate Reference Sheet
    vocabList.forEach(item => {
      const div = document.createElement('div');
      div.className = 'vocab-item';
      div.innerHTML = `<strong>${item.word}:</strong> ${item.def}`;
      vocabListContainer.appendChild(div);
    });

    // Game Variables
    let score = 0;
    let currentTarget = null;

    // Physics Settings (Easier & Slower)
    const gravity = 0.10;
    const bounceDamping = 0.85;

    // Ball Object
    const ball = {
      x: 520,
      y: 580,
      vx: 0,
      vy: 0,
      radius: 12,
      inPlunger: true
    };

    // Plunger Settings
    let plungerPower = 0;
    let isChargingPlunger = false;

    // Enlarged Bumpers Setup
    const bumpers = [
      { x: 140, y: 190, radius: 55, word: "", hitFlash: 0 },
      { x: 275, y: 140, radius: 55, word: "", hitFlash: 0 },
      { x: 410, y: 190, radius: 55, word: "", hitFlash: 0 }
    ];

    // Enlarged Flippers Setup
    const currentFlipperWidth = 110;

    const leftFlipper = {
      x: 130, y: 580, angle: 0.3, maxAngle: -0.4, minAngle: 0.3, isUp: false
    };

    const rightFlipper = {
      x: 370, y: 580, angle: -0.3, maxAngle: 0.4, minAngle: -0.3, isUp: false
    };

    // Controls
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && ball.inPlunger) {
        isChargingPlunger = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space' && isChargingPlunger) {
        ball.vy = -plungerPower;
        ball.vx = (Math.random() - 0.5) * 2;
        ball.inPlunger = false;
        isChargingPlunger = false;
        plungerPower = 0;
      }
    });

    function setupNewRound() {
      const targetIndex = Math.floor(Math.random() * vocabList.length);
      currentTarget = vocabList[targetIndex];
      displayBoard.innerText = `HIT WORD FOR: "${currentTarget.def}"`;

      const shuffledBumpers = [...bumpers].sort(() => 0.5 - Math.random());
      shuffledBumpers[0].word = currentTarget.word;

      const otherWords = vocabList.filter(v => v.word !== currentTarget.word);
      const usedOthers = otherWords.sort(() => 0.5 - Math.random()).slice(0, 2);
      
      shuffledBumpers[1].word = usedOthers[0].word;
      shuffledBumpers[2].word = usedOthers[1].word;
    }

    function resetBall() {
      ball.x = 520;
      ball.y = 580;
      ball.vx = 0;
      ball.vy = 0;
      ball.inPlunger = true;
    }

    function handleBumperHit(bumper) {
      bumper.hitFlash = 15;

      if (bumper.word === currentTarget.word) {
        score += 500;
        scoreEl.innerText = score;
        displayBoard.innerText = `GREAT JOB! "${currentTarget.word}" IS CORRECT! (+500 PTS)`;
        setTimeout(setupNewRound, 1200);
      } else {
        displayBoard.innerText = `TRY AGAIN! Looking for: "${currentTarget.def}"`;
      }
    }

    function updatePhysics() {
      if (isChargingPlunger) {
        plungerPower = Math.min(plungerPower + 0.3, 16);
      }

      leftFlipper.isUp = keys['ShiftLeft'];
      rightFlipper.isUp = keys['ShiftRight'];

      const flipperSpeed = 0.25;
      leftFlipper.angle += leftFlipper.isUp ? -flipperSpeed : flipperSpeed;
      leftFlipper.angle = Math.max(leftFlipper.maxAngle, Math.min(leftFlipper.minAngle, leftFlipper.angle));

      rightFlipper.angle += rightFlipper.isUp ? flipperSpeed : -flipperSpeed;
      rightFlipper.angle = Math.min(rightFlipper.maxAngle, Math.max(rightFlipper.minAngle, rightFlipper.angle));

      if (!ball.inPlunger) {
        ball.vy += gravity;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Plunger Channel Wall
        if (ball.x > 500 && ball.y > 200) {
          if (ball.x + ball.radius > 540) {
            ball.x = 540 - ball.radius;
            ball.vx *= -bounceDamping;
          }
          if (ball.x - ball.radius < 500) {
            ball.x = 500 + ball.radius;
            ball.vx *= -bounceDamping;
          }
        } else {
          // Table Outer Bounds
          if (ball.x - ball.radius < 10) {
            ball.x = 10 + ball.radius;
            ball.vx *= -bounceDamping;
          }
          if (ball.x + ball.radius > 500) {
            ball.x = 500 - ball.radius;
            ball.vx *= -bounceDamping;
          }
        }

        if (ball.y - ball.radius < 10) {
          ball.y = 10 + ball.radius;
          ball.vy *= -bounceDamping;
        }

        // Bumper Collisions
        bumpers.forEach(b => {
          const dx = ball.x - b.x;
          const dy = ball.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < ball.radius + b.radius) {
            const angle = Math.atan2(dy, dx);
            const force = 9;
            ball.vx = Math.cos(angle) * force;
            ball.vy = Math.sin(angle) * force;

            handleBumperHit(b);
          }
        });

        // Flipper Collision Check
        const checkFlipperCollision = (f, isLeft) => {
          const dx = ball.x - f.x;
          const dy = ball.y - f.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < currentFlipperWidth && ball.y > f.y - 18 && ball.y < f.y + 25) {
            ball.vy = -Math.abs(ball.vy) * 1.1 - (f.isUp ? 7 : 3);
            ball.vx += isLeft ? 3 : -3;
          }
        };

        checkFlipperCollision(leftFlipper, true);
        checkFlipperCollision(rightFlipper, false);

        // Auto-save ball (No game over / drain penalty)
        if (ball.y > 650) {
          resetBall();
          displayBoard.innerText = "Ball Reset! Press SPACEBAR to Launch Again!";
        }
      }
    }

    function render() {
      ctx.fillStyle = '#181825';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Plunger Lane
      ctx.strokeStyle = '#ff007f';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(500, 650);
      ctx.lineTo(500, 200);
      ctx.stroke();

      // Bumpers
      bumpers.forEach(b => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);

        if (b.hitFlash > 0) {
          ctx.fillStyle = '#ffffff';
          b.hitFlash--;
        } else {
          ctx.fillStyle = '#2a2a40';
        }

        ctx.strokeStyle = b.word === currentTarget.word ? '#00f3ff' : '#ff007f';
        ctx.lineWidth = 4;
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.word, b.x, b.y);
        ctx.restore();
      });

      // Flippers
      const drawFlipper = (f, isLeft) => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.fillStyle = '#00f3ff';
        ctx.fillRect(0, -7, isLeft ? currentFlipperWidth : -currentFlipperWidth, 14);
        ctx.restore();
      };

      drawFlipper(leftFlipper, true);
      drawFlipper(rightFlipper, false);

      // Plunger Spring
      if (ball.inPlunger) {
        ctx.fillStyle = '#ff007f';
        ctx.fillRect(510, 620 + plungerPower, 20, 30 - plungerPower);
      }

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#fff';
      ctx.fill();
      ctx.shadowBlur = 0;

      updatePhysics();
      requestAnimationFrame(render);
    }

    setupNewRound();
    render();
  </script>
</body>
</html>
