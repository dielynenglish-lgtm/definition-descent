<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Diner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0cda3;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #game-container {
            width: 800px;
            height: 600px;
            background-color: #fff;
            border: 8px solid #5a3a22;
            border-radius: 15px;
            margin-top: 20px;
            position: relative;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
            overflow: hidden;
            background-image: linear-gradient(#ffffff 50%, #d4a373 50%);
        }
        #header {
            background-color: #d62828;
            color: white;
            padding: 10px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        #customer-area {
            height: 250px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        #customer {
            width: 120px;
            height: 150px;
            background-color: #003049;
            border-radius: 60px 60px 0 0;
            display: none;
            position: relative;
        }
        #speech-bubble {
            position: absolute;
            top: -120px;
            left: -100px;
            width: 300px;
            background-color: white;
            border: 4px solid #333;
            border-radius: 20px;
            padding: 15px;
            font-size: 18px;
            display: none;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            border-width: 20px 20px 0;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
            display: block;
            width: 0;
        }
        #patience-container {
            width: 200px;
            height: 20px;
            background-color: #ddd;
            border: 2px solid #333;
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
            display: none;
        }
        #patience-bar {
            width: 100%;
            height: 100%;
            background-color: #4CAF50;
        }
        #counter {
            height: 50px;
            background-color: #5a3a22;
            width: 100%;
        }
        #tray {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .food-item {
            background-color: #fdf0d5;
            border: 4px solid #c1121f;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0px 5px 0px #780000;
            transition: transform 0.1s;
        }
        .food-item:active {
            transform: translateY(5px);
            box-shadow: 0px 0px 0px #780000;
        }
        .food-item:hover {
            background-color: #ffecd2;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        button.start-btn {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        button.start-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="header">
            <div>Score: <span id="score">0</span></div>
            <div>Vocabulary Diner</div>
            <div>Strikes: <span id="strikes">0</span>/3</div>
        </div>

        <div id="customer-area">
            <div id="customer">
                <div id="speech-bubble">I need something that means... <br><b><span id="definition-text"></span></b></div>
            </div>
        </div>
        
        <div id="patience-container">
            <div id="patience-bar"></div>
        </div>

        <div id="counter"></div>

        <div id="tray">
            <!-- Buttons will be generated by JS -->
        </div>

        <div id="start-screen">
            <h1>Welcome to Vocabulary Diner!</h1>
            <p>Read the patron's definition and serve them the correct vocabulary word.</p>
            <p>Serve them before their patience runs out!</p>
            <button class="start-btn" onclick="startGame()">Start Serving</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            { word: "coincidence", def: "A remarkable occurrence of events at the same time, apparently by chance." },
            { word: "invade", def: "To enter a country or region by force in order to conquer it." },
            { word: "overthrow", def: "To remove a government or leader from power, usually by force." },
            { word: "rigid", def: "Unable to bend or be forced out of shape; not flexible." },
            { word: "labor", def: "Hard physical work." },
            { word: "peasant", def: "A poor farmer of low social status who owns or rents a small piece of land." },
            { word: "noble", def: "Belonging to a hereditary class with high social or political status." }
        ];

        let score = 0;
        let strikes = 0;
        let currentPatronWord = null;
        let patienceTimer;
        let currentPatience = 100;
        const PATIENCE_DROP_RATE = 1.5; // How fast patience drops (adjust to change difficulty)

        const scoreEl = document.getElementById('score');
        const strikesEl = document.getElementById('strikes');
        const customerEl = document.getElementById('customer');
        const speechBubbleEl = document.getElementById('speech-bubble');
        const defTextEl = document.getElementById('definition-text');
        const patienceContainerEl = document.getElementById('patience-container');
        const patienceBarEl = document.getElementById('patience-bar');
        const trayEl = document.getElementById('tray');
        const startScreenEl = document.getElementById('start-screen');

        function initTray() {
            trayEl.innerHTML = '';
            // Shuffle the buttons for the tray
            let shuffledVocab = [...vocabulary].sort(() => Math.random() - 0.5);
            shuffledVocab.forEach(item => {
                let btn = document.createElement('button');
                btn.className = 'food-item';
                btn.innerText = item.word;
                btn.onclick = () => serveFood(item.word);
                trayEl.appendChild(btn);
            });
        }

        function startGame() {
            score = 0;
            strikes = 0;
            updateScoreboard();
            startScreenEl.style.display = 'none';
            initTray();
            spawnPatron();
        }

        function spawnPatron() {
            // Pick a random word
            let randomIndex = Math.floor(Math.random() * vocabulary.length);
            currentPatronWord = vocabulary[randomIndex];

            // Setup UI
            defTextEl.innerText = currentPatronWord.def;
            customerEl.style.display = 'block';
            speechBubbleEl.style.display = 'block';
            patienceContainerEl.style.display = 'block';
            
            // Reset Patience
            currentPatience = 100;
            updatePatienceBar();
            
            clearInterval(patienceTimer);
            patienceTimer = setInterval(decreasePatience, 100);
        }

        function decreasePatience() {
            currentPatience -= PATIENCE_DROP_RATE;
            updatePatienceBar();

            if (currentPatience <= 0) {
                clearInterval(patienceTimer);
                handleWrongAnswer();
            }
        }

        function updatePatienceBar() {
            patienceBarEl.style.width = currentPatience + '%';
            if (currentPatience > 50) {
                patienceBarEl.style.backgroundColor = '#4CAF50'; // Green
            } else if (currentPatience > 20) {
                patienceBarEl.style.backgroundColor = '#FFC107'; // Yellow
            } else {
                patienceBarEl.style.backgroundColor = '#f44336'; // Red
            }
        }

        function serveFood(selectedWord) {
            if (selectedWord === currentPatronWord.word) {
                // Correct!
                clearInterval(patienceTimer);
                score += 10;
                updateScoreboard();
                
                // Flash green, then next patron
                customerEl.style.backgroundColor = "#4CAF50";
                setTimeout(() => {
                    customerEl.style.backgroundColor = "#003049";
                    spawnPatron();
                }, 500);

            } else {
                // Wrong food!
                // Penalty: Lose a large chunk of patience
                currentPatience -= 30;
                if(currentPatience <= 0) {
                    currentPatience = 0;
                    clearInterval(patienceTimer);
                    handleWrongAnswer();
                } else {
                    updatePatienceBar();
                    customerEl.style.backgroundColor = "#f44336"; // Flash red
                    setTimeout(() => customerEl.style.backgroundColor = "#003049", 300);
                }
            }
        }

        function handleWrongAnswer() {
            strikes++;
            updateScoreboard();
            if (strikes >= 3) {
                gameOver();
            } else {
                customerEl.style.backgroundColor = "#f44336"; // Flash red
                setTimeout(() => {
                    customerEl.style.backgroundColor = "#003049";
                    spawnPatron();
                }, 1000);
            }
        }

        function updateScoreboard() {
            scoreEl.innerText = score;
            strikesEl.innerText = strikes;
        }

        function gameOver() {
            customerEl.style.display = 'none';
            speechBubbleEl.style.display = 'none';
            patienceContainerEl.style.display = 'none';
            
            startScreenEl.innerHTML = `
                <h1>Game Over!</h1>
                <p>The diner is closed.</p>
                <p>Your Final Score: ${score}</p>
                <button class="start-btn" onclick="startGame()">Play Again</button>
            `;
            startScreenEl.style.display = 'flex';
        }
    </script>
</body>
</html>
