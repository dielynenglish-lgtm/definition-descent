<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11th Grade Vocabulary Pinball</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #0f0c20;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }

    #game-container {
        position: relative;
        width: 480px;
        background: #181433;
        border: 4px solid #3d3470;
        border-radius: 12px;
        box-shadow: 0 0 30px rgba(110, 68, 255, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
    }

    /* Arcade Display Board */
    #display-board {
        width: 100%;
        background: #080612;
        border: 2px solid #5d48bf;
        border-radius: 8px;
        padding: 10px 15px;
        margin-bottom: 8px;
        box-shadow: inset 0 0 10px rgba(0, 255, 200, 0.2);
    }

    .hud-line {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: bold;
        color: #00ffcc;
        text-shadow: 0 0 5px #00ffcc;
        margin-bottom: 5px;
    }

    #definition-box {
        background: #120e29;
        border: 1px dashed #7a5cff;
        padding: 8px;
        border-radius: 4px;
        text-align: center;
        font-size: 13px;
        color: #ffe600;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        text-shadow: 0 0 3px #ffe600;
    }

    /* Canvas */
    canvas {
        background: #0d0a1a;
        border: 2px solid #2a2254;
        border-radius: 6px;
        display: block;
    }

    /* Controls Instruction */
    #controls-info {
        margin-top: 8px;
        font-size: 12px;
        color: #aaa;
        text-align: center;
    }

    .key {
        background: #332a63;
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid #5848a8;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="game-container">
    <div id="display-board">
        <div class="hud-line">
            <span>SCORE: <span id="score-val">0</span></span>
            <span>BALLS: <span id="balls-val">3</span></span>
        </div>
        <div id="definition-box">
            <span id="def-text">Press DOWN ARROW or SPACE to Launch Ball!</span>
        </div>
    </div>

    <canvas id="pinball" width="440" height="600"></canvas>

    <div id="controls-info">
        Flipper Left: <span class="key">Left Shift</span> | 
        Flipper Right: <span class="key">Right Shift</span> | 
        Launch: <span class="key">Down Arrow / Space</span>
    </div>
</div>

<script>
// Vocabulary Data (11th Grade Level)
const vocabList = [
    { word: "breakthrough", def: "A sudden, dramatic, and important discovery or development." },
    { word: "laboratory", def: "A room or building equipped for scientific experiments or research." },
    { word: "workshop", def: "A room or building in which goods are manufactured or repaired." },
    { word: "calculation", def: "A mathematical determination of the size or number of something." },
    { word: "envision", def: "To imagine as a future possibility; to visualize." },
    { word: "striking", def: "Attracting attention or notice through being unusual or extreme." },
    { word: "insight", def: "The capacity to gain an accurate and deep intuitive understanding." }
];

const canvas = document.getElementById("pinball");
const ctx = canvas.getContext("2d");

// Game State
let score = 0;
let ballsLeft = 3;
let currentTarget = null;
let currentOptions = [];
let gameOver = false;
let ballSaverActive = false;
let ballSaverTimer = 0;
let flipperShrinkTimer = 0;

// Inputs
const keys = { leftShift: false, rightShift: false, launch: false };

window.addEventListener("keydown", (e) => {
    if (e.code === "ShiftLeft") keys.leftShift = true;
    if (e.code === "ShiftRight") keys.rightShift = true;
    if (e.code === "ArrowDown" || e.code === "Space") keys.launch = true;
});

window.addEventListener("keyup", (e) => {
    if (e.code === "ShiftLeft") keys.leftShift = false;
    if (e.code === "ShiftRight") keys.rightShift = false;
    if (e.code === "ArrowDown" || e.code === "Space") keys.launch = false;
});

// Ball Object
const ball = {
    x: 420,
    y: 540,
    vx: 0,
    vy: 0,
    radius: 9,
    inPlunger: true,
    reset() {
        this.x = 420;
        this.y = 540;
        this.vx = 0;
        this.vy = 0;
        this.inPlunger = true;
    }
};

// Plunger/Launcher
const plunger = {
    charge: 0,
    maxCharge: 22
};

// Flippers
const baseFlipperLength = 65;
const flippers = {
    left: { x: 140, y: 530, angle: 0.3, restAngle: 0.3, activeAngle: -0.4, length: baseFlipperLength },
    right: { x: 260, y: 530, angle: -0.3, restAngle: -0.3, activeAngle: 0.4, length: baseFlipperLength }
};

// Target Bumpers (Upper section)
const bumpers = [
    { x: 110, y: 160, radius: 35, word: "", flashTimer: 0 },
    { x: 200, y: 100, radius: 35, word: "", flashTimer: 0 },
    { x: 290, y: 160, radius: 35, word: "", flashTimer: 0 }
];

// Setup New Round/Question
function nextQuestion() {
    // Pick random target word
    const targetIdx = Math.floor(Math.random() * vocabList.length);
    currentTarget = vocabList[targetIdx];

    // Pick 2 other unique wrong words
    let distractors = vocabList.filter(item => item.word !== currentTarget.word);
    distractors.sort(() => 0.5 - Math.random());
    
    currentOptions = [currentTarget.word, distractors[0].word, distractors[1].word];
    // Shuffle options across the 3 bumpers
    currentOptions.sort(() => 0.5 - Math.random());

    for (let i = 0; i < 3; i++) {
        bumpers[i].word = currentOptions[i];
    }

    document.getElementById("def-text").innerText = `DEFINITION: "${currentTarget.def}"`;
}

// Start Game
nextQuestion();

// Main Physics Loop
function update() {
    if (gameOver) return;

    // --- Flipper Shrink Buff/Debuff Timer ---
    if (flipperShrinkTimer > 0) {
        flipperShrinkTimer--;
        flippers.left.length = baseFlipperLength * 0.65;
        flippers.right.length = baseFlipperLength * 0.65;
    } else {
        flippers.left.length = baseFlipperLength;
        flippers.right.length = baseFlipperLength;
    }

    // --- Ball Saver Gate Timer ---
    if (ballSaverTimer > 0) {
        ballSaverTimer--;
        if (ballSaverTimer === 0) ballSaverActive = false;
    }

    // --- Plunger Physics ---
    if (ball.inPlunger) {
        if (keys.launch) {
            plunger.charge = Math.min(plunger.charge + 0.8, plunger.maxCharge);
        } else if (plunger.charge > 0) {
            ball.vy = -plunger.charge;
            ball.vx = (Math.random() - 0.5) * 2;
            ball.inPlunger = false;
            plunger.charge = 0;
        }
    } else {
        // Semi-realistic gravity
        ball.vy += 0.22; 

        // Update Position
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Friction / Air Resistance
        ball.vx *= 0.995;
        ball.vy *= 0.995;
    }

    // --- Walls Collision ---
    // Outer Border
    if (ball.x - ball.radius < 10) { ball.x = 10 + ball.radius; ball.vx *= -0.7; }
    if (ball.x + ball.radius > 390 && !ball.inPlunger) { 
        // Plunger lane barrier
        if (ball.y > 180) {
            ball.x = 390 - ball.radius; 
            ball.vx *= -0.7; 
        }
    }
    if (ball.x + ball.radius > 430) { ball.x = 430 - ball.radius; ball.vx *= -0.7; }
    if (ball.y - ball.radius < 10) { ball.y = 10 + ball.radius; ball.vy *= -0.7; }

    // Curved Arch at Top Right
    if (ball.x > 320 && ball.y < 100) {
        let dx = ball.x - 320;
        let dy = ball.y - 100;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 100) {
            ball.vx -= 0.5;
            ball.vy += 0.5;
        }
    }

    // --- Flippers Logic & Collision ---
    updateFlipper(flippers.left, keys.leftShift, true);
    updateFlipper(flippers.right, keys.rightShift, false);

    checkFlipperCollision(flippers.left, true);
    checkFlipperCollision(flippers.right, false);

    // --- Bumpers Collision (Core Vocabulary Game Mechanic) ---
    bumpers.forEach(b => {
        let dx = ball.x - b.x;
        let dy = ball.y - b.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < b.radius + ball.radius) {
            // Elastic bounce
            let angle = Math.atan2(dy, dx);
            let force = 9;
            ball.vx = Math.cos(angle) * force;
            ball.vy = Math.sin(angle) * force;

            b.flashTimer = 12; // Trigger flashing animation

            // Check Answer
            if (b.word === currentTarget.word) {
                // Correct Word Hit!
                score += 500;
                ballSaverActive = true;
                ballSaverTimer = 360; // ~6 seconds ball-saver gate
                nextQuestion();
            } else {
                // Wrong Word Hit!
                score = Math.max(0, score - 100);
                flipperShrinkTimer = 300; // 5 seconds shrink debuff
            }
            document.getElementById("score-val").innerText = score;
        }
    });

    // --- Ball Saver Gate ---
    if (ballSaverActive && ball.y > 560 && ball.y < 580 && ball.x > 100 && ball.x < 300) {
        ball.vy = -12; // Bounce ball back up
    }

    // --- Drain / Loose Ball ---
    if (ball.y > 620) {
        ballsLeft--;
        document.getElementById("balls-val").innerText = ballsLeft;

        if (ballsLeft <= 0) {
            gameOver = true;
            document.getElementById("def-text").innerText = "GAME OVER! Final Score: " + score + " (Refresh page to replay)";
