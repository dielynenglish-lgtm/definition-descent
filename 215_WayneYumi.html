<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11. The Flashcard Memory Matrix</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for Web Audio SFX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header & HUD -->
    <header class="w-full bg-slate-800 border-b border-slate-700 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                    Flashcard Memory Matrix
                </h1>
                <p class="text-xs text-slate-400">Match Grade 11 Vocabulary & Definitions</p>
            </div>
            
            <div class="flex items-center gap-6 text-sm font-semibold">
                <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700">
                    <span class="text-slate-400 block text-xs">TIMER</span>
                    <span id="timer-display" class="text-xl font-mono text-amber-400">90s</span>
                </div>
                <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700">
                    <span class="text-slate-400 block text-xs">MOVES</span>
                    <span id="moves-display" class="text-xl font-mono text-blue-400">0</span>
                </div>
                <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700">
                    <span class="text-slate-400 block text-xs">MATCHES</span>
                    <span id="matches-display" class="text-xl font-mono text-emerald-400">0/8</span>
                </div>
                <button id="reset-btn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg transition text-xs">
                    🔄 Restart
                </button>
            </div>
        </div>
    </header>

    <!-- Main Game Board -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div id="game-grid" class="grid grid-cols-4 gap-3 w-full max-w-2xl aspect-square perspective-1000">
            <!-- 16 Cards will be dynamically generated here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-3 text-center text-xs text-slate-500">
        Vocabulary Practice Game • Powered by HTML5 & Tailwind CSS
    </footer>

    <!-- Completion Victory / Game Over Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-md w-full text-center shadow-2xl transform transition-all">
            <div id="modal-icon" class="text-5xl mb-3">🏆</div>
            <h2 id="modal-title" class="text-3xl font-bold text-white mb-2">Matrix Completed!</h2>
            <p id="modal-desc" class="text-slate-300 text-sm mb-6">Here is your performance evaluation:</p>

            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3 mb-6 text-left">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Total Matches:</span>
                    <span id="modal-matches" class="font-mono font-bold text-emerald-400">0/8</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Total Attempts:</span>
                    <span id="modal-moves" class="font-mono font-bold text-blue-400">0</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Time Remaining:</span>
                    <span id="modal-time" class="font-mono font-bold text-amber-400">0s</span>
                </div>
                <div class="border-t border-slate-800 pt-2 flex justify-between items-center">
                    <span class="text-slate-300 font-semibold">Efficiency Rating:</span>
                    <span id="modal-rating" class="font-bold text-lg bg-gradient-to-r from-amber-400 to-yellow-300 bg-clip-text text-transparent">S Rank</span>
                </div>
            </div>

            <button id="modal-restart-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-3 rounded-xl font-semibold shadow-lg transition duration-200">
                Play Again
            </button>
        </div>
    </div>

    <!-- Game Logic -->
    <script>
        // 8 Vocabulary Pairs (Words + Definitions based on student input)
        const vocabPairs = [
            { id: 1, word: "disqualify", def: "To declare someone ineligible due to an offense or failure to meet rules." },
            { id: 2, word: "revise", def: "To re-examine, alter, and improve written work or ideas." },
            { id: 3, word: "aerospace", def: "The branch of technology dealing with aviation and spaceflight." },
            { id: 4, word: "surgeon", def: "A medical specialist qualified to perform operative procedures." },
            { id: 5, word: "candidate", def: "A person applying for or being considered for a position or election." },
            { id: 6, word: "applicant", def: "A person who formally submits a request or application for something." },
            { id: 7, word: "launch", def: "To set in motion, send off, or initiate a rocket or new project." },
            { id: 8, word: "matrix", def: "An environment, grid, or structure in which something develops or originates." }
        ];

        // State Variables
        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let moveCount = 0;
        let timeRemaining = 90;
        let timerInterval = null;
        let isBoardLocked = false;
        let gameStarted = false;

        // Sound Effects via Tone.js Synth
        const synth = new Tone.PolySynth().toDestination();
        synth.volume.value = -12;

        function playSound(type) {
            Tone.start();
            if (type === 'flip') {
                synth.triggerAttackRelease("C5", "8n");
            } else if (type === 'match') {
                synth.triggerAttackRelease(["E5", "G5", "C6"], "8n");
            } else if (type === 'mismatch') {
                synth.triggerAttackRelease(["F3", "C3"], "8n");
            } else if (type === 'win') {
                synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n");
            } else if (type === 'lose') {
                synth.triggerAttackRelease(["C3", "B2", "Bb2"], "4n");
            }
        }

        // DOM Elements
        const gridElement = document.getElementById('game-grid');
        const timerDisplay = document.getElementById('timer-display');
        const movesDisplay = document.getElementById('moves-display');
        const matchesDisplay = document.getElementById('matches-display');
        const resetBtn = document.getElementById('reset-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalRestartBtn = document.getElementById('modal-restart-btn');

        // Initialize Game
        function initGame() {
            // Reset variables
            clearInterval(timerInterval);
            timeRemaining = 90;
            moveCount = 0;
            matchedCount = 0;
            flippedCards = [];
            isBoardLocked = false;
            gameStarted = false;

            // Update Displays
            timerDisplay.textContent = `${timeRemaining}s`;
            movesDisplay.textContent = moveCount;
            matchesDisplay.textContent = `0/${vocabPairs.length}`;
            modalOverlay.classList.add('hidden');

            // Build 16 cards array (8 pairs)
            let deck = [];
            vocabPairs.forEach(item => {
                deck.push({ pairId: item.id, text: item.word, type: 'word' });
                deck.push({ pairId: item.id, text: item.def, type: 'def' });
            });

            // Shuffle cards
            cards = shuffle(deck);

            // Render Board
            gridElement.innerHTML = '';
            cards.forEach((cardData, index) => {
                const cardNode = createCardElement(cardData, index);
                gridElement.appendChild(cardNode);
            });
        }

        // Shuffle utility (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Create HTML element for card
        function createCardElement(cardData, index) {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'w-full h-full cursor-pointer select-none';
            cardWrapper.dataset.index = index;
            cardWrapper.dataset.pairId = cardData.pairId;

            cardWrapper.innerHTML = `
                <div class="card-inner relative w-full h-full duration-500 transform-style-3d transition-transform rounded-xl shadow-lg">
                    <!-- Front (Hidden State) -->
                    <div class="card-front absolute inset-0 bg-gradient-to-br from-indigo-700 to-blue-900 border-2 border-indigo-400/30 rounded-xl flex flex-col items-center justify-center backface-hidden p-2 text-center hover:border-indigo-400 transition">
                        <span class="text-2xl text-indigo-300 font-bold opacity-40">?</span>
                    </div>
                    <!-- Back (Exposed Content) -->
                    <div class="card-back absolute inset-0 bg-slate-800 border-2 border-blue-500 rounded-xl flex items-center justify-center backface-hidden rotate-y-180 p-3 text-center overflow-hidden">
                        <span class="${cardData.type === 'word' ? 'font-bold text-lg text-indigo-300 uppercase tracking-wide' : 'text-xs text-slate-200 leading-snug'}">
                            ${cardData.text}
                        </span>
                    </div>
                </div>
            `;

            cardWrapper.addEventListener('click', () => handleCardClick(cardWrapper, cardData));
            return cardWrapper;
        }

        // Timer Logic
        function startTimer() {
            gameStarted = true;
            timerInterval = setInterval(() => {
                timeRemaining--;
                timerDisplay.textContent = `${timeRemaining}s`;

                if (timeRemaining <= 10) {
                    timerDisplay.classList.add('text-red-500', 'animate-pulse');
                } else {
                    timerDisplay.classList.remove('text-red-500', 'animate-pulse');
                }

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    endGame(false);
                }
            }, 1000);
        }

        // Handle Card Click
        function handleCardClick(cardWrapper, cardData) {
            if (isBoardLocked) return;
            
            const cardInner = cardWrapper.querySelector('.card-inner');

            // Prevent clicking already flipped or matched cards
            if (cardInner.classList.contains('rotate-y-180') || cardWrapper.classList.contains('matched')) return;

            // Start timer on first card click
            if (!gameStarted) startTimer();

            // Flip Card
            playSound('flip');
            cardInner.classList.add('rotate-y-180');
            flippedCards.push({ wrapper: cardWrapper, inner: cardInner, data: cardData });

            // Process Pair
            if (flippedCards.length === 2) {
                moveCount++;
                movesDisplay.textContent = moveCount;
                checkMatch();
            }
        }

        // Match Verification
        function checkMatch() {
            isBoardLocked = true;
            const [card1, card2] = flippedCards;

            if (card1.data.pairId === card2.data.pairId) {
                // MATCH FOUND
                setTimeout(() => {
                    playSound('match');
                    card1.wrapper.classList.add('matched');
                    card2.wrapper.classList.add('matched');
                    
                    // Add success visual pulse
                    card1.inner.querySelector('.card-back').classList.replace('border-blue-500', 'border-emerald-500');
                    card2.inner.querySelector('.card-back').classList.replace('border-blue-500', 'border-emerald-500');

                    matchedCount++;
                    matchesDisplay.textContent = `${matchedCount}/${vocabPairs.length}`;
                    flippedCards = [];
                    isBoardLocked = false;

                    if (matchedCount === vocabPairs.length) {
                        clearInterval(timerInterval);
                        endGame(true);
                    }
                }, 400);
            } else {
                // MISMATCH - Flip back after 1-second delay
                setTimeout(() => {
                    playSound('mismatch');
                    card1.inner.classList.remove('rotate-y-180');
                    card2.inner.classList.remove('rotate-y-180');
                    flippedCards = [];
                    isBoardLocked = false;
                }, 1000);
            }
        }

        // Calculate Efficiency Rating
        function calculateRating(moves, timeRemaining) {
            // Optimal moves is 8
            if (moves <= 10 && timeRemaining >= 45) return { grade: "S+ Master", color: "from-amber-400 to-yellow-300" };
            if (moves <= 13 && timeRemaining >= 30) return { grade: "A Scholar", color: "from-emerald-400 to-teal-300" };
            if (moves <= 17) return { grade: "B Proficient", color: "from-blue-400 to-indigo-300" };
            return { grade: "C Apprentice", color: "from-slate-400 to-slate-200" };
        }

        // Game Completion Trigger
        function endGame(isVictory) {
            const modalTitle = document.getElementById('modal-title');
            const modalDesc = document.getElementById('modal-desc');
            const modalIcon = document.getElementById('modal-icon');
            const modalMatches = document.getElementById('modal-matches');
            const modalMoves = document.getElementById('modal-moves');
            const modalTime = document.getElementById('modal-time');
            const modalRating = document.getElementById('modal-rating');

            modalMatches.textContent = `${matchedCount}/${vocabPairs.length}`;
            modalMoves.textContent = moveCount;
            modalTime.textContent = `${timeRemaining}s`;

            if (isVictory) {
                playSound('win');
                modalIcon.textContent = "🏆";
                modalTitle.textContent = "Matrix Cleared!";
                modalDesc.textContent = "Great job! You have matched all vocabulary terms.";
                
                const rating = calculateRating(moveCount, timeRemaining);
                modalRating.textContent = rating.grade;
                modalRating.className = `font-bold text-lg bg-gradient-to-r ${rating.color} bg-clip-text text-transparent`;
            } else {
                playSound('lose');
                modalIcon.textContent = "⏰";
                modalTitle.textContent = "Time Expired!";
                modalDesc.textContent = "You ran out of time! Practice again to increase speed.";
                modalRating.textContent = "Incomplete";
                modalRating.className = "font-bold text-lg text-red-400";
            }

            modalOverlay.classList.remove('hidden');
        }

        // Event Listeners
        resetBtn.addEventListener('click', initGame);
        modalRestartBtn.addEventListener('click', initGame);

        // Start Game on Load
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
