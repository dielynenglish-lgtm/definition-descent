<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Snake-Definition Hunt</title>
    <style>
        body {
            background-color: #0d0f18;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #ui-container {
            width: 600px;
            background: rgba(16, 20, 38, 0.9);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f;
        }

        #definition-box {
            font-size: 1rem;
            color: #ffffff;
            background: #181c33;
            padding: 10px;
            border-left: 4px solid #00ffcc;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #status-message {
            height: 20px;
            color: #ff3333;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 5px #ff3333;
        }

        canvas {
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px #ff007f;
            background-color: #05060a;
            border-radius: 4px;
        }

        #game-over-screen {
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(5, 6, 10, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px #ff0055;
            z-index: 10;
        }

        #game-over-screen h1 {
            font-size: 3rem;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            margin-bottom: 10px;
        }

        #game-over-screen p {
            font-size: 1.5rem;
            color: #fff;
        }

        button {
            background: #00ffcc;
            color: #05060a;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffcc;
            margin-top: 20px;
            border-radius: 4px;
        }

        button:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 15px #ff007f;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="stats">
            <div>SCORE: <span id="score">0</span></div>
            <div>LENGTH: <span id="length">3</span></div>
        </div>
        <div id="definition-box">Target: <span id="target-def">Loading...</span></div>
        <div id="status-message"></div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="game-over-screen">
            <h1>SYSTEM FAILURE</h1>
            <p>FINAL SCORE: <span id="final-score">0</span></p>
            <button onclick="resetGame()">RESTART SYSTEM</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        const vocabList = [
            { word: "BAN", def: "To officially prohibit or forbid something." },
            { word: "WELFARE", def: "The health, happiness, and fortunes of a person or group." },
            { word: "CONTROVERSY", def: "Disagreement, typically when prolonged, public, and heated." },
            { word: "PREY", def: "An animal that is hunted and killed by another for food." },
            { word: "REAR", def: "The back part of something, or to raise/bring up offspring." },
            { word: "SNIFF", def: "To draw in air audibly through the nose to detect a smell." },
            { word: "DIGNITY", def: "The state or quality of being worthy of honor or respect." },
            { word: "INTACT", def: "Not damaged or impaired; kept whole and complete." },
            { word: "ASSEMBLE", def: "To gather together in one place for a common purpose or fit parts together." },
            { word: "MOUNT", def: "To climb up, organize, or fix something firmly in position." }
        ];

        let snake = [];
        let dx = GRID_SIZE;
        let dy = 0;
        let nextDx = GRID_SIZE;
        let nextDy = 0;
        
        let score = 0;
        let isControlsLocked = false;
        let lockTimer = null;
        let gameInterval = null;
        let isGameOver = false;

        let currentTargetWord = "";
        let activePellets = [];

        function initSnake() {
            snake = [
                { x: 10 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 9 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 8 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            nextDx = GRID_SIZE;
            nextDy = 0;
        }

        function getRandomFreeTile() {
            while (true) {
                let x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
                let y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

                let onSnake = snake.some(segment => segment.x === x && segment.y === y);
                let onPellet = activePellets.some(p => p.x === x && p.y === y);

                if (!onSnake && !onPellet) {
                    return { x, y };
                }
            }
        }

        function spawnPellets() {
            activePellets = [];
            
            // Pick a target item randomly
            let targetObj = vocabList[Math.floor(Math.random() * vocabList.length)];
            currentTargetWord = targetObj.word;
            document.getElementById('target-def').innerText = targetObj.def;

            // Pick 2 distinct distractors
            let remaining = vocabList.filter(item => item.word !== currentTargetWord);
            remaining.sort(() => 0.5 - Math.random());
            let distractors = [remaining[0].word, remaining[1].word];

            let pelletWords = [currentTargetWord, distractors[0], distractors[1]];
            pelletWords.sort(() => 0.5 - Math.random()); // Shuffle placement

            pelletWords.forEach(word => {
                let pos = getRandomFreeTile();
                activePellets.push({
                    x: pos.x,
                    y: pos.y,
                    word: word,
                    isCorrect: word === currentTargetWord
                });
            });
        }

        function handleInput(e) {
            if (isControlsLocked || isGameOver) return;

            if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W") && dy === 0) {
                nextDx = 0; nextDy = -GRID_SIZE;
            } else if ((e.key === "ArrowDown" || e.key === "s" || e.key === "S") && dy === 0) {
                nextDx = 0; nextDy = GRID_SIZE;
            } else if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && dx === 0) {
                nextDx = -GRID_SIZE; nextDy = 0;
            } else if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && dx === 0) {
                nextDx = GRID_SIZE; nextDy = 0;
            }
        }

        function lockControls() {
            isControlsLocked = true;
            document.getElementById('status-message').innerText = "SYSTEM POISONED! CONTROLS LOCKED (1.5s)";
            if (lockTimer) clearTimeout(lockTimer);
            lockTimer = setTimeout(() => {
                isControlsLocked = false;
                document.getElementById('status-message').innerText = "";
            }, 1500);
        }

        function update() {
            if (isGameOver) return;

            dx = nextDx;
            dy = nextDy;

            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                triggerGameOver();
                return;
            }

            // Self Collision Loop
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check Pellet Collision
            let hitPelletIndex = activePellets.findIndex(p => p.x === head.x && p.y === head.y);

            if (hitPelletIndex !== -1) {
                let hitPellet = activePellets[hitPelletIndex];

                if (hitPellet.isCorrect) {
                    // Correct Pellet
                    score += 10;
                    document.getElementById('score').innerText = score;
                    // Tail grows naturally by not popping segment
                    spawnPellets();
                } else {
                    // Incorrect Pellet (Poison Mechanic)
                    snake.pop(); // Remove regular step growth
                    
                    // Chop off two tail segments
                    if (snake.length > 1) snake.pop();
                    if (snake.length > 1) snake.pop();

                    lockControls();
                    // Respawn pellets for current definition
                    spawnPellets();
                }
            } else {
                snake.pop();
            }

            document.getElementById('length').innerText = snake.length;
        }

        function drawGrid() {
            ctx.strokeStyle = "rgba(0, 255, 204, 0.05)";
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGrid();

            // Render Pellets
            activePellets.forEach(pellet => {
                ctx.fillStyle = "#ff007f";
                ctx.shadowColor = "#ff007f";
                ctx.shadowBlur = 8;
                ctx.fillRect(pellet.x + 1, pellet.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);

                // Word Label
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 9px monospace";
                ctx.textAlign = "center";
                ctx.fillText(pellet.word, pellet.x + GRID_SIZE / 2, pellet.y - 2);
            });

            // Render Snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = isControlsLocked ? "#ff3333" : "#00ffcc";
                    ctx.shadowColor = isControlsLocked ? "#ff3333" : "#00ffcc";
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = isControlsLocked ? "rgba(255, 51, 51, 0.6)" : "rgba(0, 255, 204, 0.6)";
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(segment.x + 1, segment.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
        }

        function gameLoop() {
            update();
            render();
        }

        function triggerGameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = "flex";
        }

        function resetGame() {
            score = 0;
            isGameOver = false;
            isControlsLocked = false;
            document.getElementById('score').innerText = score;
            document.getElementById('status-message').innerText = "";
            document.getElementById('game-over-screen').style.display = "none";
            
            initSnake();
            spawnPellets();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        window.addEventListener('keydown', handleInput);
        resetGame();
    </script>
</body>
</html>
