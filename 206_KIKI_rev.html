<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Snake: Definition Hunt (Easy Mode)</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            margin: 5px 0 10px 0;
            text-shadow: 0 0 10px #00ffcc;
        }

        /* Vocabulary Reference Sheet */
        #vocab-reference {
            background: #151828;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 10px;
            width: 700px;
            margin-bottom: 12px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            max-height: 120px;
            overflow-y: auto;
        }
        #vocab-reference h3 {
            margin: 0 0 6px 0;
            color: #ffff00;
            text-align: center;
            font-size: 14px;
            text-transform: uppercase;
        }
        .vocab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 12px;
        }
        .vocab-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .vocab-item strong {
            color: #ff00ff;
        }

        #ui-container {
            width: 700px;
            background: #151828;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 10px;
        }

        #definition-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 0 0 5px #ffff00;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
        }

        #score-board {
            font-size: 1.1rem;
            font-weight: bold;
        }

        canvas {
            background-color: #05050a;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
            display: block;
            border-radius: 6px;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            background: rgba(13, 14, 21, 0.95);
            border: 3px solid #ff0055;
            box-shadow: 0 0 25px #ff0055;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        #game-over-screen h2 {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            margin-top: 0;
        }

        button {
            background: #00ffcc;
            color: #0d0e15;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffcc;
            border-radius: 5px;
            margin-top: 15px;
        }

        button:hover {
            background: #ff00ff;
            color: #ffffff;
            box-shadow: 0 0 10px #ff00ff;
        }
    </style>
</head>
<body>

    <h1>CYBERPUNK SNAKE (EASY MODE)</h1>
    
    <!-- Vocabulary Reference Sheet -->
    <div id="vocab-reference">
        <h3>Vocabulary List Reference</h3>
        <div class="vocab-grid" id="vocab-grid-list"></div>
    </div>

    <div id="ui-container">
        <div id="score-board">SCORE: <span id="score">0</span> | TAIL LENGTH: <span id="length">3</span></div>
        <div id="definition-display">Target Definition Loading...</div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="700" height="440"></canvas>
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p id="final-stats" style="font-size: 18px; color: #fff;"></p>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Increased Grid Size for Bigger Items
        const gridSize = 35;
        const tileCountX = canvas.width / gridSize;
        const tileCountY = canvas.height / gridSize;

        // Vocabulary Database
        const vocabList = [
            { word: "ban", def: "To officially prohibit or forbid something." },
            { word: "welfare", def: "The health, happiness, and fortunes of a person/group." },
            { word: "controversy", def: "Disagreement, typically public and heated." },
            { word: "prey", def: "An animal that is hunted and killed for food." },
            { word: "rear", def: "The back part of something; or to raise offspring." },
            { word: "sniff", def: "To draw in air through the nose to detect a smell." },
            { word: "dignity", def: "The state of being worthy of honor or respect." },
            { word: "intact", def: "Not damaged or impaired; kept whole." },
            { word: "assemble", def: "To fit together separate component parts." },
            { word: "mount", def: "To climb up on, or to organize and initiate." }
        ];

        // Populate Reference Sheet
        const vocabGrid = document.getElementById("vocab-grid-list");
        vocabList.forEach(item => {
            const div = document.createElement("div");
            div.className = "vocab-item";
            div.innerHTML = `<strong>${item.word}:</strong> ${item.def}`;
            vocabGrid.appendChild(div);
        });

        let snake = [];
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let currentTarget = null;
        let pellets = [];
        let gameInterval = null;
        let isGameOver = false;

        function init() {
            snake = [
                { x: 5 * gridSize, y: 5 * gridSize },
                { x: 4 * gridSize, y: 5 * gridSize },
                { x: 3 * gridSize, y: 5 * gridSize }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            isGameOver = false;
            document.getElementById("score").innerText = score;
            document.getElementById("length").innerText = snake.length;
            document.getElementById("game-over-screen").style.display = "none";
            
            pickNewTarget();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 180); // Slower, relaxed speed
        }

        function pickNewTarget() {
            currentTarget = vocabList[Math.floor(Math.random() * vocabList.length)];
            document.getElementById("definition-display").innerText = `TARGET DEFINITION: "${currentTarget.def}"`;

            let distractors = vocabList.filter(item => item.word !== currentTarget.word);
            distractors.sort(() => 0.5 - Math.random());
            let choices = [currentTarget.word, distractors[0].word, distractors[1].word];
            choices.sort(() => 0.5 - Math.random());

            pellets = [];
            choices.forEach(word => {
                let pos = getUnoccupiedPosition();
                pellets.push({ x: pos.x, y: pos.y, word: word });
            });
        }

        function getUnoccupiedPosition() {
            let valid = false;
            let pos = {};
            while (!valid) {
                pos = {
                    x: Math.floor(Math.random() * tileCountX) * gridSize,
                    y: Math.floor(Math.random() * tileCountY) * gridSize
                };
                valid = !snake.some(segment => segment.x === pos.x && segment.y === pos.y) &&
                        !pellets.some(p => p.x === pos.x && p.y === pos.y);
            }
            return pos;
        }

        function gameLoop() {
            if (isGameOver) return;
            moveSnake();
            if (checkCollisions()) return;
            draw();
        }

        function moveSnake() {
            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            // Screen Wraparound (Easier gameplay)
            if (headX < 0) headX = canvas.width - gridSize;
            if (headX >= canvas.width) headX = 0;
            if (headY < 0) headY = canvas.height - gridSize;
            if (headY >= canvas.height) headY = 0;

            const head = { x: headX, y: headY };
            snake.unshift(head);

            let atePellet = false;
            pellets.forEach((pellet) => {
                if (head.x === pellet.x && head.y === pellet.y) {
                    atePellet = true;
                    if (pellet.word === currentTarget.word) {
                        score += 10;
                        document.getElementById("score").innerText = score;
                        pickNewTarget();
                    } else {
                        score = Math.max(0, score - 5);
                        document.getElementById("score").innerText = score;
                        pickNewTarget();
                    }
                }
            });

            if (!atePellet) {
                snake.pop();
            }
            document.getElementById("length").innerText = snake.length;
        }

        function checkCollisions() {
            const head = snake[0];

            // Self-Collision Check
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver("System Overload! Collided with your own trail!");
                    return true;
                }
            }
            return false;
        }

        function triggerGameOver(reason) {
            isGameOver = true;
            clearInterval(gameInterval);
            document.getElementById("final-stats").innerText = `${reason}\nFinal Score: ${score}`;
            document.getElementById("game-over-screen").style.display = "block";
        }

        function draw() {
            ctx.fillStyle = "#05050a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Cyberpunk Grid
            ctx.strokeStyle = "#121526";
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = (index === 0) ? "#00ffcc" : "#0088cc";
                ctx.fillRect(segment.x + 1, segment.y + 1, gridSize - 2, gridSize - 2);
            });

            // Draw Food Pellets with Large, Clear Labels
            pellets.forEach(pellet => {
                // Background Chip for text contrast
                ctx.fillStyle = "#ff00ff";
                ctx.fillRect(pellet.x, pellet.y, gridSize - 1, gridSize - 1);

                // Word Label
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px Courier New";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(pellet.word, pellet.x + gridSize / 2, pellet.y + gridSize / 2);
            });
        }

        // Input Control Handler
        window.addEventListener("keydown", e => {
            if (isGameOver) return;

            switch (e.key) {
                case "ArrowUp":
                    if (dy === 0) { dx = 0; dy = -gridSize; }
                    break;
                case "ArrowDown":
                    if (dy === 0) { dx = 0; dy = gridSize; }
                    break;
                case "ArrowLeft":
                    if (dx === 0) { dx = -gridSize; dy = 0; }
                    break;
                case "ArrowRight":
                    if (dx === 0) { dx = gridSize; dy = 0; }
                    break;
            }
        });

        function resetGame() {
            init();
        }

        init();
    </script>
</body>
</html>
