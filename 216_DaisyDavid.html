<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-A-Word Arcade!</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .game-container {
      max-width: 650px;
      margin: 0 auto;
      background: #16213e;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 3px solid #0f3460;
    }
    h1 {
      margin-top: 0;
      color: #e94560;
      letter-spacing: 1px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      font-size: 1.2rem;
      background: #0f3460;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .def-card {
      background: #e94560;
      color: #ffffff;
      padding: 15px;
      border-radius: 12px;
      font-size: 1.15rem;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      justify-items: center;
      margin-bottom: 25px;
    }
    .hole {
      width: 150px;
      height: 110px;
      background: #2b1e17;
      border-radius: 50% / 40%;
      position: relative;
      overflow: hidden;
      border: 5px solid #4a3525;
      box-shadow: inset 0 10px 10px rgba(0,0,0,0.7);
    }
    .mole {
      width: 130px;
      height: 95px;
      background: #dca153;
      border-radius: 40px 40px 15px 15px;
      position: absolute;
      bottom: -100px;
      left: 5px;
      transition: bottom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a2e;
      font-weight: 800;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2), 0 0 5px rgba(0,0,0,0.3);
      text-transform: uppercase;
    }
    .hole.up .mole {
      bottom: 8px;
    }
    .mole.correct-hit {
      background: #4eef90 !important;
    }
    .mole.wrong-hit {
      background: #ff4d4d !important;
    }
    .btn {
      background: #e94560;
      color: white;
      border: none;
      padding: 14px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
    }
    .btn:hover {
      background: #ff5e7e;
      transform: scale(1.05);
    }
    .btn:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>Whack-A-Word!</h1>
    
    <div class="stats-bar">
      <div>Score: <span id="score">0</span></div>
      <div>Time Left: <span id="timer">60</span>s</div>
    </div>

    <div class="def-card" id="definition">Click "Start Game" to play!</div>

    <div class="grid">
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
    </div>

    <button id="start-btn" class="btn" onclick="startGame()">Start Game</button>
  </div>

  <script>
    const vocabList = [
      { word: 'coincidence', def: 'A remarkable occurrence of events by chance without planning.' },
      { word: 'invade', def: 'To enter a country or region forcibly with armed forces.' },
      { word: 'overthrow', def: 'To forcibly remove a leader or government from power.' },
      { word: 'rigid', def: 'Not flexible; stiff and unable to bend or change.' },
      { word: 'labor', def: 'Hard physical work or strenuous exertion.' },
      { word: 'peasant', def: 'A poor farmer of low social status who works small land.' },
      { word: 'noble', def: 'Belonging to a high social class with rank, title, or high honor.' }
    ];

    const holes = document.querySelectorAll('.hole');
    const moles = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const timerDisplay = document.getElementById('timer');
    const defDisplay = document.getElementById('definition');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let timeLeft = 60;
    let gameInterval;
    let timerInterval;
    let currentTarget = null;
    let isPlaying = false;
    let lastHole;

    function getRandomTarget() {
      const idx = Math.floor(Math.random() * vocabList.length);
      return vocabList[idx];
    }

    function getRandomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) return getRandomHole();
      lastHole = hole;
      return hole;
    }

    function spawnMole() {
      if (!isPlaying) return;

      const hole = getRandomHole();
      const mole = hole.querySelector('.mole');

      // 60% chance to spawn the correct word, 40% chance for a distractor
      let spawnedWord;
      if (Math.random() < 0.60) {
        spawnedWord = currentTarget.word;
      } else {
        const distractors = vocabList.filter(v => v.word !== currentTarget.word);
        spawnedWord = distractors[Math.floor(Math.random() * distractors.length)].word;
      }

      mole.textContent = spawnedWord;
      mole.dataset.word = spawnedWord;
      mole.className = 'mole'; 

      hole.classList.add('up');

      const popDuration = Math.floor(Math.random() * 600) + 1000; // 1 to 1.6s
      setTimeout(() => {
        hole.classList.remove('up');
      }, popDuration);
    }

    function handleMoleClick(e) {
      if (!isPlaying) return;
      const clickedMole = e.target;
      const hole = clickedMole.parentElement;

      if (!hole.classList.contains('up')) return;

      if (clickedMole.dataset.word === currentTarget.word) {
        score += 10;
        scoreDisplay.textContent = score;
        clickedMole.classList.add('correct-hit');
        
        // Pick new definition after hit
        currentTarget = getRandomTarget();
        defDisplay.textContent = "MATCH THIS: " + currentTarget.def;
      } else {
        score = Math.max(0, score - 5);
        scoreDisplay.textContent = score;
        clickedMole.classList.add('wrong-hit');
      }

      hole.classList.remove('up');
    }

    moles.forEach(mole => mole.addEventListener('click', handleMoleClick));

    function startGame() {
      score = 0;
      timeLeft = 60;
      isPlaying = true;
      scoreDisplay.textContent = score;
      timerDisplay.textContent = timeLeft;
      startBtn.disabled = true;

      currentTarget = getRandomTarget();
      defDisplay.textContent = "MATCH THIS: " + currentTarget.def;

      gameInterval = setInterval(spawnMole, 900);

      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(timerInterval);
      holes.forEach(hole => hole.classList.remove('up'));
      defDisplay.textContent = `Game Over! Final Score: ${score}`;
      startBtn.disabled = false;
    }
  </script>
</body>
</html>
