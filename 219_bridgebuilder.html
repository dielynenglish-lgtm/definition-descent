<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Runner: Bridge Builder (Grade 11)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 5px;
      color: #e94560;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #instructions {
      margin-bottom: 15px;
      color: #a2a2bd;
      font-size: 14px;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 400px;
      background: linear-gradient(to bottom, #0f3460, #16213e);
      border: 4px solid #e94560;
      border-radius: 8px;
      overflow: hidden;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Drag and Drop Overlay */
    #puzzle-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 52, 96, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #puzzle-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    #prompt-box {
      background: #16213e;
      border: 2px solid #e94560;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
      max-width: 80%;
      text-align: center;
    }
    #prompt-box h3 {
      color: #e94560;
      margin-bottom: 5px;
    }
    #drop-zone {
      width: 250px;
      height: 60px;
      border: 3px dashed #e94560;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(233, 69, 96, 0.1);
      margin-bottom: 25px;
      font-weight: bold;
      color: #a2a2bd;
      transition: background 0.2s ease;
    }
    #drop-zone.hover {
      background: rgba(233, 69, 96, 0.3);
      border-color: #4ecca3;
    }
    #planks-container {
      display: flex;
      gap: 15px;
    }
    .plank {
      background: #8d5b4c;
      border: 2px solid #5c3a2e;
      color: #fff;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      cursor: grab;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .plank:active {
      cursor: grabbing;
    }
    #feedback {
      margin-top: 15px;
      font-weight: bold;
      height: 20px;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #4ecca3;
    }
  </style>
</head>
<body>

  <h1>Vocab Runner: Bridge Builder</h1>
  <div id="instructions">Use [A/D] or [Left/Right] to Move | [W/Space/Up] to Jump. Build bridges across gaps using vocabulary planks!</div>

  <div id="game-container">
    <canvas id="canvas" width="800" height="400"></canvas>
    
    <div id="hud">Bridge Gaps Cleared: <span id="score">0</span>/5</div>

    <div id="puzzle-overlay">
      <div id="prompt-box">
        <h3>Bridge Construction Needed!</h3>
        <p id="definition-text">Definition loading...</p>
      </div>

      <div id="drop-zone">DROP CORRECT PLANK HERE</div>

      <div id="planks-container"></div>
      <div id="feedback"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Game State & Vocabulary Data
    const vocabList = [
      { word: "Ephemeral", def: "Lasting for a very short time; fleeting." },
      { word: "Ubiquitous", def: "Present, appearing, or found everywhere." },
      { word: "Mitigate", def: "Make less severe, serious, or painful." },
      { word: "Pragmatic", def: "Dealing with things sensibly and realistically." },
      { word: "Cacophony", def: "A harsh, discordant mixture of sounds." },
      { word: "Anomaly", def: "Something that deviates from what is standard, normal, or expected." },
      { word: "Tenacious", def: "Tending to keep a firm hold of something; persistent." },
      { word: "Fastidious", def: "Very attentive to and concerned about accuracy and detail." }
    ];

    let currentVocabIndex = 0;
    let score = 0;
    let cameraX = 0;
    let isPaused = false;

    // Key Tracking
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Player Object
    const player = {
      x: 50,
      y: 200,
      width: 30,
      height: 40,
      vx: 0,
      vy: 0,
      speed: 4,
      jumpPower: -10,
      gravity: 0.5,
      grounded: false
    };

    // Platforms & Gaps Setup
    let platforms = [
      { x: 0, width: 400, height: 100 },
      { x: 550, width: 400, height: 100 },
      { x: 1100, width: 400, height: 100 },
      { x: 1650, width: 400, height: 100 },
      { x: 2200, width: 400, height: 100 },
      { x: 2750, width: 600, height: 100 }
    ];

    let gaps = [
      { x: 400, width: 150, triggerX: 380, solved: false, index: 0 },
      { x: 950, width: 150, triggerX: 930, solved: false, index: 1 },
      { x: 1500, width: 150, triggerX: 1480, solved: false, index: 2 },
      { x: 2050, width: 150, triggerX: 2030, solved: false, index: 3 },
      { x: 2600, width: 150, triggerX: 2580, solved: false, index: 4 }
    ];

    let activeGap = null;

    // Drag and Drop Elements
    const overlay = document.getElementById('puzzle-overlay');
    const defText = document.getElementById('definition-text');
    const dropZone = document.getElementById('drop-zone');
    const planksContainer = document.getElementById('planks-container');
    const feedback = document.getElementById('feedback');

    function setupDragAndDrop() {
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('hover');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('hover');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('hover');
        const draggedWord = e.dataTransfer.getData('text/plain');
        checkAnswer(draggedWord);
      });
    }

    function openPuzzle(gap) {
      isPaused = true;
      activeGap = gap;
      feedback.textContent = "";
      feedback.style.color = "";
      overlay.classList.add('active');

      const currentTarget = vocabList[currentVocabIndex];
      defText.textContent = `"${currentTarget.def}"`;

      // Select 2 wrong choices
      let distractors = vocabList.filter(v => v.word !== currentTarget.word);
      distractors = distractors.sort(() => 0.5 - Math.random()).slice(0, 2);

      let choices = [currentTarget, ...distractors].sort(() => 0.5 - Math.random());

      planksContainer.innerHTML = '';
      choices.forEach(item => {
        const plank = document.createElement('div');
        plank.className = 'plank';
        plank.textContent = item.word;
        plank.draggable = true;

        plank.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', item.word);
        });

        planksContainer.appendChild(plank);
      });
    }

    function checkAnswer(selectedWord) {
      const correctWord = vocabList[currentVocabIndex].word;
      if (selectedWord === correctWord) {
        feedback.textContent = "Correct! Bridge Built!";
        feedback.style.color = "#4ecca3";

        setTimeout(() => {
          overlay.classList.remove('active');
          activeGap.solved = true;
          // Fill gap with a solid platform
          platforms.push({ x: activeGap.x, width: activeGap.width, height: 100 });
          score++;
          document.getElementById('score').textContent = score;
          currentVocabIndex = (currentVocabIndex + 1) % vocabList.length;
          isPaused = false;
        }, 800);
      } else {
        feedback.textContent = "Incorrect! Try another plank.";
        feedback.style.color = "#e94560";
      }
    }

    function update() {
      if (isPaused) return;

      // Horizontal Movement
      if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
      else if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;
      else player.vx = 0;

      // Jump
      if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }

      // Gravity
      player.vy += player.gravity;

      // Apply Movement
      player.x += player.vx;
      player.y += player.vy;

      // Camera Follows Player
      cameraX = player.x - 200;
      if (cameraX < 0) cameraX = 0;

      // Ground/Platform Collision
      player.grounded = false;
      const groundY = 300; // top edge of platforms

      platforms.forEach(p => {
        if (
          player.x + player.width > p.x &&
          player.x < p.x + p.width &&
          player.y + player.height >= groundY &&
          player.y + player.height <= groundY + 15 &&
          player.vy >= 0
        ) {
          player.y = groundY - player.height;
          player.vy = 0;
          player.grounded = true;
        }
      });

      // Check for Gaps / Puzzles Trigger
      gaps.forEach(gap => {
        if (!gap.solved && player.x >= gap.triggerX && player.x <= gap.triggerX + 20) {
          player.x = gap.triggerX - 5; // freeze just before gap
          player.vx = 0;
          openPuzzle(gap);
        }
      });

      // Pitfall Check (Reset position if player falls into gap)
      if (player.y > canvas.height) {
        player.x = Math.max(50, player.x - 250);
        player.y = 200;
        player.vy = 0;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Draw Platforms
      ctx.fillStyle = '#4ecca3';
      platforms.forEach(p => {
        ctx.fillRect(p.x, 300, p.width, p.height);
      });

      // Draw Unsolved Gaps Indicator
      gaps.forEach(gap => {
        if (!gap.solved) {
          ctx.strokeStyle = '#e94560';
          ctx.setLineDash([5, 5]);
          ctx.strokeRect(gap.x, 300, gap.width, 2);
          ctx.setLineDash([]);
        }
      });

      // Draw Player
      ctx.fillStyle = '#e94560';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    setupDragAndDrop();
    gameLoop();
  </script>
</body>
</html>
