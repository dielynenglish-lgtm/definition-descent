<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definition Gates - Endless Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d0f18;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            border: 2px solid #00f3ff;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #111;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 15, 24, 0.85);
            border-bottom: 2px solid #00f3ff;
            z-index: 10;
        }
        .ui-element {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #definition-bar {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(20, 25, 45, 0.95);
            border: 1px solid #ff0055;
            padding: 10px 15px;
            border-radius: 5px;
            text-align: center;
            color: #ffe600;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            display: none;
            z-index: 10;
        }
        #shield-bar-container {
            width: 120px;
            height: 14px;
            background: #222;
            border: 1px solid #00f3ff;
            border-radius: 7px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }
        #shield-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #00ff66);
            transition: width 0.3s ease;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(10, 12, 20, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        h1 {
            color: #00f3ff;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00f3ff;
        }
        p {
            color: #aaa;
            font-size: 14px;
            max-width: 80%;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-overlay">
        <div class="ui-element">DISTANCE: <span id="score-text" style="color: #00f3ff;">0</span>m</div>
        <div class="ui-element">
            SHIELD: 
            <div id="shield-bar-container">
                <div id="shield-bar"></div>
            </div>
        </div>
    </div>

    <div id="definition-bar">TARGET DEFINITION: <span id="def-text">...</span></div>

    <div id="start-screen">
        <h1>DEFINITION GATES</h1>
        <p>Shift lanes using <b>Left / Right Arrows</b> (or <b>A / D</b>).<br>Jump over obstacles with <b>Up Arrow</b> (or <b>W / Space</b>).<br>Pass through the archway displaying the correct word!</p>
        <button class="btn" onclick="startGame()">START RUN</button>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1 style="color: #ff0055; text-shadow: 0 0 10px #ff0055;">SYSTEM CRASH</h1>
        <p>Final Distance Covered: <span id="final-score" style="color: #00f3ff; font-weight: bold;">0</span> meters</p>
        <button class="btn" onclick="startGame()">RETRY</button>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
// 僅使用你指定的 7 個單字
const vocabList = [
    { word: "solo", def: "Done, performed, or made by one person alone." },
    { word: "compromise", def: "An agreement reached by each side making concessions." },
    { word: "split", def: "To divide or cause to divide into parts or groups." },
    { word: "arise", def: "To come into being, notice, or existence." },
    { word: "occasionally", def: "At infrequent or irregular intervals; now and then." },
    { word: "destination", def: "The place to which someone or something is going." },
    { word: "flexibility", def: "The quality of bending easily or willingness to change." }
];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameActive = false;
let score = 0;
let shield = 100;
let baseSpeed = 2.5; // 調慢初始速度 (原為 4)
let speed = baseSpeed;
let distanceCounter = 0;

let currentLane = 1; // 0: Left, 1: Middle, 2: Right
const laneX = [220, 400, 580];

let player = {
    y: 350,
    jumpY: 0,
    vy: 0,
    isJumping: false,
    radius: 20
};

let obstacles = [];
let gate = null;
let gateTimer = 0;

function resetGame() {
    score = 0;
    shield = 100;
    speed = baseSpeed;
    currentLane = 1;
    obstacles = [];
    gate = null;
    gateTimer = 0;
    player.jumpY = 0;
    player.isJumping = false;
    updateUI();
}

function startGame() {
    resetGame();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    gameActive = true;
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameActive = false;
    document.getElementById('definition-bar').style.display = 'none';
    document.getElementById('final-score').innerText = Math.floor(score);
    document.getElementById('game-over-screen').style.display = 'flex';
}

function updateUI() {
    document.getElementById('score-text').innerText = Math.floor(score);
    document.getElementById('shield-bar').style.width = shield + '%';
    if (shield <= 30) {
        document.getElementById('shield-bar').style.background = '#ff0055';
    } else {
        document.getElementById('shield-bar').style.background = 'linear-gradient(90deg, #00f3ff, #00ff66)';
    }
}

// 鍵盤控制
window.addEventListener('keydown', (e) => {
    if (!gameActive) return;

    if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > 0) {
        currentLane--;
    } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 2) {
        currentLane++;
    } else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') && !player.isJumping) {
        player.isJumping = true;
        player.vy = -12;
    }
});

function spawnGate() {
    const correctIdx = Math.floor(Math.random() * vocabList.length);
    let wrongIdx = Math.floor(Math.random() * vocabList.length);
    while (wrongIdx === correctIdx) {
        wrongIdx = Math.floor(Math.random() * vocabList.length);
    }

    const correctData = vocabList[correctIdx];
    const wrongData = vocabList[wrongIdx];

    const correctLane = Math.floor(Math.random() * 2);
    
    gate = {
        y: -100,
        correctWord: correctData.word,
        correctLane: correctLane,
        laneA: { lane: 0, word: correctLane === 0 ? correctData.word : wrongData.word },
        laneB: { lane: 1, word: correctLane === 1 ? correctData.word : wrongData.word },
        def: correctData.def
    };

    document.getElementById('def-text').innerText = gate.def;
    document.getElementById('definition-bar').style.display = 'block';
}

function spawnObstacle() {
    if (gate && gate.y < 200) return;
    const lane = Math.floor(Math.random() * 3);
    obstacles.push({
        lane: lane,
        y: -30,
        size: 30
    });
}

function gameLoop() {
    if (!gameActive) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 顯著放慢加速度 (原為 0.0008)
    speed += 0.0002;
    score += speed * 0.05;
    gateTimer += 1 / 60;

    // 每 10 秒產生一次單字門
    if (gateTimer > 10 && !gate) {
        spawnGate();
        gateTimer = 0;
    }

    // 隨機障礙物
    if (!gate && Math.random() < 0.015) {
        if (obstacles.length === 0 || obstacles[obstacles.length - 1].y > 200) {
            spawnObstacle();
        }
    }

    // 跳躍物理
    if (player.isJumping) {
        player.jumpY += player.vy;
        player.vy += 0.6;
        if (player.jumpY >= 0) {
            player.jumpY = 0;
            player.isJumping = false;
        }
    }

    // 跑道線條
    ctx.strokeStyle = '#00f3ff22';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(310, 0); ctx.lineTo(310, canvas.height);
    ctx.moveTo(490, 0); ctx.lineTo(490, canvas.height);
    ctx.stroke();

    distanceCounter += speed;
    ctx.strokeStyle = '#00f3ff33';
    for (let i = (distanceCounter % 40); i < canvas.height; i += 40) {
        ctx.beginPath();
        ctx.moveTo(130, i);
        ctx.lineTo(670, i);
        ctx.stroke();
    }

    // 障礙物繪製與碰撞
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += speed;

        ctx.fillStyle = '#ff5500';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff5500';
        ctx.fillRect(laneX[obs.lane] - 20, obs.y - 15, 40, 30);
        ctx.shadowBlur = 0;

        if (obs.lane === currentLane && Math.abs((player.y + player.jumpY) - obs.y) < 25 && player.jumpY > -10) {
            shield -= 20;
            speed = Math.max(baseSpeed, speed - 0.5);
            obstacles.splice(i, 1);
            if (shield <= 0) gameOver();
            continue;
        }

        if (obs.y > canvas.height + 50) obstacles.splice(i, 1);
    }

    // 單字門繪製與判定
    if (gate) {
        gate.y += speed;

        const drawArch = (lane, word) => {
            let x = laneX[lane];
            ctx.fillStyle = '#101830';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';

            ctx.fillRect(x - 65, gate.y - 40, 130, 50);
            ctx.strokeRect(x - 65, gate.y - 40, 130, 50);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px Segoe UI';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 0;
            ctx.fillText(word, x, gate.y - 12);
        };

        drawArch(0, gate.laneA.word);
        drawArch(1, gate.laneB.word);

        if (gate.y >= player.y - 10) {
            if (currentLane === gate.correctLane) {
                score += 100;
                speed += 0.3; // 通過後加速減緩 (原為 0.8)
                shield = Math.min(100, shield + 10);
            } else {
                shield -= 35;
                speed = Math.max(baseSpeed, speed - 1);
                if (shield <= 0) gameOver();
            }

            gate = null;
            document.getElementById('definition-bar').style.display = 'none';
        }
    }

    // 繪製玩家
    let px = laneX[currentLane];
    let py = player.y + player.jumpY;

    ctx.fillStyle = '#00f3ff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f3ff';
    ctx.beginPath();
    ctx.arc(px, py, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    updateUI();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
