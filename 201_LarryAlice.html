<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner: Definition Gates</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0c10;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            background: #1f2833;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 12, 16, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #45a29e;
        }
        #def-box {
            background: rgba(31, 40, 51, 0.95);
            border: 2px solid #66fcf1;
            border-radius: 8px;
            padding: 10px 15px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #66fcf1;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stat-label { font-size: 12px; color: #c5c6c7; margin-right: 6px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #fff; }
        #shield-bar-container {
            width: 120px;
            height: 14px;
            background: #0b0c10;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #45a29e;
            display: inline-block;
            vertical-align: middle;
        }
        #shield-bar {
            width: 100%;
            height: 100%;
            background: #66fcf1;
            transition: width 0.2s ease, background-color 0.2s;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        h1 { font-size: 34px; margin-bottom: 12px; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 15px; margin-bottom: 20px; text-align: center; max-width: 580px; line-height: 1.5; color: #c5c6c7; }
        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            background: #45a29e;
            color: #0b0c10;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background: #66fcf1; transform: scale(1.05); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="ui-overlay">
        <div id="top-bar">
            <div>
                <span class="stat-label">DISTANCE:</span>
                <span id="score-val" class="stat-value">0m</span>
            </div>
            <div>
                <span class="stat-label">SHIELD:</span>
                <div id="shield-bar-container">
                    <div id="shield-bar"></div>
                </div>
            </div>
            <div>
                <span class="stat-label">SPEED:</span>
                <span id="speed-val" class="stat-value">1.0x</span>
            </div>
        </div>
        <div id="def-box">
            <span id="def-text">Press START to begin!</span>
        </div>
    </div>

    <div id="start-screen">
        <h1>Definition Gates</h1>
        <p>Run forward, jump over obstacles, and pass through the correct gate matching the definition shown at the top!</p>
        <p><strong>Controls:</strong> Up Arrow = Jump | Left/Right Arrows = Shift Lanes</p>
        <button class="btn" onclick="startGame()">START RUN</button>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1 style="color: #ff4d4d;">SHIELD DESTROYED</h1>
        <p id="final-score">Distance: 0m</p>
        <button class="btn" onclick="startGame()">TRY AGAIN</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const vocabList = [
    { word: "disqualify", def: "To declare someone ineligible due to an offense or failure to meet standards." },
    { word: "revise", def: "To re-examine and make alterations, corrections, or improvements." },
    { word: "aerospace", def: "The branch of technology and industry concerned with aviation and spaceflight." },
    { word: "surgeon", def: "A medical practitioner qualified to practice surgery." },
    { word: "candidate", def: "A person who applies for a job or is nominated for an election/position." },
    { word: "applicant", def: "A person who formally applies for something, such as a job or admission." },
    { word: "launch", def: "To set in motion, send off a rocket/vessel, or initiate a new campaign." },
    { word: "orbit", def: "The curved path of a celestial object or spacecraft around a star or planet." },
    { word: "precision", def: "The quality, condition, or fact of being exact and accurate." },
    { word: "mission", def: "An important assignment or operational task given to a person or group." }
];

let gameState = "MENU";
let distance = 0;
let speed = 1.5;         // Very slow relaxed initial speed
let baseSpeed = 1.5;
let shield = 100;
let frameCount = 0;
let gateTimer = 0;
let pendingGateData = null;

const laneX = [220, 400, 580];
const player = {
    lane: 1,
    x: 400,
    y: 360,
    targetX: 400,
    yOffset: 0,
    jumpVy: 0,
    isJumping: false,
    width: 32,
    height: 48
};

let obstacles = [];
let gateSystem = null;

window.addEventListener('keydown', (e) => {
    if (gameState !== "RUNNING") return;
    if ((e.key === "ArrowLeft" || e.key === "a") && player.lane > 0) {
        player.lane--;
        player.targetX = laneX[player.lane];
    } else if ((e.key === "ArrowRight" || e.key === "d") && player.lane < 2) {
        player.lane++;
        player.targetX = laneX[player.lane];
    } else if ((e.key === "ArrowUp" || e.key === "w" || e.key === " ") && !player.isJumping) {
        player.isJumping = true;
        player.jumpVy = -10;
    }
});

function startGame() {
    gameState = "RUNNING";
    distance = 0;
    speed = baseSpeed;
    shield = 100;
    frameCount = 0;
    gateTimer = 400; // First question displays ~3 seconds before gate spawns
    pendingGateData = null;
    player.lane = 1;
    player.x = laneX[1];
    player.targetX = laneX[1];
    player.yOffset = 0;
    player.isJumping = false;
    obstacles = [];
    gateSystem = null;

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    
    // Prepare the first definition early
    prepareGateData();

    updateUI();
    requestAnimationFrame(gameLoop);
}

function updateUI() {
    document.getElementById('score-val').innerText = `${Math.floor(distance)}m`;
    const shieldBar = document.getElementById('shield-bar');
    shieldBar.style.width = `${Math.max(0, shield)}%`;
    shieldBar.style.backgroundColor = shield < 35 ? "#ff4d4d" : "#66fcf1";
    document.getElementById('speed-val').innerText = `${(speed / baseSpeed).toFixed(1)}x`;
}

function prepareGateData() {
    const correctObj = vocabList[Math.floor(Math.random() * vocabList.length)];
    let wrongObj = vocabList[Math.floor(Math.random() * vocabList.length)];
    while (wrongObj.word === correctObj.word) {
        wrongObj = vocabList[Math.floor(Math.random() * vocabList.length)];
    }

    const isLeftCorrect = Math.random() < 0.5;
    pendingGateData = {
        def: correctObj.def,
        gateA: { word: isLeftCorrect ? correctObj.word : wrongObj.word, correct: isLeftCorrect },
        gateB: { word: isLeftCorrect ? wrongObj.word : correctObj.word, correct: !isLeftCorrect }
    };

    // Show definition overlay immediately for early reading
    document.getElementById('def-text').innerText = `NEXT GATE: "${pendingGateData.def}"`;
}

function spawnGate() {
    gateSystem = {
        y: -120, // Spawns further up off-screen for plenty of viewing time
        def: pendingGateData.def,
        gateA: pendingGateData.gateA,
        gateB: pendingGateData.gateB
    };
    pendingGateData = null;
}

function update() {
    frameCount++;
    distance += speed * 0.05;
    speed += 0.00008; // Minimal speed increase over time

    // Smooth lane shift
    player.x += (player.targetX - player.x) * 0.25;

    // Jump physics
    if (player.isJumping) {
        player.yOffset += player.jumpVy;
        player.jumpVy += 0.5;
        if (player.yOffset >= 0) {
            player.yOffset = 0;
            player.isJumping = false;
        }
    }

    // Spawn obstacles at a relaxed frequency
    if (!gateSystem && frameCount % Math.max(80, Math.floor(160 - speed * 4)) === 0) {
        const obsLane = Math.floor(Math.random() * 3);
        obstacles.push({ lane: obsLane, x: laneX[obsLane], y: -30 });
    }

    // Move obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += speed;

        // Check collision with player
        if (obs.lane === player.lane && obs.y > 330 && obs.y < 380 && player.yOffset > -15) {
            shield -= 25;
            speed = Math.max(baseSpeed, speed - 0.3);
            obstacles.splice(i, 1);
            if (shield <= 0) gameOver();
            continue;
        }

        if (obs.y > canvas.height) obstacles.splice(i, 1);
    }

    // Gate System Timing
    if (!gateSystem) {
        gateTimer--;
        if (gateTimer === 180 && !pendingGateData) { // Prepare question 3 seconds early
            prepareGateData();
        }
        if (gateTimer <= 0) {
            spawnGate();
        }
    } else {
        gateSystem.y += speed;

        // Gate collision check
        if (gateSystem.y >= 330 && gateSystem.y <= 370) {
            let correctChosen = false;
            if (player.lane === 0 && gateSystem.gateA.correct) correctChosen = true;
            if (player.lane === 2 && gateSystem.gateB.correct) correctChosen = true;

            if (correctChosen) {
                speed += 0.2;
                distance += 50;
                shield = Math.min(100, shield + 10);
                document.getElementById('def-text').innerText = "CORRECT GATE! +SPEED BOOST";
            } else {
                shield -= 35;
                speed = Math.max(baseSpeed, speed - 0.3);
                document.getElementById('def-text').innerText = "WRONG GATE! SHIELD CRACKED";
            }

            gateSystem = null;
            gateTimer = 500; // Reset timer for next cycle
            if (shield <= 0) gameOver();
        } else if (gateSystem.y > canvas.height) {
            gateSystem = null;
            gateTimer = 500;
            document.getElementById('def-text').innerText = "GATE MISSED!";
        }
    }

    updateUI();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Track grid lines
    ctx.strokeStyle = "#1f2833";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(310, 0); ctx.lineTo(310, canvas.height);
    ctx.moveTo(490, 0); ctx.lineTo(490, canvas.height);
    ctx.stroke();

    // Moving horizontal grid lines
    let offset = (frameCount * speed) % 30;
    ctx.strokeStyle = "rgba(102, 252, 241, 0.08)";
    for (let y = offset; y < canvas.height; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    // Draw Obstacles
    ctx.fillStyle = "#ff4d4d";
    obstacles.forEach(obs => {
        ctx.fillRect(obs.x - 20, obs.y - 15, 40, 30);
    });

    // Draw Definition Gates
    if (gateSystem) {
        const gy = gateSystem.y;

        // Archway A (Lane 0)
        ctx.fillStyle = "rgba(69, 162, 158, 0.85)";
        ctx.fillRect(140, gy - 35, 160, 45);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 15px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText(gateSystem.gateA.word, 220, gy - 10);

        // Archway B (Lane 2)
        ctx.fillStyle = "rgba(69, 162, 158, 0.85)";
        ctx.fillStyle = "rgba(69, 162, 158, 0.85)";
        ctx.fillRect(500, gy - 35, 160, 45);
        ctx.fillStyle = "#fff";
        ctx.fillText(gateSystem.gateB.word, 580, gy - 10);

        // Connecting Beam Across Track
        ctx.fillStyle = "#45a29e";
        ctx.fillRect(140, gy - 45, 520, 10);
    }

    // Draw Player
    const px = player.x;
    const py = player.y + player.yOffset;

    // Player Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
    ctx.beginPath();
    ctx.ellipse(px, player.y + 20, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Player Body
    ctx.fillStyle = "#66fcf1";
    ctx.fillRect(px - player.width / 2, py - player.height / 2, player.width, player.height);
    ctx.fillStyle = "#0b0c10";
    ctx.fillRect(px - 10, py - 18, 20, 10);
}

function gameLoop() {
    if (gameState === "RUNNING") {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
}

function gameOver() {
    gameState = "GAMEOVER";
    document.getElementById('final-score').innerText = `You completed a distance of ${Math.floor(distance)} meters!`;
    document.getElementById('game-over-screen').style.display = 'flex';
}
</script>
</body>
</html>
