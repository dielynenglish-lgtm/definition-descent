<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-A-Word Vocabulary Game</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      margin-bottom: 10px;
      color: #f1c40f;
    }

    .stats-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .definition-box {
      background-color: #34495e;
      border: 3px solid #f39c12;
      border-radius: 10px;
      padding: 15px 20px;
      max-width: 600px;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .definition-box h2 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
      color: #3498db;
    }

    .definition-box p {
      margin: 0;
      font-size: 1.3rem;
      color: #ffffff;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      grid-gap: 20px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .hole {
      width: 160px;
      height: 140px;
      background: #795548;
      border-radius: 50%;
      border: 6px solid #4e342e;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 10px 0 rgba(0,0,0,0.5);
    }

    .mole {
      width: 130px;
      height: 100px;
      background: #e67e22;
      border-radius: 20px 20px 0 0;
      position: absolute;
      bottom: -110px;
      left: 15px;
      transition: bottom 0.2s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .mole span {
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      user-select: none;
      text-align: center;
      padding: 5px;
    }

    .hole.up .mole {
      bottom: 10px;
    }

    .btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 0 #27ae60;
      transition: all 0.1s;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <h1>Whack-A-Word Arcade</h1>

  <div class="stats-container">
    <div>Time Left: <span id="time-left">60</span>s</div>
    <div>Score: <span id="score">0</span></div>
  </div>

  <div class="definition-box">
    <h2>TARGET DEFINITION:</h2>
    <p id="target-definition">Press "Start Game" to Play!</p>
  </div>

  <div class="grid">
    <div class="hole"><div class="mole" onclick="whack(this)"><span></span></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"><span></span></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"><span></span></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"><span></span></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"><span></span></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"><span></span></div></div>
  </div>

  <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>

  <script>
    const vocabData = [
      { word: "grip", def: "To hold tightly or firmly." },
      { word: "adjustment", def: "A small change made to achieve a desired result." },
      { word: "strain", def: "To make a severe or strenuous effort; bodily tension." },
      { word: "flexible", def: "Capable of bending easily without breaking; adaptable." },
      { word: "loosen", def: "To make or become less tight or firm." },
      { word: "slightly", def: "To a small degree; a little bit." },
      { word: "demonstrate", def: "To show clearly; to prove or explain with evidence." }
    ];

    const holes = document.querySelectorAll('.hole');
    const moles = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const timeDisplay = document.getElementById('time-left');
    const definitionDisplay = document.getElementById('target-definition');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let timeLeft = 60;
    let gameInterval;
    let timerInterval;
    let currentTargetIndex = 0;
    let lastHole = null;

    function randomHole() {
      const index = Math.floor(Math.random() * holes.length);
      const hole = holes[index];
      if (hole === lastHole) {
        return randomHole();
      }
      lastHole = hole;
      return hole;
    }

    function pickRandomWord() {
      // 50% chance to pick the target word so it appears more frequently!
      if (Math.random() < 0.5) {
        return vocabData[currentTargetIndex].word;
      } else {
        const randomIndex = Math.floor(Math.random() * vocabData.length);
        return vocabData[randomIndex].word;
      }
    }

    function setNextTarget() {
      currentTargetIndex = Math.floor(Math.random() * vocabData.length);
      definitionDisplay.textContent = `"${vocabData[currentTargetIndex].def}"`;
    }

    function popUpMole() {
      const hole = randomHole();
      const mole = hole.querySelector('.mole');
      const wordSpan = mole.querySelector('span');

      const word = pickRandomWord();
      wordSpan.textContent = word;
      mole.dataset.word = word;

      hole.classList.add('up');
      
      const popTime = Math.floor(Math.random() * 800) + 1000;
      setTimeout(() => {
        hole.classList.remove('up');
      }, popTime);
    }

    function whack(moleElement) {
      const parentHole = moleElement.parentElement;
      if (!parentHole.classList.contains('up')) return;

      const clickedWord = moleElement.dataset.word;
      const targetWord = vocabData[currentTargetIndex].word;

      if (clickedWord === targetWord) {
        score += 10;
        scoreDisplay.textContent = score;
        setNextTarget(); // Change target after a successful whack!
      } else {
        score = Math.max(0, score - 5);
        scoreDisplay.textContent = score;
      }
      
      parentHole.classList.remove('up');
    }

    function startGame() {
      score = 0;
      timeLeft = 60;
      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeLeft;
      startBtn.disabled = true;

      setNextTarget();

      gameInterval = setInterval(popUpMole, 1100);

      timerInterval = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(gameInterval);
          clearInterval(timerInterval);
          startBtn.disabled = false;
          definitionDisplay.textContent = "Game Over! Great job!";
          alert(`Game Over! Your final score is: ${score}`);
        }
      }, 1000);
    }
  </script>
</body>
</html>
