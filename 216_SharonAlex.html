<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Word-Wall Builder</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        #game-container {
            position: relative;
            width: 600px;
            margin: 0 auto;
        }
        canvas {
            background: #0f3460;
            border: 3px solid #e94560;
            border-radius: 8px;
            display: block;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin: 10px auto;
            font-size: 18px;
            font-weight: bold;
        }
        #popup {
            display: none;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, 0);
            background: #16213e;
            border: 2px solid #e94560;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #0f3460;
        }
    </style>
</head>
<body>

    <h1>Breakout Word-Wall Builder</h1>
    <div class="stats">
        <div>Blocks Smashed: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>

    <div id="game-container">
        <canvas id="breakout" width="600" height="400"></canvas>
        
        <div id="popup">
            <h3 id="def-title">Layer Shattered!</h3>
            <p id="def-text">Definition goes here...</p>
            <div id="choices"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("breakout");
        const ctx = canvas.getContext("2d");

        // Vocabulary Database
        const vocabList = [
            { word: "formula", def: "A mathematical relationship or rule expressed in symbols." },
            { word: "equation", def: "A statement that the values of two mathematical expressions are equal." },
            { word: "abstract", def: "Existing in thought or as an idea rather than a physical object." },
            { word: "contribution", def: "A gift or payment to a common fund or cause." },
            { word: "forge", def: "To make or shape a metal object using heat and hammer, or to create something strong." },
            { word: "orbit", def: "The curved path of a celestial object or spacecraft around a star, planet, or moon." }
        ];

        // Game Variables
        let score = 0;
        let lives = 3;
        let isPaused = false;
        let activeRowForQuiz = -1;

        // Paddle Configuration
        let paddle = {
            width: 100,
            height: 12,
            x: (canvas.width - 100) / 2,
            speed: 8
        };

        // Ball Configuration
        let balls = [{
            x: canvas.width / 2,
            y: canvas.height - 30,
            dx: 3,
            dy: -3,
            radius: 6
        }];

        // Brick Grid Configuration
        const rowCount = 6;
        const colCount = 8;
        const brickPadding = 5;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 15;
        const brickWidth = (canvas.width - (brickOffsetLeft * 2) - (brickPadding * (colCount - 1))) / colCount;
        const brickHeight = 20;

        // Colors for each vocabulary row layer
        const colors = ["#ff4d4d", "#ffaf40", "#fffa65", "#32ff7e", "#18dcff", "#7d5fff"];

        // State Array for Bricks
        let bricks = [];
        for (let r = 0; r < rowCount; r++) {
            bricks[r] = [];
            let word = vocabList[r].word;
            for (let c = 0; c < colCount; c++) {
                // Reveal a letter hidden in each brick
                let letter = word[c % word.length].toUpperCase();
                bricks[r][c] = { x: 0, y: 0, status: 1, letter: letter };
            }
        }

        // Mouse Paddle Movement
        document.addEventListener("mousemove", (e) => {
            let relativeX = e.clientX - canvas.offsetLeft;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
            }
        });

        // Draw Paddle
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, canvas.height - paddle.height, paddle.width, paddle.height);
            ctx.fillStyle = "#e94560";
            ctx.fill();
            ctx.closePath();
        }

        // Draw Balls
        function drawBalls() {
            balls.forEach(ball => {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.closePath();
            });
        }

        // Draw Brick Grid
        function drawBricks() {
            for (let r = 0; r < rowCount; r++) {
                for (let c = 0; c < colCount; c++) {
                    let b = bricks[r][c];
                    if (b.status === 1) {
                        let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        b.x = brickX;
                        b.y = brickY;

                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = colors[r];
                        ctx.fill();
                        ctx.closePath();

                        // Letter hidden inside brick
                        ctx.font = "12px Arial";
                        ctx.fillStyle = "#1a1a2e";
                        ctx.fillText(b.letter, brickX + (brickWidth / 2) - 4, brickY + 14);
                    }
                }
            }
        }

        // Reflection Vectors & Collision System
        function collisionDetection() {
            for (let r = 0; r < rowCount; r++) {
                for (let c = 0; c < colCount; c++) {
                    let b = bricks[r][c];
                    if (b.status === 1) {
                        balls.forEach(ball => {
                            if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
                                ball.dy = -ball.dy; // Vector bounce reversal
                                b.status = 0;
                                score++;
                                document.getElementById("score").innerText = score;

                                checkRowCleared(r);
                            }
                        });
                    }
                }
            }
        }

        // Check if an entire vocabulary layer (row) was shattered
        function checkRowCleared(row) {
            let rowShattered = bricks[row].every(b => b.status === 0);
            if (rowShattered && activeRowForQuiz !== row) {
                activeRowForQuiz = row;
                triggerVocabularyQuiz(row);
            }
        }

        // Trigger Pop-up Match Menu
        function triggerVocabularyQuiz(rowIndex) {
            isPaused = true;
            let currentVocab = vocabList[rowIndex];
            
            document.getElementById("def-text").innerText = `Definition: "${currentVocab.def}"`;
            let choicesContainer = document.getElementById("choices");
            choicesContainer.innerHTML = "";

            // Pick 3 options (1 correct, 2 distractors)
            let choices = [currentVocab.word];
            while (choices.length < 3) {
                let randomWord = vocabList[Math.floor(Math.random() * vocabList.length)].word;
                if (!choices.includes(randomWord)) choices.push(randomWord);
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(word => {
                let btn = document.createElement("button");
                btn.className = "btn";
                btn.innerText = word;
                btn.onclick = () => handleQuizAnswer(word, currentVocab.word);
                choicesContainer.appendChild(btn);
            });

            document.getElementById("popup").style.display = "block";
        }

        // Handle Quiz Answer Outcome
        function handleQuizAnswer(selectedWord, correctWord) {
            document.getElementById("popup").style.display = "none";
            isPaused = false;

            if (selectedWord === correctWord) {
                // Power-up: Multiball
                balls.push({
                    x: canvas.width / 2,
                    y: canvas.height - 30,
                    dx: -3,
                    dy: -3,
                    radius: 6
                });
            } else {
                // Penalty: Shrink Paddle
                paddle.width = Math.max(40, paddle.width - 20);
            }
            requestAnimationFrame(draw);
        }

        // Main Game Loop
        function draw() {
            if (isPaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawPaddle();
            drawBalls();
            collisionDetection();

            // Ball Dynamics & Wall Collision Vector Handling
            balls.forEach((ball, index) => {
                if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                    ball.dx = -ball.dx;
                }
                if (ball.y + ball.dy < ball.radius) {
                    ball.dy = -ball.dy;
                } else if (ball.y + ball.dy > canvas.height - ball.radius) {
                    // Paddle bounce logic
                    if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                        ball.dy = -ball.dy;
                    } else {
                        // Ball fell below screen
                        balls.splice(index, 1);
                    }
                }

                ball.x += ball.dx;
                ball.y += ball.dy;
            });

            // Life management
            if (balls.length === 0) {
                lives--;
                document.getElementById("lives").innerText = lives;
                if (lives <= 0) {
                    alert("GAME OVER! Try again to master your vocabulary!");
                    document.location.reload();
                    return;
                } else {
                    // Reset single ball
                    balls = [{ x: canvas.width / 2, y: canvas.height - 30, dx: 3, dy: -3, radius: 6 }];
                }
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
