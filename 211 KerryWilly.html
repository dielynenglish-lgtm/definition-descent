<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Snake - Definition Hunt</title>
    <style>
        body {
            background-color: #0d0f18;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #ui-container {
            width: 800px;
            margin-bottom: 10px;
            text-align: center;
        }

        #definition-display {
            font-size: 20px;
            font-weight: bold;
            color: #ffe600;
            background: rgba(255, 230, 0, 0.1);
            border: 1px solid #ffe600;
            padding: 12px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 230, 0, 0.2);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stats {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin-top: 8px;
            font-weight: bold;
        }

        #game-container {
            position: relative;
        }

        canvas {
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            background-color: #05070a;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 15, 24, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff0055;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0055;
        }

        #game-over button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00f3ff;
            color: #0d0f18;
            border: none;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }

        #game-over button:hover {
            background: #ffe600;
            box-shadow: 0 0 10px #ffe600;
        }

        .status-locked {
            color: #ff0055 !important;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }
    </style>
</head>
<body>

<div id="ui-container">
    <div id="definition-display">Loading target definition...</div>
    <div id="stats">
        <span>SCORE: <span id="score">0</span></span>
        <span id="status-text" style="color: #00f3ff;">SYSTEM: ONLINE</span>
        <span>LENGTH: <span id="length">3</span></span>
    </div>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="game-over">
        <div>SYSTEM FAILURE</div>
        <div style="font-size: 18px; color: #fff; margin-top: 10px;">GAME OVER</div>
        <button onclick="resetGame()">REBOOT</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 40; // Size of each cell
    const COLS = canvas.width / GRID_SIZE;
    const ROWS = canvas.height / GRID_SIZE;

    // Vocabulary Data
    const vocabulary = [
        { word: "FORMULA", def: "A mathematical relationship or rule expressed in symbols." },
        { word: "EQUATION", def: "A statement that the values of two mathematical expressions are equal." },
        { word: "ORBIT", def: "The curved path of a celestial object or spacecraft around a star, planet, or moon." },
        { word: "ABSTRACT", def: "Existing in thought or as an idea but not having a physical or concrete existence." },
        { word: "CONTRIBUTION", def: "A gift or payment to a common fund or collection; or a role played in achieving something." },
        { word: "FORGE", def: "To make or shape a metal object using a furnace; or to create or produce something collaboratively." }
    ];

    // Game Variables
    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let pellets = [];
    let currentTarget = null;
    let score = 0;
    let isGameOver = false;
    let isLocked = false;
    let lockTimeout = null;
    let gameInterval = null;

    // Control Key Mapping
    window.addEventListener('keydown', e => {
        if (isLocked || isGameOver) return;

        switch (e.key) {
            case 'ArrowUp':
                if (dir.y === 0) nextDir = { x: 0, y: -1 };
                break;
            case 'ArrowDown':
                if (dir.y === 0) nextDir = { x: 0, y: 1 };
                break;
            case 'ArrowLeft':
                if (dir.x === 0) nextDir = { x: -1, y: 0 };
                break;
            case 'ArrowRight':
                if (dir.x === 0) nextDir = { x: 1, y: 0 };
                break;
        }
    });

    function initGame() {
        snake = [
            { x: 5, y: 10 },
            { x: 4, y: 10 },
            { x: 3, y: 10 }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        isGameOver = false;
        isLocked = false;
        
        document.getElementById('score').innerText = score;
        document.getElementById('length').innerText = snake.length;
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('status-text').innerText = "SYSTEM: ONLINE";
        document.getElementById('status-text').classList.remove('status-locked');

        spawnPellets();
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 120);
    }

    function getRandomWords() {
        let shuffled = [...vocabulary].sort(() => 0.5 - Math.random());
        let correct = shuffled[0];
        let distractors = shuffled.slice(1, 3);
        return { correct, distractors };
    }

    function spawnPellets() {
        const { correct, distractors } = getRandomWords();
        currentTarget = correct;
        document.getElementById('definition-display').innerText = `TARGET: "${correct.def}"`;

        let wordList = [
            { word: correct.word, isCorrect: true },
            { word: distractors[0].word, isCorrect: false },
            { word: distractors[1].word, isCorrect: false }
        ];

        // Shuffle pellet items positions
        wordList.sort(() => 0.5 - Math.random());

        pellets = [];
        wordList.forEach(item => {
            let pos;
            while (true) {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
                // Avoid spawning on top of snake body or other pellets
                let onSnake = snake.some(segment => segment.x === pos.x && segment.y === pos.y);
                let onPellet = pellets.some(p => p.x === pos.x && p.y === pos.y);
                if (!onSnake && !onPellet) break;
            }
            pellets.push({ ...pos, ...item });
        });
    }

    function gameLoop() {
        if (isGameOver) return;

        dir = nextDir;
        let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // Wall Collision Detection
        if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
            triggerGameOver();
            return;
        }

        // Self Collision Detection
        for (let segment of snake) {
            if (head.x === segment.x && head.y === segment.y) {
                triggerGameOver();
                return;
            }
        }

        snake.unshift(head);

        // Check Pellet Collision
        let hitPelletIndex = pellets.findIndex(p => p.x === head.x && p.y === head.y);

        if (hitPelletIndex !== -1) {
            let hitPellet = pellets[hitPelletIndex];

            if (hitPellet.isCorrect) {
                // Correct Pellet: Extend snake, increase score, refresh target
                score += 100;
                document.getElementById('score').innerText = score;
                spawnPellets();
            } else {
                // Poison Pellet: Chop off 2 segments & lock controls for 1.5s
                snake.pop(); // Revert normal step growth
                if (snake.length > 2) snake.pop();
                if (snake.length > 2) snake.pop();

                applyPoisonLock();
                spawnPellets();
            }
        } else {
            // Normal movement: trim tail
            snake.pop();
        }

        document.getElementById('length').innerText = snake.length;
        render();
    }

    function applyPoisonLock() {
        isLocked = true;
        const statusText = document.getElementById('status-text');
        statusText.innerText = "POISONED! KEYS LOCKED (1.5s)";
        statusText.classList.add('status-locked');

        if (lockTimeout) clearTimeout(lockTimeout);
        lockTimeout = setTimeout(() => {
            isLocked = false;
            statusText.innerText = "SYSTEM: ONLINE";
            statusText.classList.remove('status-locked');
        }, 1500);
    }

    function triggerGameOver() {
        isGameOver = true;
        clearInterval(gameInterval);
        document.getElementById('game-over').style.display = 'flex';
    }

    function render() {
        // Draw Background & Grid
        ctx.fillStyle = '#05070a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#121929';
        ctx.lineWidth = 1;
        for (let i = 0; i <= COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * GRID_SIZE, 0);
            ctx.lineTo(i * GRID_SIZE, canvas.height);
            ctx.stroke();
        }
        for (let j = 0; j <= ROWS; j++) {
            ctx.beginPath();
            ctx.moveTo(0, j * GRID_SIZE);
            ctx.lineTo(canvas.width, j * GRID_SIZE);
            ctx.stroke();
        }

        // Draw Food Pellets with Enlarged Text
        pellets.forEach(pellet => {
            ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 2;
            ctx.fillRect(pellet.x * GRID_SIZE, pellet.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            ctx.strokeRect(pellet.x * GRID_SIZE, pellet.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);

            // Large, readable label rendering
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Draw text directly inside/above grid square
            ctx.fillText(
                pellet.word, 
                pellet.x * GRID_SIZE + GRID_SIZE / 2, 
                pellet.y * GRID_SIZE + GRID_SIZE / 2
            );
        });

        // Draw Snake
        snake.forEach((segment, index) => {
            ctx.fillStyle = index === 0 ? '#ffe600' : (isLocked ? '#ff0055' : '#00f3ff');
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 8;
            ctx.fillRect(
                segment.x * GRID_SIZE + 2, 
                segment.y * GRID_SIZE + 2, 
                GRID_SIZE - 4, 
                GRID_SIZE - 4
            );
            ctx.shadowBlur = 0; // reset blur
        });
    }

    function resetGame() {
        initGame();
    }

    // Initialize Game on Load
    initGame();
</script>

</body>
</html>
