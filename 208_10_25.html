<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whack-A-Word: Vocabulary Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    .game-container {
      width: 90%;
      max-width: 700px;
      background: #16213e;
      border: 4px solid #00fff5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0, 255, 245, 0.4);
      text-align: center;
    }

    h1 {
      color: #00fff5;
      font-size: 2.2rem;
      margin-bottom: 12px;
      text-shadow: 0 0 10px #00fff5;
    }

    .header-stats {
      display: flex;
      justify-content: space-around;
      background: #0f3460;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .definition-box {
      background: #e94560;
      color: #ffffff;
      padding: 16px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .hole {
      position: relative;
      height: 120px;
      background: #0f3460;
      border: 3px solid #00fff5;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .mole {
      position: absolute;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ff2e63;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      padding: 8px;
      border-radius: 8px;
      transition: bottom 0.25s ease-in-out;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      word-break: break-word;
    }

    .hole.up .mole {
      bottom: 0;
    }

    .btn {
      background: #00fff5;
      color: #1a1a2e;
      border: none;
      padding: 12px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #00b8b3;
      transform: scale(1.05);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(22, 33, 62, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .overlay h2 {
      font-size: 3rem;
      color: #00fff5;
      margin-bottom: 16px;
    }

    .overlay p {
      font-size: 1.4rem;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>Whack-A-Word</h1>
    
    <div class="header-stats">
      <div>Score: <span id="score">0</span></div>
      <div>Time: <span id="timer">60</span>s</div>
    </div>

    <div class="definition-box" id="definition-box">
      Click "Start Game" to begin!
    </div>

    <div class="grid">
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
      <div class="hole"><div class="mole"></div></div>
    </div>
  </div>

  <div id="start-overlay" class="overlay">
    <h2>Whack-A-Word</h2>
    <p>Match the targeted definition to the correct popping word!</p>
    <button class="btn" onclick="startGame()">Start Game</button>
  </div>

  <div id="end-overlay" class="overlay" style="display: none;">
    <h2>Time's Up!</h2>
    <p>Your Final Score: <span id="final-score">0</span></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>

  <script>
    const vocab = [
      { word: "Reservation", def: "An arrangement to hold something (like a room or table) for future use." },
      { word: "Preference", def: "A greater liking for one alternative over another." },
      { word: "Secure", def: "To fix or fasten firmly; to make safe." },
      { word: "Session", def: "A period devoted to a particular activity." },
      { word: "Massage", def: "The rubbing and kneading of muscles and joints." },
      { word: "Promptly", def: "With little or no delay; immediately." },
      { word: "Opening", def: "An available space, position, or time slot." }
    ];

    const holes = document.querySelectorAll('.hole');
    const moles = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const timerDisplay = document.getElementById('timer');
    const defDisplay = document.getElementById('definition-box');
    const startOverlay = document.getElementById('start-overlay');
    const endOverlay = document.getElementById('end-overlay');
    const finalScoreDisplay = document.getElementById('final-score');

    let score = 0;
    let time = 60;
    let timerInterval = null;
    let popInterval = null;
    let lastHole = null;
    let currentTarget = null;
    let isPlaying = false;

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function getRandomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) return getRandomHole();
      lastHole = hole;
      return hole;
    }

    function setNewTarget() {
      currentTarget = getRandomItem(vocab);
      defDisplay.textContent = currentTarget.def;
    }

    function popMole() {
      if (!isPlaying) return;

      const hole = getRandomHole();
      const mole = hole.querySelector('.mole');

      // 70% chance to pop the correct target word as requested
      const isTarget = Math.random() < 0.7;
      let wordToDisplay = currentTarget.word;

      if (!isTarget) {
        const distractors = vocab.filter(v => v.word !== currentTarget.word);
        wordToDisplay = getRandomItem(distractors).word;
      }

      mole.textContent = wordToDisplay;
      mole.dataset.word = wordToDisplay;
      hole.classList.add('up');

      const popDuration = Math.floor(Math.random() * 500) + 800;

      setTimeout(() => {
        hole.classList.remove('up');
      }, popDuration);
    }

    function handleWhack(e) {
      if (!isPlaying) return;
      const clickedMole = e.target;
      const hole = clickedMole.parentElement;

      if (!hole.classList.contains('up')) return;

      const selectedWord = clickedMole.dataset.word;
      if (selectedWord === currentTarget.word) {
        score += 10;
        scoreDisplay.textContent = score;
        hole.classList.remove('up');
        setNewTarget();
      } else {
        score = Math.max(0, score - 5);
        scoreDisplay.textContent = score;
        hole.classList.remove('up');
      }
    }

    moles.forEach(mole => mole.addEventListener('click', handleWhack));

    function startGame() {
      score = 0;
      time = 60;
      isPlaying = true;
      scoreDisplay.textContent = score;
      timerDisplay.textContent = time;
      
      startOverlay.style.display = 'none';
      endOverlay.style.display = 'none';

      setNewTarget();

      clearInterval(timerInterval);
      clearInterval(popInterval);

      popInterval = setInterval(popMole, 900);

      timerInterval = setInterval(() => {
        time--;
        timerDisplay.textContent = time;
        if (time <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      clearInterval(popInterval);
      holes.forEach(hole => hole.classList.remove('up'));
      finalScoreDisplay.textContent = score;
      endOverlay.style.display = 'flex';
    }
  </script>
</body>
</html>
