<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Archers - Vocabulary Accuracy Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 600px;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            border: 4px solid #f39c12;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: transparent;
        }

        /* UI overlay */
        #ui-header {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #wind-indicator {
            color: #00d2d3;
        }

        /* Launcher & Question Bar */
        #launcher-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: rgba(16, 24, 32, 0.9);
            border-top: 2px solid #f39c12;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 10;
        }

        #question-box {
            flex: 1;
            margin-right: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid #f39c12;
        }

        #question-box h3 {
            font-size: 14px;
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        #definition-text {
            font-size: 15px;
            line-height: 1.3;
            color: #e0e0e0;
        }

        #controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .control-group label {
            font-size: 12px;
            color: #aaa;
        }

        .control-group input[type=range] {
            width: 110px;
            cursor: pointer;
        }

        #shoot-btn {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.4);
        }

        #shoot-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(230, 126, 34, 0.6);
        }

        #shoot-btn:active {
            transform: translateY(0);
        }

        /* Game Over Screen */
        #game-over-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #game-over-modal h1 {
            font-size: 48px;
            color: #f39c12;
            margin-bottom: 10px;
        }

        #game-over-modal p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        #restart-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD Header -->
        <div id="ui-header">
            <div class="hud-card">Score: <span id="score-val" style="color: #2ecc71;">0</span></div>
            <div class="hud-card" id="wind-indicator">Wind: <span id="wind-val">0.0</span> m/s</div>
            <div class="hud-card">Arrows: <span id="arrows-val" style="color: #e74c3c;">10</span></div>
        </div>

        <!-- Canvas Area -->
        <canvas id="gameCanvas" width="1000" height="480"></canvas>

        <!-- Launcher & Definition Panel -->
        <div id="launcher-panel">
            <div id="question-box">
                <h3>Target Definition</h3>
                <div id="definition-text">Loading question...</div>
            </div>

            <div id="controls">
                <div class="control-group">
                    <label for="angle">Angle: <span id="angle-val">45</span>°</label>
                    <input type="range" id="angle" min="5" max="85" value="45">
                </div>
                <div class="control-group">
                    <label for="power">Power: <span id="power-val">60</span></label>
                    <input type="range" id="power" min="20" max="100" value="60">
                </div>
                <button id="shoot-btn">RELEASE</button>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal">
            <h1>Game Over</h1>
            <p>Your Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Vocabulary definitions list (7 words)
        const vocabulary = [
            { word: 'unidentified', def: 'Not recognized or recognized for what it is; unknown.' },
            { word: 'phenomenon', def: 'A remarkable development, event, or fact that can be observed.' },
            { word: 'radar', def: 'A system for detecting the presence, direction, distance, and speed of aircraft, ships, or other objects.' },
            { word: 'sensor', def: 'A device which detects or measures a physical property and records or responds to it.' },
            { word: 'personnel', def: 'People employed in an organization or engaged in an organized undertaking such as military service.' },
            { word: 'strengthen', def: 'Make or become stronger in power, force, or intensity.' },
            { word: 'mysterious', def: 'Difficult or impossible to understand, explain, or identify.' }
        ];

        // Game State Variables
        let score = 0;
        let arrowsLeft = 10;
        let wind = 0; // Negative = Left, Positive = Right
        let currentTargetWord = '';
        let targets = [];
        let arrow = null;
        let isArrowFlying = false;

        // Archer Position
        const archerPos = { x: 80, y: 420 };

        // UI Elements
        const angleInput = document.getElementById('angle');
        const powerInput = document.getElementById('power');
        const angleVal = document.getElementById('angle-val');
        const powerVal = document.getElementById('power-val');
        const scoreVal = document.getElementById('score-val');
        const arrowsVal = document.getElementById('arrows-val');
        const windVal = document.getElementById('wind-val');
        const definitionText = document.getElementById('definition-text');
        const shootBtn = document.getElementById('shoot-btn');
        const gameOverModal = document.getElementById('game-over-modal');

        // Input listeners
        angleInput.addEventListener('input', (e) => angleVal.textContent = e.target.value);
        powerInput.addEventListener('input', (e) => powerVal.textContent = e.target.value);
        shootBtn.addEventListener('click', shootArrow);

        class Target {
            constructor(word, x, y, speed) {
                this.word = word;
                this.x = x;
                this.y = y;
                this.width = 110;
                this.height = 40;
                this.speed = speed;
                this.direction = 1; // 1 for right, -1 for left
                this.minX = x - 60;
                this.maxX = x + 60;
            }

            update() {
                this.x += this.speed * this.direction;
                if (this.x > this.maxX || this.x < this.minX) {
                    this.direction *= -1;
                }
            }

            draw() {
                // Target Board Background
                ctx.save();
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 8);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Inner Ring Effect
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(this.x + 4, this.y + 4, 6, this.height - 8);

                // Word Text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Segoe UI';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.word, this.x + this.width / 2 + 3, this.y + this.height / 2);
                ctx.restore();
            }
        }

        class Arrow {
            constructor(x, y, angleDeg, power) {
                this.x = x;
                this.y = y;
                this.angleRad = -angleDeg * (Math.PI / 180);
                const speedMult = 0.35;
                this.vx = Math.cos(this.angleRad) * power * speedMult;
                this.vy = Math.sin(this.angleRad) * power * speedMult;
                this.length = 30;
                this.gravity = 0.15;
            }

            update() {
                // Apply physics (gravity & wind resistance)
                this.vy += this.gravity;
                this.vx += wind * 0.005; 
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx));

                // Arrow Shaft
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-this.length, 0);
                ctx.lineTo(0, 0);
                ctx.stroke();

                // Arrow Tip
                ctx.fillStyle = '#ecf0f1';
                ctx.beginPath();
                ctx.moveTo(0, -4);
                ctx.lineTo(8, 0);
                ctx.lineTo(0, 4);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        function generateWind() {
            // Wind scale between -3.0 and 3.0
            wind = (Math.random() * 6 - 3).toFixed(1);
            let dirText = wind > 0 ? '➔ East' : wind < 0 ? '⬅ West' : 'Calm';
            windVal.textContent = `${Math.abs(wind)} m/s (${dirText})`;
        }

        function setupRound() {
            targets = [];
            // Randomly pick a correct word
            const randIndex = Math.floor(Math.random() * vocabulary.length);
            const correctObj = vocabulary[randIndex];
            currentTargetWord = correctObj.word;
            definitionText.textContent = correctObj.def;

            // Pick 2 other wrong words for distractor targets
            let options = vocabulary.filter(v => v.word !== currentTargetWord);
            options = options.sort(() => 0.5 - Math.random()).slice(0, 2);
            options.push(correctObj);
            // Shuffle chosen 3 target words
            options.sort(() => 0.5 - Math.random());

            // Assign targets to 3 distance columns
            const xPositions = [350, 580, 800];
            const yPositions = [120, 220, 320];

            for (let i = 0; i < 3; i++) {
                let speed = Math.random() * 1.5 + 0.5;
                targets.push(new Target(options[i].word, xPositions[i], yPositions[i], speed));
            }

            generateWind();
        }

        function shootArrow() {
            if (isArrowFlying || arrowsLeft <= 0) return;
            const angle = parseFloat(angleInput.value);
            const power = parseFloat(powerInput.value);

            arrow = new Arrow(archerPos.x, archerPos.y, angle, power);
            isArrowFlying = true;
            shootBtn.disabled = true;
        }

        function checkCollision() {
            if (!arrow) return;

            // Hit target check
            for (let t of targets) {
                if (arrow.x >= t.x && arrow.x <= t.x + t.width &&
                    arrow.y >= t.y && arrow.y <= t.y + t.height) {

                    isArrowFlying = false;
                    shootBtn.disabled = false;
                    arrowsLeft--;
                    arrowsVal.textContent = arrowsLeft;

                    if (t.word === currentTargetWord) {
                        score += 100;
                        scoreVal.textContent = score;
                    } else {
                        score = Math.max(0, score - 30);
                        scoreVal.textContent = score;
                    }

                    if (arrowsLeft <= 0) {
                        endGame();
                    } else {
                        setupRound();
                    }
                    return;
                }
            }

            // Canvas boundary miss check
            if (arrow.x > canvas.width || arrow.y > canvas.height || arrow.x < 0) {
                isArrowFlying = false;
                shootBtn.disabled = false;
                arrowsLeft--;
                arrowsVal.textContent = arrowsLeft;

                if (arrowsLeft <= 0) {
                    endGame();
                } else {
                    setupRound();
                }
            }
        }

        function drawArcher() {
            ctx.save();
            ctx.translate(archerPos.x, archerPos.y);

            // Archer Stick figure base
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 4;

            // Bow Aim Line / Trajectory preview
            let angle = -parseFloat(angleInput.value) * (Math.PI / 180);
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2); // Head
            ctx.stroke();

            // Draw Bow
            ctx.save();
            ctx.rotate(angle);
            ctx.strokeStyle = '#d35400';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(10, 0, 30, -Math.PI / 2, Math.PI / 2);
            ctx.stroke();
            ctx.restore();

            ctx.restore();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ground / Environment background lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.moveTo(0, 460);
            ctx.lineTo(1000, 460);
            ctx.stroke();

            // Render components
            drawArcher();

            // Update & Draw targets
            targets.forEach(t => {
                t.update();
                t.draw();
            });

            // Update & Draw Arrow
            if (isArrowFlying && arrow) {
                arrow.update();
                arrow.draw();
                checkCollision();
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            document.getElementById('final-score').textContent = score;
            gameOverModal.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            arrowsLeft = 10;
            scoreVal.textContent = score;
            arrowsVal.textContent = arrowsLeft;
            gameOverModal.style.display = 'none';
            setupRound();
        }

        // Initialize Game
        setupRound();
        gameLoop();
    </script>
</body>
</html>
