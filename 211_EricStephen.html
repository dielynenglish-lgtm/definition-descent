<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Balloon Pop - High Energy Vocabulary Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      height: 100vh;
      width: 100vw;
    }

    /* Screen Shake Effect */
    .shake {
      animation: violentShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes violentShake {
      10%, 90% { transform: translate3d(-8px, 5px, 0) rotate(-2deg); }
      20%, 80% { transform: translate3d(10px, -8px, 0) rotate(3deg); }
      30%, 50%, 70% { transform: translate3d(-12px, 8px, 0) rotate(-3deg); }
      40%, 60% { transform: translate3d(12px, -5px, 0) rotate(2deg); }
    }

    /* Command Center Box */
    #command-center {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      color: #fff;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 10;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
    }

    .score-value {
      color: #4cd137;
    }

    .timer-value {
      color: #e84118;
    }

    .definition-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .definition-text {
      font-size: 1.3rem;
      font-weight: 600;
      color: #fbc531;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Game Arena */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Balloon Styling */
    .balloon {
      position: absolute;
      bottom: -120px;
      width: 90px;
      height: 110px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.2), 0 10px 15px rgba(0, 0, 0, 0.15);
      transition: transform 0.1s ease;
      z-index: 5;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 12px solid inherit;
    }

    .balloon::before {
      content: '';
      position: absolute;
      bottom: -32px;
      left: 50%;
      width: 2px;
      height: 20px;
      background: rgba(255, 255, 255, 0.6);
    }

    .balloon-text {
      color: #ffffff;
      font-weight: bold;
      font-size: 0.95rem;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      text-align: center;
      padding: 0 5px;
      word-break: break-word;
    }

    /* Start / End Game Overlay */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      color: #fff;
    }

    #overlay h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #fbc531;
    }

    #overlay p {
      font-size: 1.2rem;
      max-width: 500px;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .btn {
      background: #4cd137;
      color: #fff;
      border: none;
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(76, 209, 55, 0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #44bd32;
    }

    /* Pop Effect Particle */
    .pop-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      animation: particleExplode 0.4s ease-out forwards;
      z-index: 15;
    }

    @keyframes particleExplode {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0);
      }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Command Center -->
    <div id="command-center">
      <div class="hud-header">
        <div>SCORE: <span id="score" class="score-value">0</span></div>
        <div>TIME: <span id="timer" class="timer-value">90</span>s</div>
      </div>
      <div class="definition-title">Target Definition</div>
      <div id="definition" class="definition-text">Loading game...</div>
    </div>

    <!-- Start / End Screen Overlay -->
    <div id="overlay">
      <h1 id="overlay-title">BALLOON POP</h1>
      <p id="overlay-msg">Match target definitions with floating word balloons. Correct pops yield 10 points; wrong pops incur a 5-point penalty and screen shake!</p>
      <button id="start-btn" class="btn">START GAME</button>
    </div>
  </div>

  <script>
    // 10 Vocabulary Words & Definitions
    const vocabularyList = [
      { word: "imaginative", definition: "Having or showing creativity or inventiveness." },
      { word: "luxury", definition: "A state of great comfort or elegance, especially at great expense." },
      { word: "elaborately", definition: "In a detailed and carefully arranged manner." },
      { word: "artists", definition: "People who produce paintings, drawings, music, or other creative works." },
      { word: "highlight", definition: "An outstanding or enjoyable part of something; to draw special attention to." },
      { word: "compelling", definition: "Evoking interest, attention, or admiration in a powerfully irresistible way." },
      { word: "beloved", definition: "Dearly loved; highly valued and cherished." },
      { word: "vibrancy", definition: "The quality of being full of energy, life, and enthusiasm." },
      { word: "vibrant", definition: "Full of energy and life; bright and striking in color." },
      { word: "pathway", definition: "A track or path that leads to a specific destination." }
    ];

    const balloonColors = [
      "#e84118", "#00a8ff", "#9c88ff", "#4cd137", 
      "#fbc531", "#e1b12c", "#487eb0", "#e84393"
    ];

    let score = 0;
    let timeLeft = 90;
    let gameInterval = null;
    let spawnInterval = null;
    let currentTarget = null;
    let activeBalloons = [];

    const container = document.getElementById("game-container");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const definitionEl = document.getElementById("definition");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayMsg = document.getElementById("overlay-msg");
    const startBtn = document.getElementById("start-btn");

    startBtn.addEventListener("click", startGame);

    function startGame() {
      // Reset state
      score = 0;
      timeLeft = 90;
      scoreEl.textContent = score;
      timerEl.textContent = timeLeft;
      overlay.style.display = "none";

      // Clear remaining balloons
      document.querySelectorAll(".balloon").forEach(b => b.remove());
      activeBalloons = [];

      // Pick target & start loops
      pickNewTarget();
      
      gameInterval = setInterval(updateTimer, 1000);
      spawnInterval = setInterval(spawnBalloon, 1000); // 1 balloon per second
    }

    function updateTimer() {
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }

    function pickNewTarget() {
      const randomIndex = Math.floor(Math.random() * vocabularyList.length);
      currentTarget = vocabularyList[randomIndex];
      definitionEl.textContent = `"${currentTarget.definition}"`;
    }

    function spawnBalloon() {
      // Limit onscreen balloons to ~15-20 max to avoid clutter
      if (document.querySelectorAll(".balloon").length >= 20) return;

      const balloon = document.createElement("div");
      balloon.className = "balloon";

      // Choose word (35% chance to force current target if not already floating)
      let wordObj;
      const targetOnScreen = Array.from(document.querySelectorAll(".balloon-text"))
                                 .some(el => el.textContent === currentTarget.word);

      if (!targetOnScreen && Math.random() < 0.35) {
        wordObj = currentTarget;
      } else {
        wordObj = vocabularyList[Math.floor(Math.random() * vocabularyList.length)];
      }

      const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
      balloon.style.backgroundColor = color;
      balloon.style.color = color; // For pseudoelement border inherit

      const text = document.createElement("span");
      text.className = "balloon-text";
      text.textContent = wordObj.word;
      balloon.appendChild(text);

      // Random horizontal positioning (10% to 85%)
      const posX = Math.random() * 75 + 10;
      balloon.style.left = posX + "vw";

      // Animation float speed (5s to 9s duration)
      const duration = Math.random() * 4 + 5;
      balloon.dataset.word = wordObj.word;

      container.appendChild(balloon);

      // Floating animation using JS Web Animations API
      const animation = balloon.animate([
        { transform: `translateY(0px)` },
        { transform: `translateY(-${window.innerHeight + 200}px)` }
      ], {
        duration: duration * 1000,
        easing: "linear"
      });

      animation.onfinish = () => balloon.remove();

      balloon.addEventListener("mousedown", (e) => popBalloon(e, balloon));
      balloon.addEventListener("touchstart", (e) => {
        e.preventDefault();
        popBalloon(e, balloon);
      });
    }

    function popBalloon(e, balloon) {
      const selectedWord = balloon.dataset.word;
      const rect = balloon.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      createPopParticles(x, y, balloon.style.backgroundColor);

      if (selectedWord === currentTarget.word) {
        // Correct Choice
        score += 10;
        scoreEl.textContent = score;
        balloon.remove();
        pickNewTarget();
      } else {
        // Incorrect Choice
        score -= 5;
        scoreEl.textContent = score;
        balloon.remove();
        triggerShake();
      }
    }

    function triggerShake() {
      container.classList.remove("shake");
      void container.offsetWidth; // Force reflow
      container.classList.add("shake");
      setTimeout(() => container.classList.remove("shake"), 400);
    }

    function createPopParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement("div");
        particle.className = "pop-particle";
        particle.style.backgroundColor = color;
        particle.style.left = x + "px";
        particle.style.top = y + "px";

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 80 + 30;
        const dx = Math.cos(angle) * speed + "px";
        const dy = Math.sin(angle) * speed + "px";

        particle.style.setProperty("--dx", dx);
        particle.style.setProperty("--dy", dy);

        container.appendChild(particle);
        setTimeout(() => particle.remove(), 400);
      }
    }

    function endGame() {
      clearInterval(gameInterval);
      clearInterval(spawnInterval);

      document.querySelectorAll(".balloon").forEach(b => b.remove());

      overlayTitle.textContent = "GAME OVER";
      overlayMsg.innerHTML = `Time's up!<br>Your Final Score: <strong style="color: #4cd137; font-size: 2rem;">${score}</strong>`;
      startBtn.textContent = "PLAY AGAIN";
      overlay.style.display = "flex";
    }
  </script>
</body>
</html>
