<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Link Railway - Train Track Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #2c3e50;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; color: #f1c40f; text-shadow: 2px 2px #000; }
    .instructions {
      background: #34495e;
      padding: 15px;
      border-radius: 8px;
      max-width: 700px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .game-card {
      background: #ecf0f1;
      color: #2c3e50;
      width: 100%;
      max-width: 700px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-board {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #e67e22;
    }
    .train-payload {
      background: #e74c3c;
      color: white;
      padding: 15px 25px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      border: 3px solid #c0392b;
      width: 100%;
    }
    .railway-network {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .switch-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px #2980b9;
    }
    .switch-btn:hover { background: #2980b9; }
    .switch-btn:active { transform: translateY(2px); box-shadow: 0 2px #2980b9; }
    .stations-container {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-top: 15px;
      gap: 10px;
    }
    .station-btn {
      flex: 1;
      background: #2ecc71;
      color: white;
      border: none;
      padding: 15px 10px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px #27ae60;
      transition: all 0.2s;
    }
    .station-btn:hover { background: #27ae60; }
    .station-btn:disabled { background: #bdc3c7; box-shadow: none; cursor: not-allowed; }
    .feedback {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 30px;
    }
    .next-btn {
      margin-top: 15px;
      background: #9b59b6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <h1>🚂 Word Link Railway</h1>
  
  <div class="instructions">
    <p><strong>How to Play:</strong> Read the definition carried by the train. Click the switch button to align the track toward the correct station, then click the matching vocabulary station!</p>
  </div>

  <div class="game-card">
    <div class="score-board" id="score">Score: 0 / 7</div>
    
    <div class="train-payload" id="payload">
      🚂 Loading Train Payload...
    </div>

    <div class="railway-network">
      <button class="switch-btn" id="switch-btn" onclick="toggleSwitch()">🔀 Switch Track Direction [Currently Points: LEFT Track]</button>
      
      <div class="stations-container" id="stations">
        <!-- Station buttons generate dynamically -->
      </div>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Train ➔</button>
  </div>

  <script>
    // Exact 7 vocabulary words provided
    const vocabData = [
      { word: "breakthrough", definition: "A sudden, dramatic, and important discovery or development." },
      { word: "laboratory", definition: "A room or building equipped for scientific experiments and research." },
      { word: "workshop", definition: "A room or building in which goods are manufactured or repaired." },
      { word: "calculation", definition: "A mathematical determination of the size or amount of something." },
      { word: "envision", definition: "To imagine as a future possibility; to visualize." },
      { word: "striking", definition: "Attracting attention or notice through being unusual, extreme, or prominent." },
      { word: "insight", definition: "The capacity to gain an accurate and deep intuitive understanding of something." }
    ];

    let currentIndex = 0;
    let score = 0;
    let currentSwitchState = "left"; // "left" or "right"

    function loadQuestion() {
      if (currentIndex >= vocabData.length) {
        document.getElementById("payload").innerText = "🎉 All train payloads delivered successfully!";
        document.getElementById("stations").innerHTML = "";
        document.getElementById("switch-btn").style.display = "none";
        document.getElementById("feedback").innerText = `Final Score: ${score} / ${vocabData.length}`;
        return;
      }

      const q = vocabData[currentIndex];
      document.getElementById("payload").innerText = `📦 Train Payload Definition:\n"${q.definition}"`;
      document.getElementById("feedback").innerText = "";
      document.getElementById("next-btn").style.display = "none";

      // Select choices
      let choices = [q.word];
      while (choices.length < 2) {
        let randomWord = vocabData[Math.floor(Math.random() * vocabData.length)].word;
        if (!choices.includes(randomWord)) {
          choices.push(randomWord);
        }
      }
      // Shuffle choices
      choices.sort(() => Math.random() - 0.5);

      const stationsContainer = document.getElementById("stations");
      stationsContainer.innerHTML = "";
      
      choices.forEach((word, index) => {
        const btn = document.createElement("button");
        btn.className = "station-btn";
        btn.innerText = `🚉 Station: ${word} (${index === 0 ? 'Left Track' : 'Right Track'})`;
        btn.onclick = () => checkAnswer(word, index === 0 ? 'left' : 'right');
        stationsContainer.appendChild(btn);
      });
    }

    function toggleSwitch() {
      currentSwitchState = currentSwitchState === "left" ? "right" : "left";
      const switchBtn = document.getElementById("switch-btn");
      switchBtn.innerText = `🔀 Switch Track Direction [Currently Points: ${currentSwitchState.toUpperCase()} Track]`;
    }

    function checkAnswer(selectedWord, trackSide) {
      const correctWord = vocabData[currentIndex].word;

      if (trackSide !== currentSwitchState) {
        document.getElementById("feedback").innerHTML = "<span style='color: #e74c3c;'>⚠️ Track switch mismatch! The train derailed onto the wrong track!</span>";
        return;
      }

      if (selectedWord === correctWord) {
        score++;
        document.getElementById("score").innerText = `Score: ${score} / ${vocabData.length}`;
        document.getElementById("feedback").innerHTML = "<span style='color: #2ecc71;'>✅ Correct! The train safely arrived at the right station!</span>";
        disableStationButtons();
        document.getElementById("next-btn").style.display = "inline-block";
      } else {
        document.getElementById("feedback").innerHTML = "<span style='color: #e74c3c;'>❌ Incorrect station! That word does not match the definition.</span>";
      }
    }

    function disableStationButtons() {
      const btns = document.querySelectorAll(".station-btn");
      btns.forEach(btn => btn.disabled = true);
    }

    function nextQuestion() {
      currentIndex++;
      loadQuestion();
    }

    // Initialize game
    loadQuestion();
  </script>
</body>
</html>
