<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocabulary Pinball</title>
<style>
  body {
    background-color: #111;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 15px;
  }
  
  /* Simple Step-by-Step Instructions Banner */
  #instructionBanner {
    width: 500px;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 12px 18px;
    margin-bottom: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  #instructionBanner h2 {
    margin: 0 0 8px 0;
    font-size: 1.1rem;
    color: #00f2fe;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .steps-container {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .step-card {
    flex: 1;
    background: #0f3460;
    padding: 8px;
    border-radius: 6px;
    font-size: 0.82rem;
    text-align: center;
    line-height: 1.3;
  }
  .step-card span {
    display: block;
    color: #ffdd59;
    font-weight: bold;
    margin-bottom: 3px;
  }

  #gameContainer {
    position: relative;
    border: 4px solid #444;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,252,254,0.2);
  }
  canvas {
    background: #1a1a2e;
    display: block;
    border-radius: 6px;
  }
  .controls-info {
    margin-top: 12px;
    font-size: 14px;
    color: #aaa;
    text-align: center;
  }
  .key-badge {
    background: #333;
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid #555;
    font-weight: bold;
  }
</style>
</head>
<body>

<!-- Step-by-Step Instruction Header -->
<div id="instructionBanner">
  <h2>🎯 How to Play (3 Simple Steps)</h2>
  <div class="steps-container">
    <div class="step-card">
      <span>STEP 1</span>
      Read target definition at top of screen.
    </div>
    <div class="step-card">
      <span>STEP 2</span>
      Press <strong style="color:#00f2fe">SPACE</strong> to launch the ball.
    </div>
    <div class="step-card">
      <span>STEP 3</span>
      Use <strong style="color:#00f2fe">SHIFTS</strong> to hit matching word bumper!
    </div>
  </div>
</div>

<div id="gameContainer">
  <canvas id="pinball" width="500" height="700"></canvas>
</div>

<div class="controls-info">
  <b>Controls:</b> 
  <span class="key-badge">SPACE</span> Launch | 
  <span class="key-badge">LEFT SHIFT</span> Left Flipper | 
  <span class="key-badge">RIGHT SHIFT</span> Right Flipper | 
  <span class="key-badge">R</span> Restart
</div>

<script>
const canvas = document.getElementById('pinball');
const ctx = canvas.getContext('2d');

// Vocabulary Database
const vocabList = [
  { word: "Grip", def: "To hold tightly with the hands" },
  { word: "Adjustment", def: "A small change made to improve something" },
  { word: "Strain", def: "Severe or damaging pressure or force" },
  { word: "Flexible", def: "Capable of bending easily without breaking" },
  { word: "Loosen", def: "To make or become less tight" },
  { word: "Slightly", def: "To a small degree; a little" },
  { word: "Demonstrate", def: "To show clearly by giving proof" }
];

// Game State Variables
let score = 0;
let multiplier = 1;
let ballsRemaining = 3;
let gameState = "START"; // START, PLAYING, GAMEOVER
let currentTargetIndex = 0;
let wordBumpers = [];
let ballSaverActive = false;
let ballSaverTimer = 0;
let flashMessage = "";
let flashTimer = 0;

// Keys pressed
const keys = { LeftShift: false, RightShift: false, Space: false };

// Relaxed Physics Settings (Easier & Playable)
const GRAVITY = 0.10;
const FRICTION = 0.994;

// Ball Object
const ball = {
  x: 470,
  y: 600,
  vx: 0,
  vy: 0,
  radius: 11,
  inPlungerLane: true
};

// Flippers Setup
const flipperBase = {
  length: 80,
  width: 16,
  restAngle: 0.35,
  activeAngle: -0.45,
  leftX: 140,
  leftY: 620,
  rightX: 310,
  rightY: 620
};

let leftFlipperAngle = flipperBase.restAngle;
let rightFlipperAngle = -flipperBase.restAngle;

// Initialize Word Bumpers
function initBumpers() {
  const targetWord = vocabList[currentTargetIndex];
  let wrongWords = vocabList.filter(v => v.word !== targetWord.word);
  wrongWords = wrongWords.sort(() => 0.5 - Math.random()).slice(0, 2);

  const bumperData = [
    { word: targetWord.word, isTarget: true },
    { word: wrongWords[0].word, isTarget: false },
    { word: wrongWords[1].word, isTarget: false }
  ].sort(() => 0.5 - Math.random());

  const positions = [
    { x: 130, y: 220 },
    { x: 225, y: 150 },
    { x: 320, y: 220 }
  ];

  wordBumpers = bumperData.map((b, i) => ({
    x: positions[i].x,
    y: positions[i].y,
    radius: 42,
    word: b.word,
    isTarget: b.isTarget,
    flash: 0
  }));
}

// Reset Ball Position
function resetBall() {
  ball.x = 470;
  ball.y = 600;
  ball.vx = 0;
  ball.vy = 0;
  ball.inPlungerLane = true;
}

// Event Listeners
window.addEventListener('keydown', (e) => {
  if (e.code === 'ShiftLeft') keys.LeftShift = true;
  if (e.code === 'ShiftRight') keys.RightShift = true;
  if (e.code === 'Space') {
    keys.Space = true;
    if (gameState === "START") {
      gameState = "PLAYING";
    }
  }
  if (e.code === 'KeyR') {
    resetGame();
  }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ShiftLeft') keys.LeftShift = false;
  if (e.code === 'ShiftRight') keys.RightShift = false;
  if (e.code === 'Space') keys.Space = false;
});

function resetGame() {
  score = 0;
  multiplier = 1;
  ballsRemaining = 3;
  currentTargetIndex = Math.floor(Math.random() * vocabList.length);
  ballSaverActive = false;
  initBumpers();
  resetBall();
  gameState = "PLAYING";
}

// Main Update Loop
function update() {
  if (gameState !== "PLAYING") return;

  // Timers
  if (ballSaverTimer > 0) {
    ballSaverTimer--;
    if (ballSaverTimer <= 0) ballSaverActive = false;
  }
  if (flashTimer > 0) flashTimer--;

  // Auto-Plunger Launch on Spacebar
  if (ball.inPlungerLane) {
    if (keys.Space) {
      ball.vy = -12 - Math.random() * 2;
      ball.vx = -1.5;
      ball.inPlungerLane = false;
      ballSaverActive = true;
      ballSaverTimer = 240; // 4 Seconds protection on launch
    }
  }

  // Smooth Flipper Controls
  const targetLeftAngle = keys.LeftShift ? flipperBase.activeAngle : flipperBase.restAngle;
  const targetRightAngle = keys.RightShift ? -flipperBase.activeAngle : -flipperBase.restAngle;
  leftFlipperAngle += (targetLeftAngle - leftFlipperAngle) * 0.45;
  rightFlipperAngle += (targetRightAngle - rightFlipperAngle) * 0.45;

  // Ball Movement & Boundary Physics
  if (!ball.inPlungerLane) {
    ball.vy += GRAVITY;
    ball.vx *= FRICTION;
    ball.vy *= FRICTION;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Right Wall Outer Lane
    if (ball.x > 445 && ball.y > 220) {
      if (ball.x + ball.radius > 455) {
        ball.x = 455 - ball.radius;
        ball.vx *= -0.7;
      }
    } else if (ball.x + ball.radius > 445) {
      ball.x = 445 - ball.radius;
      ball.vx *= -0.7;
    }

    // Left Wall
    if (ball.x - ball.radius < 10) {
      ball.x = 10 + ball.radius;
      ball.vx *= -0.7;
    }

    // Top Wall
    if (ball.y - ball.radius < 10) {
      ball.y = 10 + ball.radius;
      ball.vy *= -0.7;
    }

    // Lane Divider Wall
    if (ball.x > 440 && ball.x - ball.radius < 440 && ball.y > 220) {
      ball.x = 440 - ball.radius;
      ball.vx *= -0.7;
    }

    // Bumper Hit Collisions
    wordBumpers.forEach(bumper => {
      let dx = ball.x - bumper.x;
      let dy = ball.y - bumper.y;
      let dist = Math.hypot(dx, dy);

      if (dist < ball.radius + bumper.radius) {
        let angle = Math.atan2(dy, dx);
        let speed = Math.hypot(ball.vx, ball.vy) + 3.5;
        ball.vx = Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
        bumper.flash = 12;

        if (bumper.isTarget) {
          multiplier += 1;
          score += 500 * multiplier;
          ballSaverActive = true;
          ballSaverTimer = 300;
          triggerFlash("🎉 CORRECT! +500 PTS (BALL SAVER ACTIVE)");
          
          currentTargetIndex = (currentTargetIndex + 1) % vocabList.length;
          initBumpers();
        } else {
          score = Math.max(0, score - 100);
          triggerFlash("❌ WRONG WORD! -100 PTS");
        }
      }
    });

    // Flipper Collisions
    checkFlipperCollision(flipperBase.leftX, flipperBase.leftY, flipperBase.length, leftFlipperAngle, true);
    checkFlipperCollision(flipperBase.rightX, flipperBase.rightY, flipperBase.length, rightFlipperAngle, false);

    // Bottom Safety Gate (Ball Saver)
    if (ballSaverActive && ball.y > 640 && ball.x > 130 && ball.x < 320) {
      ball.vy = -10;
      triggerFlash("🛡️ BALL SAVED!");
    }

    // Out of Bounds Drain
    if (ball.y > 720) {
      ballsRemaining--;
      if (ballsRemaining <= 0) {
        gameState = "GAMEOVER";
      } else {
        resetBall();
      }
    }
  }
}

// Flipper Physics Collision Helper
function checkFlipperCollision(fx, fy, length, angle, isLeft) {
  let endX = fx + Math.cos(angle) * (isLeft ? length : -length);
  let endY = fy + Math.sin(angle) * length;

  let dx = endX - fx;
  let dy = endY - fy;
  let len = Math.hypot(dx, dy);
  let u = (((ball.x - fx) * dx) + ((ball.y - fy) * dy)) / (len * len);

  if (u >= 0 && u <= 1) {
    let ix = fx + u * dx;
    let iy = fy + u * dy;
    let dist = Math.hypot(ball.x - ix, ball.y - iy);

    if (dist < ball.radius + flipperBase.width / 2) {
      let normX = (ball.x - ix) / dist;
      let normY = (ball.y - iy) / dist;
      let active = (isLeft && keys.LeftShift) || (!isLeft && keys.RightShift);
      let force = active ? 11 : 4.5;
      
      ball.vx = normX * force;
      ball.vy = normY * force;
    }
  }
}

function triggerFlash(msg) {
  flashMessage = msg;
  flashTimer = 90;
}

// Render Loop
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Outer Playfield Frame
  ctx.strokeStyle = "#2c2c54";
  ctx.lineWidth = 3;
  ctx.strokeRect(10, 10, 435, 680);

  // Top Definition Display Box
  ctx.fillStyle = "#161625";
  ctx.fillRect(20, 20, 415, 75);
  ctx.strokeStyle = "#00f0ff";
  ctx.lineWidth = 2;
  ctx.strokeRect(20, 20, 415, 75);

  const currentVocab = vocabList[currentTargetIndex];
  ctx.fillStyle = "#ffdd59";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "center";
  ctx.fillText("TARGET DEFINITION", 227, 40);
  ctx.fillStyle = "#00f0ff";
  ctx.font = "bold 15px Arial";
  ctx.fillText(`"${currentVocab.def}"`, 227, 68);

  // Ball Saver Safety Line Display
  if (ballSaverActive) {
    ctx.strokeStyle = "#2ed573";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(130, 650);
    ctx.lineTo(320, 650);
    ctx.stroke();

    ctx.fillStyle = "#2ed573";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.fillText("BALL SAVER SHIELD ACTIVE", 225, 670);
  }

  // Draw Word Bumpers
  wordBumpers.forEach(bumper => {
    ctx.save();
    ctx.beginPath();
    ctx.arc(bumper.x, bumper.y, bumper.radius, 0, Math.PI * 2);
    
    if (bumper.flash > 0) {
      ctx.fillStyle = "#ffffff";
      bumper.flash--;
    } else {
      ctx.fillStyle = bumper.isTarget ? "#ff4757" : "#3d3d6b";
    }
    
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = bumper.isTarget ? "#ff6b81" : "#546de5";
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";
    ctx.fillText(bumper.word, bumper.x, bumper.y + 5);
    ctx.restore();
  });

  // Draw Left Flipper
  ctx.save();
  ctx.translate(flipperBase.leftX, flipperBase.leftY);
  ctx.rotate(leftFlipperAngle);
  ctx.fillStyle = "#ffa500";
  ctx.fillRect(0, -flipperBase.width / 2, flipperBase.length, flipperBase.width);
  ctx.restore();

  // Draw Right Flipper
  ctx.save();
  ctx.translate(flipperBase.rightX, flipperBase.rightY);
  ctx.rotate(rightFlipperAngle);
  ctx.fillStyle = "#ffa500";
  ctx.fillRect(-flipperBase.length, -flipperBase.width / 2, flipperBase.length, flipperBase.width);
  ctx.restore();

  // Plunger Lane Separator
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(440, 220);
  ctx.lineTo(440, 690);
  ctx.stroke();

  // Draw Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = "#00f0ff";
  ctx.shadowColor = "#00f0ff";
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Score HUD
  ctx.fillStyle = "#fff";
  ctx.font = "14px Arial";
  ctx.textAlign = "left";
  ctx.fillText(`Score: ${score}`, 20, 120);
  ctx.fillText(`Multiplier: x${multiplier}`, 20, 140);

  ctx.textAlign = "right";
  ctx.fillText(`Balls Left: ${ballsRemaining}`, 425, 120);

  // Flash Feedback Text
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${flashTimer / 90})`;
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.fillText(flashMessage, 225, 125);
  }

  // Full Screen Overlays
  if (gameState === "START") {
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00f2fe";
    ctx.font = "bold 26px Arial";
    ctx.textAlign = "center";
    ctx.fillText("VOCABULARY PINBALL", 250, 310);
    ctx.fillStyle = "#fff";
    ctx.font = "16px Arial";
    ctx.fillText("Press SPACE to Start Game", 250, 360);
  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff4757";
    ctx.font = "bold 28px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 250, 310);
    ctx.fillStyle = "#fff";
    ctx.font = "18px Arial";
    ctx.fillText(`Final Score: ${score}`, 250, 355);
    ctx.font = "15px Arial";
    ctx.fillStyle = "#aaa";
    ctx.fillText("Press 'R' to Play Again", 250, 395);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Start Game Engine
initBumpers();
gameLoop();
</script>

</body>
</html>
