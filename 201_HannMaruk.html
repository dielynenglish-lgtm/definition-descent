<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Flashcard Memory Matrix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 2rem;
            text-align: center;
        }

        .stats-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background-color: #1e293b;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .stat-box {
            font-size: 1.1rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .stat-value {
            color: #38bdf8;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 640px;
            width: 100%;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1;
            background-color: transparent;
            cursor: pointer;
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s;
            transform-style: preserve-3d;
            border-radius: 8px;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-size: 0.95rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .card-front {
            background-color: #3b82f6;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            border: 2px solid #60a5fa;
        }

        .card-back {
            background-color: #f8fafc;
            color: #0f172a;
            transform: rotateY(180deg);
            border: 2px solid #cbd5e1;
            font-weight: 600;
            line-height: 1.3;
        }

        .card.matched .card-back {
            background-color: #22c55e;
            color: white;
            border-color: #4ade80;
        }

        /* Victory Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            border: 2px solid #38bdf8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .modal-content p {
            margin: 10px 0;
            font-size: 1.1rem;
        }

        .btn-restart {
            margin-top: 20px;
            padding: 10px 24px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-restart:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

    <h1>Flashcard Memory Matrix</h1>

    <div class="stats-panel">
        <div class="stat-box">Time: <span id="timer" class="stat-value">90</span>s</div>
        <div class="stat-box">Moves: <span id="moves" class="stat-value">0</span></div>
        <div class="stat-box">Matches: <span id="matches" class="stat-value">0/8</span></div>
    </div>

    <div class="game-grid" id="grid"></div>

    <!-- Victory Screen Modal -->
    <div class="modal" id="victoryModal">
        <div class="modal-content">
            <h2 id="modalTitle">Victory!</h2>
            <p id="finalTime"></p>
            <p id="finalMoves"></p>
            <p id="efficiencyRating"></p>
            <button class="btn-restart" onclick="initGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Master vocabulary pool
        const vocabularyPool = [
            { word: "Coincidence", def: "A remarkable concurrence of events without apparent causal connection." },
            { word: "Invade", def: "To enter a place in large numbers to take control of it." },
            { word: "Overthrow", def: "To remove a government or leader from power by force." },
            { word: "Rigid", def: "Not able to be bent or changed; stiff and inflexible." },
            { word: "Labor", def: "Hard physical work, especially manual work." },
            { word: "Peasant", def: "A poor farmer of low social status who owns or rents a small piece of land." },
            { word: "Noble", def: "Belonging to a high social class with a title." },
            { word: "Encounter", def: "An unexpected or casual meeting with someone or something." },
            { word: "Feast", def: "A large meal, typically one in celebration of something." },
            { word: "Merge", def: "To combine or cause to combine to form a single entity." }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moveCount = 0;
        let timeLeft = 90;
        let timerInterval = null;
        let isBoardLocked = false;

        function initGame() {
            // Reset state
            matchedPairs = 0;
            moveCount = 0;
            timeLeft = 90;
            flippedCards = [];
            isBoardLocked = false;
            
            document.getElementById("moves").innerText = moveCount;
            document.getElementById("matches").innerText = `${matchedPairs}/8`;
            document.getElementById("timer").innerText = timeLeft;
            document.getElementById("victoryModal").style.display = "none";

            clearInterval(timerInterval);
            startTimer();

            // Randomly select 8 words from the 10 provided
            const selectedVocab = [...vocabularyPool].sort(() => 0.5 - Math.random()).slice(0, 8);

            // Create 16 cards (8 words + 8 definitions)
            cards = [];
            selectedVocab.forEach((item, index) => {
                cards.push({ id: index, type: 'word', content: item.word });
                cards.push({ id: index, type: 'def', content: item.def });
            });

            // Shuffle grid
            cards.sort(() => 0.5 - Math.random());

            renderGrid();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame(false);
                }
            }, 1000);
        }

        function renderGrid() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";

            cards.forEach((cardData, index) => {
                const card = document.createElement("div");
                card.classList.add("card");
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">${cardData.content}</div>
                    </div>
                `;

                card.addEventListener("click", () => handleCardClick(card, cardData));
                grid.appendChild(card);
            });
        }

        function handleCardClick(cardElement, cardData) {
            // Ignore if board locked, card already flipped, or matched
            if (isBoardLocked || cardElement.classList.contains("flipped") || cardElement.classList.contains("matched")) {
                return;
            }

            cardElement.classList.add("flipped");
            flippedCards.push({ element: cardElement, data: cardData });

            if (flippedCards.length === 2) {
                moveCount++;
                document.getElementById("moves").innerText = moveCount;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            // Check if both cards share the same ID (word-definition match)
            if (card1.data.id === card2.data.id) {
                card1.element.classList.add("matched");
                card2.element.classList.add("matched");
                matchedPairs++;
                document.getElementById("matches").innerText = `${matchedPairs}/8`;
                flippedCards = [];

                if (matchedPairs === 8) {
                    clearInterval(timerInterval);
                    endGame(true);
                }
            } else {
                // If no match, flip back after 1-second delay
                isBoardLocked = true;
                setTimeout(() => {
                    card1.element.classList.remove("flipped");
                    card2.element.classList.remove("flipped");
                    flippedCards = [];
                    isBoardLocked = false;
                }, 1000);
            }
        }

        function endGame(isWin) {
            const modal = document.getElementById("victoryModal");
            const title = document.getElementById("modalTitle");
            const timeText = document.getElementById("finalTime");
            const movesText = document.getElementById("finalMoves");
            const ratingText = document.getElementById("efficiencyRating");

            modal.style.display = "flex";

            if (isWin) {
                title.innerText = "🎉 Victory!";
                timeText.innerText = `Time Remaining: ${timeLeft}s`;
                movesText.innerText = `Total Moves: ${moveCount}`;

                // Calculate Efficiency Rating
                let rating = "S Tier (Master)";
                if (moveCount > 12 && moveCount <= 18) rating = "A Tier (Expert)";
                else if (moveCount > 18 && moveCount <= 24) rating = "B Tier (Proficient)";
                else if (moveCount > 24) rating = "C Tier (Keep Practicing)";

                ratingText.innerText = `Efficiency Rating: ${rating}`;
            } else {
                title.innerText = "⏰ Time's Up!";
                timeText.innerText = "You ran out of time.";
                movesText.innerText = `Total Moves: ${moveCount}`;
                ratingText.innerText = `Matches Uncovered: ${matchedPairs}/8`;
            }
        }

        // Start game on load
        window.onload = initGame;
    </script>
</body>
</html>
