<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Memory Match</title>
  <style>
    :root {
      --primary: #4a90e2;
      --card-back: #2c3e50;
      --text: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
      color: #e0e0e0;
    }

    .stats {
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: #b0b0b0;
    }

    .game-container {
      position: relative;
      width: 900px;
      max-width: 95vw;
      height: 550px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background-color: #0f3460;
    }

    /* Hidden background image to reveal */
    .bg-illustration {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff7e5f, #feb47b, #6a11cb, #2575fc);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .bg-illustration h2 {
      font-size: 3rem;
      margin: 0;
      color: #fff;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .bg-illustration p {
      font-size: 1.2rem;
      color: #f0f0f0;
    }

    .grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
      z-index: 2;
    }

    .card {
      background-color: transparent;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      border-radius: 8px;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-sizing: border-box;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .card-back {
      background: linear-gradient(145deg, #1f4068, #162447);
      border: 2px solid #e94560;
      color: #e94560;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .card-front {
      background-color: #ffffff;
      color: #1a1a2e;
      transform: rotateY(180deg);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .card-front.word {
      background-color: #e94560;
      color: #ffffff;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card.matched {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s 0.4s, opacity 0.4s linear;
    }
  </style>
</head>
<body>

  <h1>Vocabulary Match Game</h1>
  <div class="stats">Matches: <span id="matches">0</span> / 7 | Attempts: <span id="attempts">0</span></div>

  <div class="game-container">
    <div class="bg-illustration">
      <h2>🎉 Fantastic Job!</h2>
      <p>You revealed the hidden artwork and mastered all 7 vocabulary words!</p>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const vocabPairs = [
      { id: 1, type: 'word', text: 'Beloved' },
      { id: 1, type: 'def', text: 'Dearly loved or cherished by someone' },
      { id: 2, type: 'word', text: 'Highlight' },
      { id: 2, type: 'def', text: 'An outstanding feature or memorable part' },
      { id: 3, type: 'word', text: 'Performer' },
      { id: 3, type: 'def', text: 'A person who entertains an audience' },
      { id: 4, type: 'word', text: 'Compelling' },
      { id: 4, type: 'def', text: 'Evoking interest, attention, or admiration' },
      { id: 5, type: 'word', text: 'Luxury' },
      { id: 5, type: 'def', text: 'A state of great comfort or elegance' },
      { id: 6, type: 'word', text: 'Elaborately' },
      { id: 6, type: 'def', text: 'In a detailed and carefully arranged manner' },
      { id: 7, type: 'word', text: 'Surroundings' },
      { id: 7, type: 'def', text: 'The things and conditions around a person or place' }
    ];

    let flippedCards = [];
    let matchedCount = 0;
    let attemptsCount = 0;
    let lockBoard = false;

    const grid = document.getElementById('grid');
    const matchesEl = document.getElementById('matches');
    const attemptsEl = document.getElementById('attempts');

    // Fisher-Yates shuffle algorithm
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createBoard() {
      const shuffledCards = shuffle([...vocabPairs]);
      shuffledCards.forEach(item => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.id = item.id;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-back">?</div>
            <div class="card-front ${item.type}">${item.text}</div>
          </div>
        `;

        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      lockBoard = true;
      attemptsCount++;
      attemptsEl.textContent = attemptsCount;

      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.id === card2.dataset.id;

      if (isMatch) {
        setTimeout(() => {
          card1.classList.add('matched');
          card2.classList.add('matched');
          matchedCount++;
          matchesEl.textContent = matchedCount;
          resetBoard();
        }, 600);
      } else {
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          resetBoard();
        }, 1200);
      }
    }

    function resetBoard() {
      flippedCards = [];
      lockBoard = false;
    }

    createBoard();
  </script>
</body>
</html>
