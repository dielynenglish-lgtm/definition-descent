<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner: Definition Gates</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #000;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay UI Elements */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .hud-item {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #shield-bar-container {
            width: 150px;
            height: 16px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #555;
        }

        #shield-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            transition: width 0.3s ease;
        }

        #definition-overlay {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            border-radius: 8px;
            padding: 10px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
            z-index: 10;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        #definition-overlay.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #definition-title {
            font-size: 11px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        #definition-text {
            font-size: 16px;
            font-weight: 500;
            color: #f8fafc;
        }

        /* Screen Overlays (Start / Game Over) */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 15px;
            text-align: center;
            padding: 20px;
        }

        .screen-overlay h1 {
            font-size: 36px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            margin-bottom: 5px;
        }

        .screen-overlay p {
            font-size: 15px;
            color: #94a3b8;
            max-width: 500px;
            line-height: 1.5;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        .controls-info {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 6px;
        }

        .key {
            background: #334155;
            padding: 2px 8px;
            border-radius: 4px;
            border-bottom: 2px solid #1e293b;
            font-family: monospace;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD Overlay -->
        <div id="hud">
            <div class="hud-item">
                Score: <span id="score-text" style="color: #38bdf8;">0m</span>
            </div>
            <div class="hud-item">
                Shield:
                <div id="shield-bar-container">
                    <div id="shield-bar"></div>
                </div>
            </div>
            <div class="hud-item">
                Speed: <span id="speed-text" style="color: #f59e0b;">1.0x</span>
            </div>
        </div>

        <!-- Target Definition Overlay Bar -->
        <div id="definition-overlay">
            <div id="definition-title">Target Definition</div>
            <div id="definition-text">---</div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="screen-overlay">
            <h1>DEFINITION GATES</h1>
            <p>Run endlessly, jump over obstacles, and pass through the gate that matches the active definition at the top of the screen!</p>
            <div class="controls-info">
                <div><span class="key">▲</span> Jump</div>
                <div><span class="key">◄</span> <span class="key">►</span> Shift Lane</div>
            </div>
            <button class="btn" id="start-btn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen-overlay hidden">
            <h1 style="color: #ef4444;">GAME OVER</h1>
            <p id="game-over-reason">Your shield was destroyed!</p>
            <p>Final Score: <span id="final-score" style="color: #38bdf8; font-weight: bold;">0m</span></p>
            <button class="btn" id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        // --- VOCABULARY DATASET ---
        const VOCABULARY = [
            { word: "communication", def: "The imparting or exchanging of information or news." },
            { word: "conventional", def: "Based on or in accordance with what is generally done or accepted." },
            { word: "fascinating", def: "Extremely interesting or captivating." },
            { word: "generate", def: "To cause something to arise or come into being; produce." },
            { word: "scent", def: "A distinctive smell, especially one that is pleasant." },
            { word: "prompt", def: "Done without delay; immediate, or an instruction given to a system." },
            { word: "nutrient", def: "A substance that provides nourishment essential for growth and life." },
            { word: "obstacle", def: "A thing that blocks one's way or prevents progress." },
            { word: "velocity", def: "The speed of something in a given direction." },
            { word: "shield", def: "A person or thing providing protection against danger." }
        ];

        // --- GAME ENGINE SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const scoreText = document.getElementById('score-text');
        const speedText = document.getElementById('speed-text');
        const shieldBar = document.getElementById('shield-bar');
        const defOverlay = document.getElementById('definition-overlay');
        const defText = document.getElementById('definition-text');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverReason = document.getElementById('game-over-reason');
        const finalScoreText = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Lane definitions (X coordinates for perspective projection centers)
        const LANES = [0, 1]; // 0: Left Lane, 1: Right Lane
        const LANE_X_OFFSETS = [-140, 140];

        // Game State Variables
        let isRunning = false;
        let lastTime = 0;
        let distanceRun = 0; // In meters
        let baseSpeed = 220; // World units per second
        let speedMultiplier = 1.0;
        let shield = 100;
        let maxShield = 100;

        // Mechanics Timing
        let gateTimer = 0;
        const GATE_INTERVAL = 10; // Gate spawns every 10 seconds
        let obstacleTimer = 0;
        const OBSTACLE_INTERVAL = 2.5; // Ground obstacle frequency

        // Active Entities
        let player;
        let obstacles = [];
        let activeGateStructure = null;
        let currentTargetVocab = null;

        // Background Particles/Grid setup
        let groundOffset = 0;

        // Input Handler
        const keys = {};

        class Player {
            constructor() {
                this.lane = 0; // 0 = Left, 1 = Right
                this.x = 0; // Calculated based on lane
                this.y = 0; // Vertical offset for jumping
                this.vy = 0;
                this.gravity = -1200;
                this.jumpForce = 450;
                this.isGrounded = true;
                this.width = 40;
                this.height = 60;
                this.color = '#38bdf8';
            }

            update(dt) {
                // Apply Gravity
                if (!this.isGrounded) {
                    this.vy += this.gravity * dt;
                    this.y += this.vy * dt;
                    if (this.y <= 0) {
                        this.y = 0;
                        this.vy = 0;
                        this.isGrounded = true;
                    }
                }

                // Smooth position rendering towards current lane
                const targetX = (canvas.width / 2) + LANE_X_OFFSETS[this.lane];
                this.x += (targetX - this.x) * 15 * dt;
            }

            jump() {
                if (this.isGrounded) {
                    this.vy = this.jumpForce;
                    this.isGrounded = false;
                }
            }

            moveLeft() {
                if (this.lane > 0) this.lane--;
            }

            moveRight() {
                if (this.lane < 1) this.lane++;
            }

            draw(ctx) {
                const screenY = canvas.height - 80 - this.y;
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(this.x, canvas.height - 75, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Player Body
                ctx.fillStyle = this.color;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                
                // Draw dynamic futuristic character block
                ctx.fillRect(this.x - this.width / 2, screenY - this.height, this.width, this.height);
                
                // Character Visor
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x - (this.lane === 0 ? 10 : 5), screenY - this.height + 12, 15, 8);

                ctx.shadowBlur = 0; // Reset shadow
            }
        }

        class Obstacle {
            constructor(lane) {
                this.lane = lane;
                this.z = 1000; // Distance away from screen (3D perspective)
                this.passed = false;
                this.width = 60;
                this.height = 30;
            }

            update(dt, speed) {
                this.z -= speed * dt;
            }

            draw(ctx) {
                if (this.z <= 0) return;

                // Perspective projection factor
                const scale = 300 / (300 + this.z);
                const laneX = (canvas.width / 2) + LANE_X_OFFSETS[this.lane] * scale;
                const groundY = canvas.height - 75;
                const screenY = groundY - (groundY - 200) * (1 - scale);

                const w = this.width * scale;
                const h = this.height * scale;

                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 8 * scale;
                ctx.fillRect(laneX - w / 2, screenY - h, w, h);
                ctx.shadowBlur = 0;
            }
        }

        class DefinitionGateStructure {
            constructor(wordA, wordB, correctLane) {
                this.z = 1200;
                this.wordA = wordA;
                this.wordB = wordB;
                this.correctLane = correctLane;
                this.passed = false;
            }

            update(dt, speed) {
                this.z -= speed * dt;
            }

            draw(ctx) {
                if (this.z <= 0) return;

                const scale = 300 / (300 + this.z);
                const groundY = canvas.height - 75;
                const screenY = groundY - (groundY - 200) * (1 - scale);
                const archWidth = 120 * scale;
                const archHeight = 140 * scale;

                // Render Archway A (Left Lane) and B (Right Lane)
                [0, 1].forEach(lane => {
                    const laneX = (canvas.width / 2) + LANE_X_OFFSETS[lane] * scale;
                    const word = lane === 0 ? this.wordA : this.wordB;

                    // Arch Frame
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = Math.max(2, 6 * scale);
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                    
                    ctx.beginPath();
                    ctx.rect(laneX - archWidth / 2, screenY - archHeight, archWidth, archHeight);
                    ctx.fill();
                    ctx.stroke();

                    // Text Signboard above Archway
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(laneX - archWidth / 2, screenY - archHeight - (25 * scale), archWidth, 25 * scale);
                    ctx.strokeRect(laneX - archWidth / 2, screenY - archHeight - (25 * scale), archWidth, 25 * scale);

                    // Word Text
                    const fontSize = Math.max(10, Math.floor(14 * scale));
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.fillText(word, laneX, screenY - archHeight - (8 * scale));
                });
            }
        }

        // --- GAME LOGIC & FUNCTIONS ---

        function init() {
            player = new Player();
            obstacles = [];
            activeGateStructure = null;
            currentTargetVocab = null;
            
            distanceRun = 0;
            speedMultiplier = 1.0;
            shield = maxShield;
            gateTimer = 0;
            obstacleTimer = 0;
            
            updateHUD();
            defOverlay.classList.remove('active');
        }

        function spawnGateStructure() {
            // Choose a random target vocabulary item
            const randomIndex = Math.floor(Math.random() * VOCABULARY.length);
            currentTargetVocab = VOCABULARY[randomIndex];

            // Pick a random distractor word from remaining list
            const distractors = VOCABULARY.filter(v => v.word !== currentTargetVocab.word);
            const distractor = distractors[Math.floor(Math.random() * distractors.length)];

            // Decide correct lane randomly
            const correctLane = Math.random() < 0.5 ? 0 : 1;
            
            const wordA = correctLane === 0 ? currentTargetVocab.word : distractor.word;
            const wordB = correctLane === 1 ? currentTargetVocab.word : distractor.word;

            activeGateStructure = new DefinitionGateStructure(wordA, wordB, correctLane);

            // Display active definition in top UI bar
            defText.textContent = `"${currentTargetVocab.def}"`;
            defOverlay.classList.add('active');
        }

        function spawnObstacle() {
            // Don't spawn ground obstacles if a gate is currently approaching
            if (activeGateStructure && activeGateStructure.z > 200 && activeGateStructure.z < 800) {
                return;
            }
            const lane = Math.random() < 0.5 ? 0 : 1;
            obstacles.push(new Obstacle(lane));
        }

        function applyShieldDamage(amount) {
            shield = Math.max(0, shield - amount);
            // Speed penalty upon collision
            speedMultiplier = Math.max(1.0, speedMultiplier - 0.3);
            updateHUD();

            if (shield <= 0) {
                endGame("Your shield was completely destroyed!");
            }
        }

        function grantGateReward() {
            shield = Math.min(maxShield, shield + 15); // Restore shield
            speedMultiplier += 0.15; // Speed boost reward
            distanceRun += 50; // Extra score points
            updateHUD();
        }

        function updateHUD() {
            scoreText.textContent = `${Math.floor(distanceRun)}m`;
            speedText.textContent = `${speedMultiplier.toFixed(1)}x`;
            shieldBar.style.width = `${(shield / maxShield) * 100}%`;
        }

        function endGame(reason) {
            isRunning = false;
            gameOverReason.textContent = reason;
            finalScoreText.textContent = `${Math.floor(distanceRun)}m`;
            gameOverScreen.classList.remove('hidden');
            defOverlay.classList.remove('active');
        }

        // --- DRAWING BACKGROUND & PERSPECTIVE ---
        function drawEnvironment(speed, dt) {
            // Dynamic Horizon Line
            const horizonY = 200;
            const groundY = canvas.height - 75;

            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGradient.addColorStop(0, '#020617');
            skyGradient.addColorStop(1, '#0f172a');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, horizonY);

            // Ground gradient
            const groundGradient = ctx.createLinearGradient(0, horizonY, 0, canvas.height);
            groundGradient.addColorStop(0, '#1e1b4b');
            groundGradient.addColorStop(1, '#0f172a');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            // Draw Pseudo-3D Track Lines
            ctx.strokeStyle = '#4338ca';
            ctx.lineWidth = 2;

            // Outer edges & Middle Lane Divider
            const laneEdges = [-280, 0, 280];
            laneEdges.forEach(xOffset => {
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, horizonY);
                ctx.lineTo((canvas.width / 2) + xOffset, canvas.height);
                ctx.stroke();
            });

            // Animated Horizontal Grid Lines (Speed Illusion)
            groundOffset = (groundOffset + speed * dt * 0.5) % 40;
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.2)';
            for (let i = 0; i < 15; i++) {
                let lineZ = (i * 40 - groundOffset);
                if (lineZ <= 0) lineZ += 600;
                const scale = 300 / (300 + lineZ);
                const y = groundY - (groundY - horizonY) * (1 - scale);
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // --- MAIN GAME LOOP ---
        function gameLoop(timestamp) {
            if (!isRunning) return;

            const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Delta time cap
            lastTime = timestamp;

            // Progressive speed system: Base speed increases slowly over time
            speedMultiplier += 0.005 * dt;
            const currentSpeed = baseSpeed * speedMultiplier;

            // Track distance run
            distanceRun += (currentSpeed * dt) / 10;
            updateHUD();

            // Clear Screen & Render Background
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(currentSpeed, dt);

            // --- TIMERS & SPAWNING ---
            gateTimer += dt;
            obstacleTimer += dt;

            // Gate Spawner (Every 10 seconds)
            if (gateTimer >= GATE_INTERVAL && !activeGateStructure) {
                spawnGateStructure();
                gateTimer = 0;
            }

            // Ground Obstacle Spawner
            if (obstacleTimer >= OBSTACLE_INTERVAL / speedMultiplier) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            // --- UPDATE & RENDER OBSTACLES ---
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.update(dt, currentSpeed);
                obs.draw(ctx);

                // Collision detection with Ground Obstacles
                if (obs.z < 30 && obs.z > 0 && !obs.passed) {
                    if (player.lane === obs.lane && player.y < obs.height) {
                        obs.passed = true;
                        applyShieldDamage(25); // Crash into ground obstacle
                    }
                }

                // Cleanup passed obstacles
                if (obs.z <= 0) {
                    obstacles.splice(i, 1);
                }
            }

            // --- UPDATE & RENDER DEFINITION GATES ---
            if (activeGateStructure) {
                activeGateStructure.update(dt, currentSpeed);
                activeGateStructure.draw(ctx);

                // Gate Hit/Pass Detection
                if (activeGateStructure.z < 40 && !activeGateStructure.passed) {
                    activeGateStructure.passed = true;
                    
                    if (player.lane === activeGateStructure.correctLane) {
                        // Correct Gate Selected!
                        grantGateReward();
                    } else {
                        // Wrong Gate Selected!
                        applyShieldDamage(35);
                    }

                    // Hide overlay and reset structure reference
                    defOverlay.classList.remove('active');
                    setTimeout(() => { activeGateStructure = null; }, 500);
                }
            }

            // Update & Render Player
            player.update(dt);
            player.draw(ctx);

            requestAnimationFrame(gameLoop);
        }

        // --- CONTROLS / INPUT ---
        window.addEventListener('keydown', (e) => {
            if (!isRunning) return;

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                player.jump();
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                player.moveLeft();
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                player.moveRight();
            }
        });

        // Event Listeners for UI
        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            init();
            isRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            init();
            isRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
