<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Galaga - Intercept Shield</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #050510;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
    border: 2px solid #00ffcc;
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #000;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 5px #000;
    pointer-events: none;
  }
  #def-box {
    position: absolute;
    top: 45px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 20, 40, 0.85);
    border: 1px solid #00e1ff;
    padding: 10px 20px;
    border-radius: 5px;
    text-align: center;
    max-width: 80%;
    font-size: 16px;
    box-shadow: 0 0 10px rgba(0, 225, 255, 0.4);
    pointer-events: none;
  }
  #game-over {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    display: none;
  }
  #game-over h1 { color: #ff3366; margin-bottom: 10px; }
  #restart-btn {
    padding: 10px 20px;
    background: #00ffcc;
    border: none;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    font-size: 16px;
  }
  #restart-btn:hover { background: #00cca3; }
</style>
</head>
<body>

<div id="game-container">
  <div id="ui">
    <div id="score">SCORE: 0</div>
    <div id="lives">LIVES: ❤️❤️❤️</div>
  </div>
  <div id="def-box">Target Definition Loading...</div>
  <canvas id="canvas" width="800" height="600"></canvas>
  <div id="game-over">
    <h1 id="go-title">GAME OVER</h1>
    <p id="go-score">Final Score: 0</p>
    <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
  </div>
</div>

<script>
const vocabData = [
  { word: "disqualify", def: "To declare someone ineligible due to an offense or failure to meet rules." },
  { word: "revise", def: "To alter, edit, or improve a written text or plan." },
  { word: "aerospace", def: "The branch of technology and industry concerned with aviation and spaceflight." },
  { word: "surgeon", def: "A medical practitioner qualified to practice surgery." },
  { word: "candidate", def: "A person who applies for or is nominated for a position or award." },
  { word: "applicant", def: "A person who formally applies for something, such as a job." },
  { word: "launch", def: "To set in motion, send off, or initiate a rocket, vessel, or project." },
  { word: "qualify", def: "To meet the necessary conditions or requirements for a position or task." },
  { word: "amend", def: "To make minor changes to a text in order to make it fairer or more accurate." },
  { word: "orbit", def: "The curved path of a celestial object or spacecraft around a star or planet." }
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const defBox = document.getElementById('def-box');
const gameOverEl = document.getElementById('game-over');

let score = 0;
let lives = 3;
let gameOver = false;

// Input Handling
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Player Ship
const player = {
  x: canvas.width / 2 - 20,
  y: canvas.height - 50,
  width: 40,
  height: 30,
  speed: 6,
  vx: 0,
  cooldown: 0
};

// Game Entities
let bullets = [];
let aliens = [];
let currentTarget = null;

class Bullet {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 4;
    this.speed = 8;
  }
  update() {
    this.y -= this.speed;
  }
  draw() {
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Alien {
  constructor(x, y, word, isTarget) {
    this.startX = x;
    this.startY = y;
    this.x = x;
    this.y = y;
    this.width = 110;
    this.height = 40;
    this.word = word;
    this.isTarget = isTarget;
    this.isDiveBombing = false;
    this.vx = 0;
    this.vy = 0;
  }

  triggerDiveBomb() {
    this.isDiveBombing = true;
    const dx = (player.x + player.width/2) - (this.x + this.width/2);
    const dy = player.y - this.y;
    const angle = Math.atan2(dy, dx);
    this.vx = Math.cos(angle) * 6;
    this.vy = Math.sin(angle) * 6;
  }

  update() {
    if (this.isDiveBombing) {
      this.x += this.vx;
      this.y += this.vy;
    } else {
      // Gentle floating animation
      this.x = this.startX + Math.sin(Date.now() / 400) * 15;
    }
  }

  draw() {
    ctx.fillStyle = this.isDiveBombing ? '#ff3366' : '#1e295d';
    ctx.strokeStyle = '#00e1ff';
    ctx.lineWidth = 2;
    
    // Draw Alien Hull
    ctx.beginPath();
    ctx.roundRect(this.x, this.y, this.width, this.height, 8);
    ctx.fill();
    ctx.stroke();

    // Draw Word
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(this.word, this.x + this.width / 2, this.y + this.height / 2 + 5);
  }
}

function spawnWave() {
  aliens = [];
  // Pick random target word
  const targetObj = vocabData[Math.floor(Math.random() * vocabData.length)];
  currentTarget = targetObj;
  defBox.innerText = `TARGET: "${targetObj.def}"`;

  // Get 3 incorrect words
  let pool = vocabData.filter(v => v.word !== targetObj.word);
  pool.sort(() => 0.5 - Math.random());
  let choices = [targetObj.word, pool[0].word, pool[1].word, pool[2].word];
  choices.sort(() => 0.5 - Math.random()); // Shuffle positions

  const spacing = canvas.width / 4;
  choices.forEach((word, index) => {
    const x = spacing * index + (spacing - 110) / 2;
    const y = 110;
    aliens.push(new Alien(x, y, word, word === targetObj.word));
  });
}

function update() {
  if (gameOver) return;

  // Player physics
  if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
  if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += player.speed;

  // Player shooting
  if (player.cooldown > 0) player.cooldown--;
  if (keys['Space'] && player.cooldown === 0) {
    bullets.push(new Bullet(player.x + player.width / 2, player.y));
    player.cooldown = 15;
  }

  // Update bullets
  bullets.forEach((bullet, index) => {
    bullet.update();
    if (bullet.y < 0) bullets.splice(index, 1);
  });

  // Update aliens & collision detection
  aliens.forEach((alien, aIdx) => {
    alien.update();

    // Check Bullet collisions
    bullets.forEach((bullet, bIdx) => {
      if (
        bullet.x > alien.x &&
        bullet.x < alien.x + alien.width &&
        bullet.y > alien.y &&
        bullet.y < alien.y + alien.height
      ) {
        bullets.splice(bIdx, 1);
        
        if (alien.isTarget) {
          score += 100;
          scoreEl.innerText = `SCORE: ${score}`;
          spawnWave();
        } else {
          if (!alien.isDiveBombing) {
            alien.triggerDiveBomb();
          }
        }
      }
    });

    // Check Alien-Player Collision or Offscreen
    if (
      alien.isDiveBombing &&
      alien.x < player.x + player.width &&
      alien.x + alien.width > player.x &&
      alien.y < player.y + player.height &&
      alien.y + alien.height > player.y
    ) {
      takeDamage();
      aliens.splice(aIdx, 1);
    } else if (alien.y > canvas.height) {
      aliens.splice(aIdx, 1);
    }
  });

  // Respawn wave if all aliens cleared
  if (aliens.length === 0) spawnWave();
}

function takeDamage() {
  lives--;
  livesEl.innerText = `LIVES: ${'❤️'.repeat(lives)}`;
  if (lives <= 0) {
    gameOver = true;
    gameOverEl.style.display = 'flex';
    document.getElementById('go-score').innerText = `Final Score: ${score}`;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Stars Background
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  for (let i = 0; i < 20; i++) {
    ctx.fillRect((i * 43) % canvas.width, (i * 73 + Date.now() / 20) % canvas.height, 2, 2);
  }

  // Draw Player Ship
  ctx.fillStyle = '#00ffcc';
  ctx.beginPath();
  ctx.moveTo(player.x + player.width / 2, player.y);
  ctx.lineTo(player.x, player.y + player.height);
  ctx.lineTo(player.x + player.width, player.y + player.height);
  ctx.closePath();
  ctx.fill();

  // Draw Entities
  bullets.forEach(b => b.draw());
  aliens.forEach(a => a.draw());
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function resetGame() {
  score = 0;
  lives = 3;
  gameOver = false;
  scoreEl.innerText = `SCORE: ${score}`;
  livesEl.innerText = `LIVES: ❤️❤️❤️`;
  gameOverEl.style.display = 'none';
  spawnWave();
}

// Start Game
spawnWave();
gameLoop();
</script>
</body>
</html>
