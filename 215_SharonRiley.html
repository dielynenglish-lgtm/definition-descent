<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk Snake: Definition Hunt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0f18;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #ui-container {
      width: 800px;
      background: #16192b;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 15px #00ffcc;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ff007f;
      margin-bottom: 10px;
    }
    #definition-box {
      font-size: 1.2rem;
      color: #ffff00;
      background: #090a10;
      padding: 10px;
      border: 1px dashed #ff007f;
      border-radius: 4px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas-container {
      position: relative;
    }
    canvas {
      background-color: #050608;
      border: 3px solid #ff007f;
      box-shadow: 0 0 20px #ff007f;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 800px;
      height: 600px;
      background: rgba(13, 15, 24, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00ffcc;
    }
    #overlay h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #ff007f;
      text-shadow: 0 0 10px #ff007f;
    }
    #overlay button {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 12px 25px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffcc;
      border-radius: 4px;
      transition: 0.2s;
    }
    #overlay button:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 15px #ff007f;
    }
    #status-msg {
      height: 20px;
      color: #ff3333;
      font-weight: bold;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="stats">
      <span>SCORE: <span id="score">0</span></span>
      <span id="status-msg"></span>
      <span>TAIL LENGTH: <span id="length">3</span></span>
    </div>
    <div id="definition-box">
      Target Definition: <span id="definition-text" style="margin-left: 8px;">Loading...</span>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">CYBERPUNK SNAKE</h1>
      <p style="margin-bottom: 20px; font-size: 1.1rem; color: #fff;">Use Arrow Keys to move. Collect the word matching the definition above!</p>
      <button id="start-btn" onclick="startGame()">START GAME</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 40; // 20x15 grid on 800x600 canvas
    const TILE_COUNT_X = canvas.width / GRID_SIZE;
    const TILE_COUNT_Y = canvas.height / GRID_SIZE;

    // Vocabulary Dataset (Grade 11 Words)
    const vocabulary = [
      { word: "miraculous", def: "Occurring like a wonder, highly unexpected or extraordinary." },
      { word: "massive", def: "Large and heavy or solid; exceptionally grand or large." },
      { word: "comity", def: "An atmosphere of social harmony, mutual respect, and civility." },
      { word: "physicians", def: "Qualified medical doctors who practice medicine." },
      { word: "dose", def: "A measured quantity of a medicine or agent given at one time." },
      { word: "established", def: "Having been in existence for a long time; recognized and accepted." },
      { word: "undergo", def: "To experience, endure, or be subjected to something." }
    ];

    let snake = [];
    let dx = GRID_SIZE;
    let dy = 0;
    let score = 0;
    let currentTarget = null;
    let pellets = [];
    let isControlsLocked = false;
    let gameInterval = null;
    let gameRunning = false;

    function startGame() {
      snake = [
        { x: 5 * GRID_SIZE, y: 7 * GRID_SIZE },
        { x: 4 * GRID_SIZE, y: 7 * GRID_SIZE },
        { x: 3 * GRID_SIZE, y: 7 * GRID_SIZE }
      ];
      dx = GRID_SIZE;
      dy = 0;
      score = 0;
      isControlsLocked = false;
      document.getElementById('score').innerText = score;
      document.getElementById('length').innerText = snake.length;
      document.getElementById('status-msg').innerText = "";
      document.getElementById('overlay').style.display = 'none';

      generateRound();
      
      if (gameInterval) clearInterval(gameInterval);
      gameRunning = true;
      gameInterval = setInterval(gameLoop, 130);
    }

    function generateRound() {
      // Choose random target word
      const targetIndex = Math.floor(Math.random() * vocabulary.length);
      currentTarget = vocabulary[targetIndex];
      document.getElementById('definition-text').innerText = `"${currentTarget.def}"`;

      // Select 2 distractors
      let distractors = vocabulary.filter(v => v.word !== currentTarget.word);
      distractors = distractors.sort(() => 0.5 - Math.random()).slice(0, 2);

      const roundWords = [
        { word: currentTarget.word, isCorrect: true },
        { word: distractors[0].word, isCorrect: false },
        { word: distractors[1].word, isCorrect: false }
      ].sort(() => 0.5 - Math.random());

      // Place pellets on unique empty spots
      pellets = [];
      for (let item of roundWords) {
        let spot;
        let collision;
        do {
          collision = false;
          spot = {
            x: Math.floor(Math.random() * TILE_COUNT_X) * GRID_SIZE,
            y: Math.floor(Math.random() * TILE_COUNT_Y) * GRID_SIZE
          };
          
          // Check snake collision
          for (let seg of snake) {
            if (seg.x === spot.x && seg.y === spot.y) collision = true;
          }
          // Check other pellets collision
          for (let p of pellets) {
            if (p.x === spot.x && p.y === spot.y) collision = true;
          }
        } while (collision);

        pellets.push({
          x: spot.x,
          y: spot.y,
          word: item.word,
          isCorrect: item.isCorrect
        });
      }
    }

    function gameLoop() {
      if (!gameRunning) return;

      moveSnake();
      if (checkCollisions()) return;
      checkPelletEating();
      draw();
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);
      snake.pop(); // Remove tail unless eaten
    }

    function checkCollisions() {
      const head = snake[0];

      // Wall collision
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        gameOver("CRASHED INTO WALL!");
        return true;
      }

      // Self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver("SELF-COLLISION DETECTED!");
          return true;
        }
      }
      return false;
    }

    function checkPelletEating() {
      const head = snake[0];

      for (let i = 0; i < pellets.length; i++) {
        let p = pellets[i];
        if (head.x === p.x && head.y === p.y) {
          if (p.isCorrect) {
            // Correct Pellet: Extend snake, boost score
            score += 100;
            document.getElementById('score').innerText = score;
            // Add segment
            const tailEnd = snake[snake.length - 1];
            snake.push({ x: tailEnd.x, y: tailEnd.y });
            document.getElementById('length').innerText = snake.length;
            
            document.getElementById('status-msg').style.color = '#00ffcc';
            document.getElementById('status-msg').innerText = "CORRECT WORD!";
            generateRound();
          } else {
            // Poison Pellet: Chop off 2 segments & Lock controls 1.5s
            document.getElementById('status-msg').style.color = '#ff3333';
            document.getElementById('status-msg').innerText = "POISON! CONTROLS LOCKED!";
            
            // Remove 2 segments if possible
            if (snake.length > 2) snake.pop();
            if (snake.length > 2) snake.pop();
            document.getElementById('length').innerText = snake.length;

            // Lock controls
            isControlsLocked = true;
            setTimeout(() => {
              isControlsLocked = false;
              document.getElementById('status-msg').innerText = "";
            }, 1500);

            // Refresh pellets for safety
            generateRound();
          }
          break;
        }
      }
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(0, 255, 204, 0.05)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function draw() {
      // Clear screen
      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();

      // Draw Snake
      snake.forEach((seg, index) => {
        ctx.fillStyle = index === 0 ? '#00ffcc' : '#ff007f';
        ctx.shadowBlur = 10;
        ctx.shadowColor = index === 0 ? '#00ffcc' : '#ff007f';
        ctx.fillRect(seg.x + 1, seg.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });
      ctx.shadowBlur = 0; // reset glow

      // Draw Pellets
      pellets.forEach(p => {
        ctx.fillStyle = '#16192b';
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2;
        ctx.fillRect(p.x + 2, p.y + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        ctx.strokeRect(p.x + 2, p.y + 2, GRID_SIZE - 4, GRID_SIZE - 4);

        // Draw Text inside pellet
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.word.substring(0, 7), p.x + GRID_SIZE / 2, p.y + GRID_SIZE / 2);
      });
    }

    function gameOver(reason) {
      gameRunning = false;
      clearInterval(gameInterval);
      document.getElementById('overlay-title').innerText = "SYSTEM FAILURE";
      document.getElementById('status-msg').innerText = reason;
      document.getElementById('start-btn').innerText = "REBOOT SYSTEM";
      document.getElementById('overlay').style.display = 'flex';
    }

    // Keyboard controls
    window.addEventListener('keydown', e => {
      if (!gameRunning || isControlsLocked) return;

      if (e.key === 'ArrowUp' && dy === 0) {
        dx = 0; dy = -GRID_SIZE;
      } else if (e.key === 'ArrowDown' && dy === 0) {
        dx = 0; dy = GRID_SIZE;
      } else if (e.key === 'ArrowLeft' && dx === 0) {
        dx = -GRID_SIZE; dy = 0;
      } else if (e.key === 'ArrowRight' && dx === 0) {
        dx = GRID_SIZE; dy = 0;
      }
    });
  </script>
</body>
</html>
