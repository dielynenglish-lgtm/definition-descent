<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hidden Vault: Mystery Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0b0f19;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 90%;
            max-width: 600px;
            background: #111827;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .vault-wrapper {
            margin: 25px 0;
            perspective: 1000px;
        }

        .vault-door {
            width: 150px;
            height: 150px;
            background: #1f2937;
            border: 8px solid #4b5563;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px #000;
            transition: transform 0.8s ease-in-out, border-color 0.3s;
        }

        .vault-handle {
            width: 22px;
            height: 85px;
            background: #9ca3af;
            border-radius: 4px;
            transform: rotate(45deg);
        }

        /* Vault Visual Effects */
        .open-vault {
            transform: rotateY(-110deg);
            border-color: #10b981;
        }

        .shake-vault {
            animation: shake 0.4s;
            border-color: #ef4444;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .clue-box {
            background: #1e293b;
            border: 1px dashed #00ffcc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            color: #f3f4f6;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn {
            background: #1f2937;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #00ffcc;
            color: #111827;
        }

        .feedback {
            height: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(17, 24, 39, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            border-radius: 10px;
            z-index: 10;
        }

        .overlay h1 {
            color: #00ffcc;
            margin-bottom: 15px;
        }

        .overlay p {
            color: #d1d5db;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Start Mission Overlay -->
        <div id="start-overlay" class="overlay">
            <h1>THE HIDDEN VAULT</h1>
            <p>Welcome, Agent! Match the correct vocabulary word to each displayed definition. Unlock vault doors to gain +10 points before the 70-second countdown runs out!</p>
            <button class="btn" onclick="startGame()">START MISSION</button>
        </div>

        <!-- Mission Completed Overlay -->
        <div id="end-overlay" class="overlay hidden">
            <h1 id="end-title">MISSION COMPLETED</h1>
            <p>Your Final Score: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">TRY AGAIN</button>
        </div>

        <!-- Active Game UI -->
        <div class="header">
            <div>SCORE: <span id="score">0</span></div>
            <div>TIME: <span id="timer">70</span>s</div>
        </div>

        <div class="vault-wrapper">
            <div id="vault-door" class="vault-door">
                <div class="vault-handle"></div>
            </div>
        </div>

        <div id="clue" class="clue-box">Loading clue...</div>
        <div id="feedback" class="feedback"></div>
        <div id="options" class="options-grid"></div>
    </div>

    <script>
        const vocabList = [
            {
                word: "disqualify",
                definition: "To declare someone ineligible or unfit for a position, contest, or activity due to an offense or failure.",
                choices: ["disqualify", "revise", "candidate", "applicant"]
            },
            {
                word: "revise",
                definition: "To re-examine and alter, edit, or improve text, plans, or ideas.",
                choices: ["revise", "aerospace", "surgeon", "disqualify"]
            },
            {
                word: "aerospace",
                definition: "The branch of technology and industry concerned with aviation and spaceflight.",
                choices: ["aerospace", "surgeon", "applicant", "candidate"]
            },
            {
                word: "surgeon",
                definition: "A medical doctor qualified to practice and perform operative procedures.",
                choices: ["surgeon", "candidate", "revise", "aerospace"]
            },
            {
                word: "candidate",
                definition: "A person who applies for or is nominated for an office, position, or honor.",
                choices: ["candidate", "applicant", "disqualify", "surgeon"]
            },
            {
                word: "applicant",
                definition: "A person who makes a formal request for something, such as a job or university admission.",
                choices: ["applicant", "candidate", "revise", "aerospace"]
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 70;
        let timerInterval = null;

        function startGame() {
            score = 0;
            timeLeft = 70;
            currentQuestion = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('timer').textContent = timeLeft;
            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('end-overlay').classList.add('hidden');

            vocabList.sort(() => Math.random() - 0.5);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame("TIME EXPIRED");
                }
            }, 1000);

            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= vocabList.length) {
                currentQuestion = 0;
                vocabList.sort(() => Math.random() - 0.5);
            }

            const q = vocabList[currentQuestion];
            document.getElementById('clue').textContent = q.definition;
            document.getElementById('feedback').textContent = '';

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            const shuffledChoices = [...q.choices].sort(() => Math.random() - 0.5);

            shuffledChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = choice;
                btn.onclick = () => checkAnswer(choice, q.word);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            const vault = document.getElementById('vault-door');
            const feedback = document.getElementById('feedback');

            if (selected === correct) {
                score += 10;
                document.getElementById('score').textContent = score;
                feedback.textContent = "ACCESS GRANTED! (+10)";
                feedback.style.color = "#10b981";

                vault.classList.add('open-vault');
                setTimeout(() => {
                    vault.classList.remove('open-vault');
                    currentQuestion++;
                    loadQuestion();
                }, 800);
            } else {
                feedback.textContent = "ACCESS DENIED!";
                feedback.style.color = "#ef4444";

                vault.classList.add('shake-vault');
                setTimeout(() => {
                    vault.classList.remove('shake-vault');
                }, 400);
            }
        }

        function endGame(title) {
            clearInterval(timerInterval);
            document.getElementById('end-title').textContent = title;
            document.getElementById('final-score').textContent = score;
            document.getElementById('end-overlay').classList.remove('hidden');
        }
    </script>
</body>
</html>
