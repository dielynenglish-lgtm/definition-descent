<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Diner</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2c3e50;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #e74c3c;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        #diner-floor {
            background-color: #ecf0f1;
            height: 350px;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            position: relative;
            border-bottom: 4px solid #bdc3c7;
        }

        .customer {
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: fadeIn 0.5s ease-in;
        }

        .speech-bubble {
            background: #ffffff;
            border: 2px solid #34495e;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            width: 100%;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        .patience-bar-container {
            width: 100%;
            height: 8px;
            background-color: #ddd;
            border-radius: 4px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .patience-bar {
            height: 100%;
            width: 100%;
            background-color: #2ecc71;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .customer-avatar {
            font-size: 3rem;
        }

        #kitchen-tray {
            background-color: #34495e;
            padding: 20px;
            text-align: center;
        }

        #kitchen-tray h2 {
            color: #ecf0f1;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .dishes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .dish-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 8px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 0 #d35400;
        }

        .dish-btn:hover {
            background-color: #f39c12;
        }

        .dish-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #game-over-screen h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        #restart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        #restart-btn:hover {
            background-color: #27ae60;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <h1>🍔 Vocabulary Diner</h1>
            <div class="stats">
                <div>Score: <span id="score">0</span></div>
                <div>Lives: <span id="lives">3</span></div>
            </div>
        </header>

        <div id="diner-floor">
            <!-- Customers will spawn here -->
            <div id="game-over-screen">
                <h2>Game Over!</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn" onclick="startGame()">Play Again</button>
            </div>
        </div>

        <div id="kitchen-tray">
            <h2>Serving Tray (Click a Vocabulary Dish to Serve):</h2>
            <div class="dishes-grid" id="dishes-grid">
                <!-- Buttons generated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        const vocabulary = [
            { word: "Encounter", def: "To unexpectedly experience or come face-to-face with something." },
            { word: "Feast", def: "A large, special meal with many delicious foods." },
            { word: "Merge", def: "To combine or join together into a single whole." },
            { word: "Distinct", def: "Clearly different, separate, or easily recognizable." },
            { word: "Endure", def: "To suffer through or withstand hardship patiently." },
            { word: "Reminder", def: "Something that helps you remember a thing or task." }
        ];

        const avatars = ["👵", "👨‍💼", "👧", "🧔", "👩‍🎨", "🧑‍🚀"];

        let score = 0;
        let lives = 3;
        let activeCustomers = [];
        let spawnInterval = null;
        let gameLoopInterval = null;
        const maxCustomers = 3;

        function startGame() {
            score = 0;
            lives = 3;
            activeCustomers = [];
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
            document.getElementById('game-over-screen').style.display = 'none';

            // Clear floor
            const floor = document.getElementById('diner-floor');
            const gameOverScreen = document.getElementById('game-over-screen');
            floor.innerHTML = '';
            floor.appendChild(gameOverScreen);

            renderTray();

            clearInterval(spawnInterval);
            clearInterval(gameLoopInterval);

            // Spawn customer every 4 seconds
            spawnInterval = setInterval(spawnCustomer, 4000);
            
            // Game update loop runs 10 times per second to drain patience
            gameLoopInterval = setInterval(updateGame, 100);

            // Spawn first customer right away
            spawnCustomer();
        }

        function renderTray() {
            const grid = document.getElementById('dishes-grid');
            grid.innerHTML = '';
            vocabulary.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'dish-btn';
                btn.innerText = item.word;
                btn.onclick = () => serveDish(item.word);
                grid.appendChild(btn);
            });
        }

        function spawnCustomer() {
            if (activeCustomers.length >= maxCustomers) return;

            // Pick random word definition
            const randomVocab = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            const randomAvatar = avatars[Math.floor(Math.random() * avatars.length)];

            const customer = {
                id: Date.now(),
                word: randomVocab.word,
                definition: randomVocab.def,
                patience: 100, // percentage
                avatar: randomAvatar
            };

            activeCustomers.push(customer);
            renderCustomers();
        }

        function renderCustomers() {
            const floor = document.getElementById('diner-floor');
            // Remove current customers elements (keep game over screen)
            const custElements = floor.querySelectorAll('.customer');
            custElements.forEach(el => el.remove());

            activeCustomers.forEach(cust => {
                const custEl = document.createElement('div');
                custEl.className = 'customer';
                custEl.id = `cust-${cust.id}`;

                custEl.innerHTML = `
                    <div class="speech-bubble">${cust.definition}</div>
                    <div class="patience-bar-container">
                        <div class="patience-bar" id="bar-${cust.id}" style="width: ${cust.patience}%"></div>
                    </div>
                    <div class="customer-avatar">${cust.avatar}</div>
                `;

                floor.appendChild(custEl);
            });
        }

        function updateGame() {
            for (let i = activeCustomers.length - 1; i >= 0; i--) {
                const cust = activeCustomers[i];
                cust.patience -= 0.8; // Decrement patience

                const bar = document.getElementById(`bar-${cust.id}`);
                if (bar) {
                    bar.style.width = cust.patience + '%';
                    if (cust.patience < 30) {
                        bar.style.backgroundColor = '#e74c3c'; // Red
                    } else if (cust.patience < 60) {
                        bar.style.backgroundColor = '#f1c40f'; // Yellow
                    }
                }

                // If customer leaves unsatisfied
                if (cust.patience <= 0) {
                    activeCustomers.splice(i, 1);
                    loseLife();
                    renderCustomers();
                }
            }
        }

        function serveDish(selectedWord) {
            if (activeCustomers.length === 0) return;

            // Match selected word with the oldest customer needing that word
            const matchIndex = activeCustomers.findIndex(c => c.word === selectedWord);

            if (matchIndex !== -1) {
                // Correct match!
                score += 100;
                document.getElementById('score').innerText = score;
                activeCustomers.splice(matchIndex, 1);
                renderCustomers();
            } else {
                // Wrong dish served!
                loseLife();
            }
        }

        function loseLife() {
            lives--;
            document.getElementById('lives').innerText = lives;
            if (lives <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            clearInterval(spawnInterval);
            clearInterval(gameLoopInterval);
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        // Start game on load
        window.onload = startGame;
    </script>
</body>
</html>
