<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Galaga: Intercept Shield</title>
    <style>
        body {
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            text-align: center;
        }

        #definition-box {
            width: 780px;
            background: rgba(20, 30, 60, 0.8);
            border: 2px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #e0f7fc;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: radial-gradient(circle at center, #0b0d21 0%, #020308 100%);
            border: 2px solid #334477;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
        }

        #ui-bar {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-top: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .heart {
            color: #ff3366;
            font-size: 22px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="definition-box">Target Definition Loading...</div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="ui-bar">
        <div>SCORE: <span id="score">0</span></div>
        <div>LIVES: <span id="lives"><span class="heart">♥ ♥ ♥</span></span></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const definitionBox = document.getElementById('definition-box');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

// Vocabulary Database
const vocabList = [
    { word: "luxurious", def: "Extremely comfortable, elegant, or enjoyable, especially in a way that involves great expense." },
    { word: "innovation", def: "A new method, idea, product, or a new way of doing something." },
    { word: "surgery", def: "Medical treatment involving an operation to repair or remove damaged parts of the body." },
    { word: "terrifying", def: "Causing extreme fear or terror." },
    { word: "physically", def: "In a manner relating to the body rather than the mind." },
    { word: "procedure", def: "An established or official way of doing something, or a series of actions conducted in a certain order." },
    { word: "agony", def: "Extreme physical or mental suffering." }
];

// Game State
let score = 0;
let lives = 3;
let gameOver = false;
let currentQuestion = null;
let aliens = [];
let bullets = [];

// Controls
const keys = { Left: false, Right: false, Space: false };

document.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft') keys.Left = true;
    if (e.code === 'ArrowRight') keys.Right = true;
    if (e.code === 'Space') {
        if (!keys.Space && !gameOver) {
            player.shoot();
        }
        keys.Space = true;
    }
    if (gameOver && e.code === 'KeyR') resetGame();
});

document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft') keys.Left = false;
    if (e.code === 'ArrowRight') keys.Right = false;
    if (e.code === 'Space') keys.Space = false;
});

// Player Object
const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 40,
    width: 40,
    height: 25,
    speed: 7,
    draw() {
        ctx.fillStyle = '#00d2ff';
        ctx.beginPath();
        ctx.moveTo(this.x + this.width / 2, this.y);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.closePath();
        ctx.fill();
        
        // Thruster glow
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(this.x + 15, this.y + this.height, 10, 5);
    },
    update() {
        if (keys.Left && this.x > 0) this.x -= this.speed;
        if (keys.Right && this.x < canvas.width - this.width) this.x += this.speed;
    },
    shoot() {
        bullets.push({
            x: this.x + this.width / 2 - 3,
            y: this.y,
            width: 6,
            height: 12,
            speed: 9
        });
    }
};

// Alien Class
class Alien {
    constructor(x, y, word, isCorrect) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.width = 150;
        this.height = 40;
        this.word = word;
        this.isCorrect = isCorrect;
        this.isDiving = false;
        this.vx = 0;
        this.vy = 0;
        this.color = '#aa44ff';
    }

    draw() {
        // Alien Hull
        ctx.fillStyle = this.isDiving ? '#ff3333' : this.color;
        ctx.beginPath();
        ctx.roundRect(this.x, this.y, this.width, this.height, 8);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(this.word, this.x + this.width / 2, this.y + 25);
    }

    startDive() {
        if (!this.isDiving) {
            this.isDiving = true;
            this.vy = 3;
            // Aim towards player initial position
            let dx = (player.x + player.width / 2) - (this.x + this.width / 2);
            this.vx = dx / 60;
        }
    }

    update() {
        if (this.isDiving) {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.1; // Smooth acceleration downward

            // Check collision with player
            if (
                this.x < player.x + player.width &&
                this.x + this.width > player.x &&
                this.y < player.y + player.height &&
                this.y + this.height > player.y
            ) {
                loseLife();
                this.resetPosition();
            }

            // Reset if off bottom of screen
            if (this.y > canvas.height) {
                this.resetPosition();
            }
        }
    }

    resetPosition() {
        this.isDiving = false;
        this.x = this.startX;
        this.y = this.startY;
        this.vx = 0;
        this.vy = 0;
    }
}

function spawnWave() {
    aliens = [];
    bullets = [];
    
    // Pick random target word
    const targetIndex = Math.floor(Math.random() * vocabList.length);
    currentQuestion = vocabList[targetIndex];
    definitionBox.textContent = `TARGET DEFINITION: "${currentQuestion.def}"`;

    // Select 3 incorrect distractor words
    let choices = [currentQuestion.word];
    let otherWords = vocabList.map(v => v.word).filter(w => w !== currentQuestion.word);
    
    // Shuffle distractors
    otherWords.sort(() => 0.5 - Math.random());
    choices.push(...otherWords.slice(0, 3));
    
    // Shuffle final choices
    choices.sort(() => 0.5 - Math.random());

    // Create 4 Aliens spaced evenly
    const spacing = 190;
    const startX = 25;
    for (let i = 0; i < 4; i++) {
        let isCorrect = (choices[i] === currentQuestion.word);
        aliens.push(new Alien(startX + i * spacing, 50, choices[i], isCorrect));
    }
}

function loseLife() {
    lives--;
    updateLivesUI();
    if (lives <= 0) {
        gameOver = true;
    }
}

function updateLivesUI() {
    let hearts = '';
    for (let i = 0; i < lives; i++) hearts += '♥ ';
    livesEl.innerHTML = `<span class="heart">${hearts}</span>`;
}

function handleCollisions() {
    for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
        let b = bullets[bIndex];
        for (let aIndex = 0; aIndex < aliens.length; aIndex++) {
            let a = aliens[aIndex];

            if (
                b.x < a.x + a.width &&
                b.x + b.width > a.x &&
                b.y < a.y + a.height &&
                b.y + b.height > a.y
            ) {
                // Bullet hit alien
                bullets.splice(bIndex, 1);

                if (a.isCorrect) {
                    score += 100;
                    scoreEl.textContent = score;
                    spawnWave();
                } else {
                    a.startDive();
                }
                break;
            }
        }
    }
}

function resetGame() {
    score = 0;
    lives = 3;
    gameOver = false;
    scoreEl.textContent = score;
    updateLivesUI();
    spawnWave();
    gameLoop();
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        // Update
        player.update();
        
        // Update Bullets
        bullets.forEach((b, index) => {
            b.y -= b.speed;
            if (b.y < 0) bullets.splice(index, 1);
        });

        // Update Aliens
        aliens.forEach(a => a.update());

        handleCollisions();

        // Draw
        player.draw();
        bullets.forEach(b => {
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(b.x, b.y, b.width, b.height);
        });
        aliens.forEach(a => a.draw());

        requestAnimationFrame(gameLoop);
    } else {
        // Game Over Screen
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff3366';
        ctx.font = 'bold 40px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText("DEFENSE SHIELDS FAILED!", canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ffffff';
        ctx.font = '20px Segoe UI';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText("Press 'R' to Restart Mission", canvas.width / 2, canvas.height / 2 + 60);
    }
}

// Start Game
spawnWave();
gameLoop();
</script>

</body>
</html>
