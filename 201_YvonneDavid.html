<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intergalactic Vocab-Defender: Grade 11</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050515;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 800px;
            height: 600px;
            background: radial-gradient(circle at center, #111133 0%, #02020a 100%);
            border: 3px solid #00d2ff;
            box-shadow: 0 0 20px #00d2ff88;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid #00d2ff44;
            z-index: 10;
        }
        .hud-item {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #score { color: #00ffcc; }
        #timer { color: #ffcc00; }
        #mission-briefing {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid #00d2ff;
            padding: 15px;
            margin: 10px 20px;
            border-radius: 5px;
            text-align: center;
            z-index: 10;
        }
        #mission-briefing h3 {
            color: #00d2ff;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        #target-definition {
            font-size: 18px;
            color: #ffffff;
            font-weight: 600;
        }
        #space-area {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }
        .ship-target {
            position: absolute;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff007f;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff007faa;
            transition: transform 0.1s;
            user-select: none;
        }
        .ship-target:hover {
            transform: scale(1.1);
            background: rgba(255, 0, 127, 0.3);
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 21, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 36px;
            color: #00d2ff;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00d2ff;
        }
        #overlay p {
            font-size: 18px;
            margin-bottom: 25px;
            max-width: 600px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #00d2ff, #0072ff);
            border: none;
            padding: 12px 30px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #00d2ff88;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00d2ffbb;
        }
        .shake {
            animation: shake 0.3s;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div class="hud-item" id="score">SCORE: 0</div>
            <div class="hud-item" id="timer">WARP DRIVE: 60s</div>
        </div>

        <div id="mission-briefing">
            <h3>Mission Briefing - Target Definition:</h3>
            <div id="target-definition">Loading target coordinates...</div>
        </div>

        <div id="space-area"></div>

        <div id="overlay">
            <h1 id="overlay-title">INTERGALACTIC VOCAB-DEFENDER</h1>
            <p id="overlay-msg">Command your starship to defend Earth from alien word-ships! Match the correct word to the target definition. Be careful: wrong targets will cause system stalls!</p>
            <button class="btn" id="start-btn" onclick="startGame()">ENGAGE MISSION</button>
        </div>
    </div>

    <script>
        const vocabData = [
            { word: "luxurious", def: "Extremely comfortable, elegant, or enjoyable, especially in a way that involves great expense." },
            { word: "innovation", def: "A new method, idea, product, or feature that introduces practical improvements." },
            { word: "surgery", def: "A medical specialty treating diseases or injuries through manual or instrumental operations." },
            { word: "terrifying", def: "Causing extreme fear, dread, or intense anxiety." },
            { word: "physically", def: "Relating to the body rather than the mind or spirit." },
            { word: "procedure", def: "An established or official way of doing something, especially a series of actions." },
            { word: "agony", def: "Extreme physical or mental suffering and prolonged distress." }
        ];

        let score = 0;
        let timeRemaining = 60;
        let gameInterval = null;
        let timerInterval = null;
        let currentTarget = null;
        let laserLocked = false;

        const spaceArea = document.getElementById("space-area");
        const scoreDisplay = document.getElementById("score");
        const timerDisplay = document.getElementById("timer");
        const definitionDisplay = document.getElementById("target-definition");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlay-title");
        const overlayMsg = document.getElementById("overlay-msg");
        const container = document.getElementById("game-container");

        function startGame() {
            score = 0;
            timeRemaining = 60;
            laserLocked = false;
            scoreDisplay.textContent = `SCORE: ${score}`;
            timerDisplay.textContent = `WARP DRIVE: ${timeRemaining}s`;
            overlay.style.display = "none";

            nextRound();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                timerDisplay.textContent = `WARP DRIVE: ${timeRemaining}s`;
                if (timeRemaining <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function nextRound() {
            spaceArea.innerHTML = "";
            currentTarget = vocabData[Math.floor(Math.random() * vocabData.length)];
            definitionDisplay.textContent = `"${currentTarget.def}"`;

            let choices = [currentTarget];
            while (choices.length < Math.min(4, vocabData.length)) {
                let randomItem = vocabData[Math.floor(Math.random() * vocabData.length)];
                if (!choices.includes(randomItem)) {
                    choices.push(randomItem);
                }
            }
            
            // Shuffle choices
            choices.sort(() => Math.random() - 0.5);

            // Spawn ships
            choices.forEach((item, index) => {
                const ship = document.createElement("div");
                ship.className = "ship-target";
                ship.textContent = item.word.toUpperCase();
                
                // Position randomly
                const topPos = Math.random() * 250 + 20;
                const leftPos = (index * 180) + Math.random() * 40 + 20;
                
                ship.style.top = `${topPos}px`;
                ship.style.left = `${Math.min(leftPos, 620)}px`;

                ship.onclick = () => handleShipClick(item.word, ship);
                spaceArea.appendChild(ship);
            });
        }

        function handleShipClick(selectedWord, shipElement) {
            if (laserLocked) return;

            if (selectedWord === currentTarget.word) {
                score += 100;
                scoreDisplay.textContent = `SCORE: ${score}`;
                shipElement.style.background = "#00ffcc";
                shipElement.style.color = "#000";
                setTimeout(nextRound, 300);
            } else {
                score = Math.max(0, score - 50);
                scoreDisplay.textContent = `SCORE: ${score}`;
                container.classList.add("shake");
                laserLocked = true;
                definitionDisplay.textContent = "SYSTEM STALLED! LASERS RECHARGING...";
                
                setTimeout(() => {
                    container.classList.remove("shake");
                }, 300);

                setTimeout(() => {
                    laserLocked = false;
                    definitionDisplay.textContent = `"${currentTarget.def}"`;
                }, 2000);
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            spaceArea.innerHTML = "";
            overlay.style.display = "flex";
            overlayTitle.textContent = "MISSION COMPLETE";
            overlayMsg.innerHTML = `Your total score: <strong>${score} points</strong>!<br>Status: ${score >= 500 ? "Galactic Ace 🏆" : "Cadet Defender 🛡️"}`;
            document.getElementById("start-btn").textContent = "RE-ENGAGE MISSION";
        }
    </script>
</body>
</html>
