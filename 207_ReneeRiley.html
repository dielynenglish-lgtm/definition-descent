<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossword Arcade Frogger - Art & Architecture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    #game-container {
      width: 600px;
      background-color: #16213e;
      border: 4px solid #0f3460;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.6rem;
      color: #e94560;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    #stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 1.1rem;
      font-weight: bold;
      background: #0f3460;
      padding: 8px 15px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    #timer {
      color: #ff2e63;
    }

    #score {
      color: #00fff5;
    }

    #puzzle-box {
      background: #0f3460;
      border: 2px solid #e94560;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    #clue {
      font-size: 1rem;
      color: #eaeaea;
      margin-bottom: 5px;
    }

    #target-word-blank {
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 3px;
      color: #00fff5;
    }

    canvas {
      background-color: #0f0f1b;
      border: 3px solid #e94560;
      border-radius: 6px;
      display: block;
    }

    #controls-hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #a0a0a0;
      text-align: center;
    }

    /* Modal / Overlay */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      z-index: 10;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #e94560;
      margin-bottom: 15px;
    }

    #overlay p {
      font-size: 1.1rem;
      margin-bottom: 20px;
      text-align: center;
      max-width: 80%;
    }

    #start-btn {
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #e94560;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #start-btn:hover {
      background-color: #ff2e63;
    }

    .wrapper {
      position: relative;
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <h1>Crossword Arcade Frogger</h1>
  </header>

  <div id="stats-bar">
    <div>Time: <span id="timer">45</span>s</div>
    <div>Score: <span id="score">0</span></div>
  </div>

  <div id="puzzle-box">
    <div id="clue">Definition Clue...</div>
    <div id="target-word-blank">_ _ _ _ _</div>
  </div>

  <div class="wrapper">
    <canvas id="gameCanvas" width="560" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">ARCADE FROGGER</h2>
      <p id="overlay-msg">Hop across moving logs and cars to reach the top zone that solves the definition clue before time runs out!</p>
      <button id="start-btn" onclick="startGame()">START GAME</button>
    </div>
  </div>

  <div id="controls-hint">
    Use <strong>ARROW KEYS</strong> or <strong>WASD</strong> to move up, down, left, and right.
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // UI Elements
  const timerEl = document.getElementById('timer');
  const scoreEl = document.getElementById('score');
  const clueEl = document.getElementById('clue');
  const blankEl = document.getElementById('target-word-blank');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');

  // Vocabulary Data (10 Grade 11 Words)
  const vocabulary = [
    { word: "IMAGINATIVE", clue: "Having or showing creativity or original thought." },
    { word: "ARTISTIC", clue: "Having or showing natural creative skill or aesthetic feeling." },
    { word: "ATMOSPHERE", clue: "The pervading tone or mood of a place, situation, or creative work." },
    { word: "GALLERY", clue: "A room or building for the display or sale of works of art." },
    { word: "ARCHITECTURE", clue: "The art or practice of designing and constructing buildings." },
    { word: "PROFESSIONAL", clue: "Relating to or belonging to a profession; engaged in a specified activity as a main paid occupation." },
    { word: "AESTHETIC", clue: "Concerned with beauty or the appreciation of beauty." },
    { word: "EXHIBITION", clue: "A public display of works of art or items of interest." },
    { word: "AVANT-GARDE", clue: "New and unusual or experimental ideas, especially in the arts." },
    { word: "PERSPECTIVE", clue: "The art of drawing solid objects on a two-dimensional surface to give the right impression of height, width, and depth." }
  ];

  // Game Constants
  const GRID = 40;
  const COLS = 14; // 560 / 40
  const ROWS = 10; // 400 / 40

  // Game State
  let score = 0;
  let timeLeft = 45;
  let timerInterval = null;
  let gameRunning = false;
  let currentTargetIndex = 0;
  let topZones = [];
  let lanes = [];

  // Player Object
  const player = {
    x: 6 * GRID,
    y: 9 * GRID,
    width: 32,
    height: 32,
    speed: GRID
  };

  // Input Handling
  document.addEventListener('keydown', (e) => {
    if (!gameRunning) return;

    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      if (player.y - GRID >= 0) player.y -= GRID;
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      if (player.y + GRID < canvas.height) player.y += GRID;
    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      if (player.x - GRID >= 0) player.x -= GRID;
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      if (player.x + GRID < canvas.width) player.x += GRID;
    }
  });

  function setupRound() {
    // Pick a random target word
    currentTargetIndex = Math.floor(Math.random() * vocabulary.length);
    const targetObj = vocabulary[currentTargetIndex];

    clueEl.textContent = `Clue: "${targetObj.clue}"`;
    blankEl.textContent = targetObj.word.replace(/./g, '_ ');

    // Reset player position
    player.x = 6 * GRID + 4;
    player.y = 9 * GRID + 4;

    // Reset Timer
    timeLeft = 45;
    timerEl.textContent = timeLeft;

    // Generate Top Safety Zones (3 Options: 1 correct, 2 distractors)
    topZones = [];
    let options = [targetObj.word];
    
    while (options.length < 3) {
      let randWord = vocabulary[Math.floor(Math.random() * vocabulary.length)].word;
      if (!options.includes(randWord)) {
        options.push(randWord);
      }
    }
    // Shuffle options
    options.sort(() => Math.random() - 0.5);

    // Place zones at top row (y = 0)
    const slotWidth = canvas.width / 3;
    options.forEach((word, idx) => {
      topZones.push({
        x: idx * slotWidth,
        y: 0,
        width: slotWidth,
        height: GRID,
        word: word,
        isCorrect: word === targetObj.word
      });
    });

    // Initialize Multi-Lane Movement Matrix (Lanes 1 to 8)
    // Row 0: Safety Zones
    // Rows 1-4: River / Drifting Logs
    // Row 5: Safe Safe-zone / Middle bank
    // Rows 6-8: Road / Fast Cars
    // Row 9: Player Starting Row
    lanes = [
      // Log lanes (River)
      { row: 1, type: 'log', speed: 1.5, items: [] },
      { row: 2, type: 'log', speed: -2.0, items: [] },
      { row: 3, type: 'log', speed: 2.2, items: [] },
      { row: 4, type: 'log', speed: -1.8, items: [] },
      
      // Car lanes (Road)
      { row: 6, type: 'car', speed: -3.0, items: [] },
      { row: 7, type: 'car', speed: 2.5, items: [] },
      { row: 8, type: 'car', speed: -3.5, items: [] }
    ];

    // Populate objects in lanes
    lanes.forEach(lane => {
      const count = lane.type === 'log' ? 3 : 2;
      const spacing = canvas.width / count;
      for (let i = 0; i < count; i++) {
        lane.items.push({
          x: i * spacing + Math.random() * 20,
          y: lane.row * GRID,
          width: lane.type === 'log' ? 100 : 60,
          height: GRID - 6
        });
      }
    });
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = score;
    overlay.style.display = 'none';
    gameRunning = true;

    setupRound();

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (gameRunning) {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame(false, "TIME'S UP!");
        }
      }
    }, 1000);

    requestAnimationFrame(gameLoop);
  }

  function endGame(isWin, message) {
    gameRunning = false;
    clearInterval(timerInterval);
    overlayTitle.textContent = isWin ? "LEVEL COMPLETE!" : "GAME OVER";
    overlayMsg.textContent = `${message} Your final score is ${score}.`;
    startBtn.textContent = "PLAY AGAIN";
    overlay.style.display = 'flex';
  }

  function update() {
    if (!gameRunning) return;

    let playerOnLog = false;
    let logSpeed = 0;

    const playerRow = Math.floor((player.y + 16) / GRID);

    // Update Lanes
    lanes.forEach(lane => {
      lane.items.forEach(item => {
        // Move items
        item.x += lane.speed;

        // Wrap around screens
        if (lane.speed > 0 && item.x > canvas.width) {
          item.x = -item.width;
        } else if (lane.speed < 0 && item.x < -item.width) {
          item.x = canvas.width;
        }

        // Collision Check with Cars
        if (lane.type === 'car') {
          if (
            player.x < item.x + item.width &&
            player.x + player.width > item.x &&
            player.y < item.y + item.height &&
            player.y + player.height > item.y
          ) {
            // Hit by car - reset position
            player.x = 6 * GRID + 4;
            player.y = 9 * GRID + 4;
          }
        }

        // Collision Check with Logs
        if (lane.type === 'log') {
          if (
            player.x < item.x + item.width &&
            player.x + player.width > item.x &&
            player.y < item.y + item.height &&
            player.y + player.height > item.y
          ) {
            playerOnLog = true;
            logSpeed = lane.speed;
          }
        }
      });
    });

    // Handle River Mechanics (Rows 1 to 4)
    if (playerRow >= 1 && playerRow <= 4) {
      if (playerOnLog) {
        player.x += logSpeed; // Ride the log
        // Check screen boundaries while riding
        if (player.x < 0 || player.x + player.width > canvas.width) {
          // Drifting off screen resets position
          player.x = 6 * GRID + 4;
          player.y = 9 * GRID + 4;
        }
      } else {
        // Drowned in river - reset position
        player.x = 6 * GRID + 4;
        player.y = 9 * GRID + 4;
      }
    }

    // Check Safety Zone Completion (Top Row: y = 0)
    if (playerRow === 0) {
      const currentZone = topZones.find(z => player.x + player.width / 2 >= z.x && player.x + player.width / 2 <= z.x + z.width);
      if (currentZone) {
        if (currentZone.isCorrect) {
          score += 100 + timeLeft * 2;
          scoreEl.textContent = score;
          setupRound(); // Reset round with a new target word
        } else {
          // Wrong target word chosen
          endGame(false, "WRONG WORD! You entered the wrong destination.");
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Background Grid/Terrain
    // Top Safety Zone Row
    ctx.fillStyle = '#1b2a47';
    ctx.fillRect(0, 0, canvas.width, GRID);

    // River (Rows 1-4)
    ctx.fillStyle = '#0f4c81';
    ctx.fillRect(0, GRID, canvas.width, GRID * 4);

    // Middle Bank (Row 5)
    ctx.fillStyle = '#2b580c';
    ctx.fillRect(0, 5 * GRID, canvas.width, GRID);

    // Road (Rows 6-8)
    ctx.fillStyle = '#333333';
    ctx.fillRect(0, 6 * GRID, canvas.width, GRID * 3);

    // Start Zone (Row 9)
    ctx.fillStyle = '#2b580c';
    ctx.fillRect(0, 9 * GRID, canvas.width, GRID);

    // Draw Top Safety Zones
    topZones.forEach(zone => {
      ctx.fillStyle = '#0f3460';
      ctx.fillRect(zone.x + 2, zone.y + 2, zone.width - 4, zone.height - 4);
      ctx.strokeStyle = '#00fff5';
      ctx.strokeRect(zone.x + 2, zone.y + 2, zone.width - 4, zone.height - 4);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(zone.word, zone.x + zone.width / 2, zone.y + 24);
    });

    // Draw Lanes Items
    lanes.forEach(lane => {
      lane.items.forEach(item => {
        if (lane.type === 'log') {
          ctx.fillStyle = '#8d5524';
          ctx.fillRect(item.x, item.y + 3, item.width, item.height);
          ctx.fillStyle = '#a06232';
          ctx.fillRect(item.x + 4, item.y + 6, item.width - 8, item.height - 6);
        } else if (lane.type === 'car') {
          ctx.fillStyle = '#e94560';
          ctx.fillRect(item.x, item.y + 5, item.width, item.height);
          ctx.fillStyle = '#ff2e63';
          ctx.fillRect(item.x + 5, item.y + 8, item.width - 10, item.height - 6);
        }
      });
    });

    // Draw Player (Frogger)
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(player.x, player.y, player.width, player.height);
    // Frog Eyes
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(player.x + 4, player.y + 4, 6, 6);
    ctx.fillRect(player.x + 22, player.y + 4, 6, 6);
    ctx.fillStyle = '#000000';
    ctx.fillRect(player.x + 6, player.y + 6, 3, 3);
    ctx.fillRect(player.x + 24, player.y + 6, 3, 3);
  }

  function gameLoop() {
    if (gameRunning) {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
  }
</script>
</body>
</html>
