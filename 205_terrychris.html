<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Snake Game</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        #ui-container {
            width: 600px;
            text-align: center;
            margin-bottom: 10px;
        }

        #def-box {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.1rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
            color: #e94560;
        }

        #game-board {
            border: 4px solid #0f3460;
            background-color: #0f0f1b;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        #status-msg {
            height: 25px;
            color: #ff4d4d;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div id="ui-container">
    <div id="def-box">Definition loading...</div>
    <div id="stats-bar">
        <span>Score: <span id="score">0</span></span>
        <span>Tail Length: <span id="length">3</span></span>
    </div>
    <div id="status-msg"></div>
</div>

<canvas id="game-board" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById('game-board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const lengthEl = document.getElementById('length');
const defBox = document.getElementById('def-box');
const statusMsg = document.getElementById('status-msg');

// Vocabulary Bank
const vocabData = [
    { word: "communication", def: "The imparting or exchanging of information or news." },
    { word: "conventional", def: "Based on or in accordance with what is generally done or believed." },
    { word: "fascinating", def: "Extremely interesting or captivating." },
    { word: "generate", def: "To produce, create, or bring into existence." },
    { word: "scent", def: "A distinctive smell, especially one that is pleasant." },
    { word: "prompt", def: "Done without delay; immediate or quick." },
    { word: "nutrient", def: "A substance that provides nourishment essential for growth and life." },
    { word: "harsh", def: "Unpleasantly rough, severe, or cruel." },
    { word: "essential", def: "Absolutely necessary; extremely important." },
    { word: "absorb", def: "To take in or soak up energy, liquid, or other substances." }
];

// Grid Settings
const gridSize = 20;
const tileCount = canvas.width / gridSize;

// Snake State
let snake = [
    { x: 10, y: 10 },
    { x: 10, y: 11 },
    { x: 10, y: 12 }
];
let dx = 0;
let dy = -1;
let score = 0;
let isControlsLocked = false;
let gameOver = false;

// Pellets State
let pellets = [];
let currentTarget = null;

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min)) + min;
}

function initNewRound() {
    // Pick random target definition
    const targetIdx = getRandomInt(0, vocabData.length);
    currentTarget = vocabData[targetIdx];
    defBox.innerText = `DEFINITION: "${currentTarget.def}"`;

    // Select 2 distractors
    let distractors = vocabData.filter((_, idx) => idx !== targetIdx);
    distractors = distractors.sort(() => 0.5 - Math.random()).slice(0, 2);

    // Merge target + distractors & shuffle
    const roundWords = [currentTarget.word, distractors[0].word, distractors[1].word];
    roundWords.sort(() => 0.5 - Math.random());

    // Generate positions for 3 pellets
    pellets = [];
    for (let word of roundWords) {
        let position;
        let collision;
        do {
            collision = false;
            position = {
                x: getRandomInt(1, tileCount - 1),
                y: getRandomInt(1, tileCount - 1)
            };
            // Avoid spawning on snake body
            for (let segment of snake) {
                if (segment.x === position.x && segment.y === position.y) {
                    collision = true;
                    break;
                }
            }
            // Avoid spawning on other pellets
            for (let p of pellets) {
                if (p.x === position.x && p.y === position.y) {
                    collision = true;
                    break;
                }
            }
        } while (collision);

        pellets.push({
            x: position.x,
            y: position.y,
            word: word,
            isCorrect: (word === currentTarget.word)
        });
    }
}

// Input Handling
window.addEventListener('keydown', e => {
    if (isControlsLocked || gameOver) return;

    if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
    if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
    if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
    if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
});

function gameLoop() {
    if (gameOver) return;

    update();
    draw();
    setTimeout(gameLoop, 120);
}

function update() {
    // Move Head
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // Wall Collision Check
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        triggerGameOver("Hit the wall!");
        return;
    }

    // Self-Collision Check
    for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
            triggerGameOver("Collided with your own tail!");
            return;
        }
    }

    snake.unshift(head);

    // Check Pellet Collision
    let atePellet = false;
    for (let i = 0; i < pellets.length; i++) {
        if (head.x === pellets[i].x && head.y === pellets[i].y) {
            atePellet = true;
            if (pellets[i].isCorrect) {
                // Correct Word
                score += 10;
                scoreEl.innerText = score;
                initNewRound();
            } else {
                // Incorrect Word (Poison)
                applyPoison();
                initNewRound();
            }
            break;
        }
    }

    if (!atePellet) {
        snake.pop(); // Remove tail tip if normal move
    }

    lengthEl.innerText = snake.length;
}

function applyPoison() {
    statusMsg.innerText = "POISONED! Movement controls locked for 1.5s!";
    isControlsLocked = true;

    // Chop off 2 tail segments (keep minimum length of 1 segment + head)
    if (snake.length > 2) snake.pop();
    if (snake.length > 2) snake.pop();

    setTimeout(() => {
        isControlsLocked = false;
        statusMsg.innerText = "";
    }, 1500);
}

function triggerGameOver(reason) {
    gameOver = true;
    ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#e94560";
    ctx.font = "bold 36px Segoe UI";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = "#ffffff";
    ctx.font = "18px Segoe UI";
    ctx.fillText(reason, canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 50);
}

function draw() {
    // Clear Canvas
    ctx.fillStyle = "#0f0f1b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Grid Overlay
    ctx.strokeStyle = "#16213e";
    ctx.lineWidth = 0.5;
    for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Draw Snake
    snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#4eacc5" : "#45a29e"; // Lighter head
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
    });

    // Draw Pellets & Labels
    pellets.forEach(pellet => {
        // Render Pellet
        ctx.fillStyle = "#e94560";
        ctx.beginPath();
        ctx.arc(
            pellet.x * gridSize + gridSize / 2,
            pellet.y * gridSize + gridSize / 2,
            gridSize / 2 - 2, 0, Math.PI * 2
        );
        ctx.fill();

        // Render Word Tag above/below pellet
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText(pellet.word, pellet.x * gridSize + gridSize / 2, pellet.y * gridSize - 4);
    });
}

// Start Game
initNewRound();
gameLoop();
</script>

</body>
</html>
