<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Snake: Definition Hunt</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin: 5px 0;
            text-shadow: 0 0 10px #00ffcc;
        }

        #ui-container {
            width: 600px;
            background: #151828;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 10px;
        }

        #definition-display {
            font-size: 1.1rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
        }

        #score-board {
            font-size: 1rem;
            font-weight: bold;
        }

        canvas {
            background-color: #05050a;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
            display: block;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            background: rgba(13, 14, 21, 0.95);
            border: 3px solid #ff0055;
            box-shadow: 0 0 25px #ff0055;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        #game-over-screen h2 {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            margin-top: 0;
        }

        button {
            background: #00ffcc;
            color: #0d0e15;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffcc;
            border-radius: 5px;
            margin-top: 15px;
        }

        button:hover {
            background: #ff00ff;
            color: #ffffff;
            box-shadow: 0 0 10px #ff00ff;
        }
    </style>
</head>
<body>

    <h1>CYBERPUNK SNAKE</h1>
    
    <div id="ui-container">
        <div id="score-board">SCORE: <span id="score">0</span> | TAIL LENGTH: <span id="length">3</span></div>
        <div id="definition-display">Target Definition Loading...</div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p id="final-stats"></p>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCountX = canvas.width / gridSize;
        const tileCountY = canvas.height / gridSize;

        // Vocabulary Database (10 Target Words)
        const vocabList = [
            { word: "ban", def: "To officially prohibit or forbid something." },
            { word: "welfare", def: "The health, happiness, and fortunes of a person or group." },
            { word: "controversy", def: "Disagreement, typically when prolonged, public, and heated." },
            { word: "prey", def: "An animal that is hunted and killed by another for food." },
            { word: "rear", def: "The back part of something, or to raise/bring up offspring." },
            { word: "sniff", def: "To draw in air audibly through the nose to detect a smell." },
            { word: "dignity", def: "The state or quality of being worthy of honor or respect." },
            { word: "intact", def: "Not damaged or impaired; kept whole and complete." },
            { word: "assemble", def: "To fit together the separate component parts of something." },
            { word: "mount", def: "To climb up on, or to organize and initiate an campaign/gear." }
        ];

        let snake = [];
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let currentTarget = null;
        let pellets = [];
        let isLocked = false;
        let gameInterval = null;
        let isGameOver = false;

        function init() {
            snake = [
                { x: 10 * gridSize, y: 10 * gridSize },
                { x: 9 * gridSize, y: 10 * gridSize },
                { x: 8 * gridSize, y: 10 * gridSize }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            isGameOver = false;
            document.getElementById("score").innerText = score;
            document.getElementById("length").innerText = snake.length;
            document.getElementById("game-over-screen").style.display = "none";
            
            pickNewTarget();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function pickNewTarget() {
            // Pick a random target word definition
            currentTarget = vocabList[Math.floor(Math.random() * vocabList.length)];
            document.getElementById("definition-display").innerText = `TARGET DEFINITION: "${currentTarget.def}"`;

            // Select 2 distractor words distinct from current target
            let distractors = vocabList.filter(item => item.word !== currentTarget.word);
            distractors.sort(() => 0.5 - Math.random());
            let choices = [currentTarget.word, distractors[0].word, distractors[1].word];
            choices.sort(() => 0.5 - Math.random()); // Shuffle spawn items

            pellets = [];
            choices.forEach(word => {
                let pos = getUnoccupiedPosition();
                pellets.push({ x: pos.x, y: pos.y, word: word });
            });
        }

        function getUnoccupiedPosition() {
            let valid = false;
            let pos = {};
            while (!valid) {
                pos = {
                    x: Math.floor(Math.random() * tileCountX) * gridSize,
                    y: Math.floor(Math.random() * tileCountY) * gridSize
                };
                valid = !snake.some(segment => segment.x === pos.x && segment.y === pos.y) &&
                        !pellets.some(p => p.x === pos.x && p.y === pos.y);
            }
            return pos;
        }

        function gameLoop() {
            if (isGameOver) return;
            moveSnake();
            if (checkCollisions()) return;
            draw();
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            let atePellet = false;
            pellets.forEach((pellet) => {
                if (head.x === pellet.x && head.y === pellet.y) {
                    atePellet = true;
                    if (pellet.word === currentTarget.word) {
                        // Correct Answer: Tail grows, score increases, new target spawned
                        score += 10;
                        document.getElementById("score").innerText = score;
                        pickNewTarget();
                    } else {
                        // Poison Answer: Remove 2 tail segments, trigger 1.5s lock out
                        triggerPoisonEffect();
                        pickNewTarget();
                    }
                }
            });

            if (!atePellet) {
                snake.pop(); // Normal movement trims tail
            }
            document.getElementById("length").innerText = snake.length;
        }

        function triggerPoisonEffect() {
            // Chop off 2 tail segments
            snake.pop();
            if (snake.length > 1) snake.pop();

            // Lock controls for 1.5s
            isLocked = true;
            setTimeout(() => { isLocked = false; }, 1500);
        }

        function checkCollisions() {
            const head = snake[0];

            // Wall Collision Check
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                triggerGameOver("You crashed into the mainframe firewall (Wall)!");
                return true;
            }

            // Self-Collision Check
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver("System Overload! You collided with your own trail!");
                    return true;
                }
            }

            // Game over if tail drops below 1 segment from poison
            if (snake.length < 1) {
                triggerGameOver("Poison Overdose! Snake corrupted!");
                return true;
            }

            return false;
        }

        function triggerGameOver(reason) {
            isGameOver = true;
            clearInterval(gameInterval);
            document.getElementById("final-stats").innerText = `${reason}\nFinal Score: ${score}`;
            document.getElementById("game-over-screen").style.display = "block";
        }

        function draw() {
            // Clear Grid Background
            ctx.fillStyle = "#05050a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid Lines (Cyberpunk Effect)
            ctx.strokeStyle = "#121526";
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = (index === 0) ? (isLocked ? "#ff0055" : "#00ffcc") : "#0088cc";
                ctx.shadowBlur = index === 0 ? 10 : 0;
                ctx.shadowColor = "#00ffcc";
                ctx.fillRect(segment.x, segment.y, gridSize - 1, gridSize - 1);
            });
            ctx.shadowBlur = 0; // reset glow effect

            // Draw Food Pellets with Vocabulary Text Labels
            pellets.forEach(pellet => {
                ctx.fillStyle = "#ff00ff";
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#ff00ff";
                ctx.fillRect(pellet.x, pellet.y, gridSize - 1, gridSize - 1);

                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px Courier New";
                ctx.textAlign = "center";
                ctx.fillText(pellet.word, pellet.x + gridSize / 2, pellet.y - 4);
            });
        }

        // Input Control Handler
        window.addEventListener("keydown", e => {
            if (isLocked || isGameOver) return; // Prevent movement during lock time

            switch (e.key) {
                case "ArrowUp":
                    if (dy === 0) { dx = 0; dy = -gridSize; }
                    break;
                case "ArrowDown":
                    if (dy === 0) { dx = 0; dy = gridSize; }
                    break;
                case "ArrowLeft":
                    if (dx === 0) { dx = -gridSize; dy = 0; }
                    break;
                case "ArrowRight":
                    if (dx === 0) { dx = gridSize; dy = 0; }
                    break;
            }
        });

        function resetGame() {
            init();
        }

        // Start the game on launch
        init();
    </script>
</body>
</html>
