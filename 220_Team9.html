<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字氣球大作戰</title>
<style>
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(to bottom, #1a1a2e, #16213e);
  overflow: hidden;
  font-family: 'Microsoft JhengHei', sans-serif;
  user-select: none;
  touch-action: manipulation;
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* 畫面震動效果 */
.shake {
  animation: shake 0.3s ease-in-out;
}

@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-10px, 5px); }
  40% { transform: translate(10px, -5px); }
  60% { transform: translate(-5px, -10px); }
  80% { transform: translate(5px, 10px); }
}

/* 控制中心 (中央提示框) */
#control-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width: 450px;
  padding: 25px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 20px;
  text-align: center;
  color: white;
  z-index: 10;
  pointer-events: none;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  box-sizing: border-box;
}

#control-center h2 {
  margin: 0 0 10px 0;
  font-size: 18px;
  color: #ffd369;
  letter-spacing: 2px;
}

#target-definition {
  font-size: 24px;
  font-weight: bold;
  line-height: 1.4;
}

/* 頂部資訊列 */
#ui-bar {
  position: absolute;
  top: 20px;
  left: 5%;
  right: 5%;
  display: flex;
  justify-content: space-between;
  color: white;
  font-size: 22px;
  font-weight: bold;
  z-index: 20;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

/* 氣球樣式 */
.balloon {
  position: absolute;
  bottom: -150px;
  width: 110px;
  height: 140px;
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  font-weight: bold;
  font-size: 15px;
  padding: 10px;
  box-sizing: border-box;
  cursor: pointer;
  box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.3);
  animation: floatUp linear forwards;
  word-break: break-all;
}

.balloon::after {
  content: "";
  position: absolute;
  bottom: -15px;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 20px;
  background-color: rgba(255, 255, 255, 0.5);
}

/* 氣球爆炸效果 */
.popping {
  animation: pop 0.2s ease-out forwards !important;
  pointer-events: none;
}

@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.8; }
  100% { transform: scale(1.6); opacity: 0; }
}

@keyframes floatUp {
  0% { bottom: -150px; }
  100% { bottom: 105vh; }
}

/* 開始/結束畫面覆蓋層 */
#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  z-index: 100;
}

#overlay h1 {
  font-size: 42px;
  margin-bottom: 10px;
  color: #ffd369;
}

#overlay p {
  font-size: 18px;
  margin-bottom: 30px;
  color: #eeeeee;
  text-align: center;
  padding: 0 20px;
}

#start-btn {
  padding: 15px 40px;
  font-size: 22px;
  font-weight: bold;
  background-color: #ff6584;
  color: white;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(255, 101, 132, 0.4);
  transition: 0.2s;
}

#start-btn:hover {
  background-color: #ff476f;
  transform: scale(1.05);
}
</style>
</head>
<body>

<div id="game-container">
  <div id="ui-bar">
    <div id="score-display">分數: 0</div>
    <div id="timer-display">時間: 90s</div>
  </div>

  <div id="control-center">
    <h2>目標單字提示</h2>
    <div id="target-definition">準備開始...</div>
  </div>

  <div id="overlay">
    <h1>單字氣球大作戰</h1>
    <p>在 90 秒內找出與提示相符的單字氣球！<br>答對 +10 分，答錯 -5 分。</p>
    <button id="start-btn" onclick="startGame()">開始遊戲</button>
  </div>
</div>

<script>
const vocabList = [
  { word: "presentation", def: "簡報、呈現" },
  { word: "boost", def: "促進、提高" },
  { word: "accomplish", def: "完成、實現" },
  { word: "purchase", def: "購買" },
  { word: "trigger", def: "觸發、引發" },
  { word: "psychology", def: "心理學" },
  { word: "stability", def: "穩定性" },
  { word: "participation", def: "參與" },
  { word: "implication", def: "暗示、影響" },
  { word: "motivation", def: "動機、積極性" }
];

let score = 0;
let timeLeft = 90;
let gameInterval = null;
let spawnInterval = null;
let currentTarget = null;
let isPlaying = false;

const colors = [
  "#ff6b6b", "#feca57", "#48dbfb", "#ff9ff3",
  "#54a0ff", "#5f27cd", "#00d2d3", "#1dd1a1", "#ff6584"
];

function startGame() {
  score = 0;
  timeLeft = 90;
  document.getElementById("score-display").innerText = "分數: " + score;
  document.getElementById("timer-display").innerText = "時間: " + timeLeft + "s";
  document.getElementById("overlay").style.display = "none";

  document.querySelectorAll('.balloon').forEach(b => b.remove());

  isPlaying = true;
  setNewTarget();

  spawnInterval = setInterval(createBalloon, 1000);

  gameInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("timer-display").innerText = "時間: " + timeLeft + "s";
    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function setNewTarget() {
  let nextTarget;
  do {
    const randomIndex = Math.floor(Math.random() * vocabList.length);
    nextTarget = vocabList[randomIndex];
  } while (currentTarget && nextTarget.word === currentTarget.word && vocabList.length > 1);

  currentTarget = nextTarget;
  document.getElementById("target-definition").innerText = currentTarget.def;
}

function createBalloon() {
  if (!isPlaying) return;

  const container = document.getElementById("game-container");
  const balloon = document.createElement("div");
  balloon.classList.add("balloon");

  let selectedVocab;
  if (Math.random() < 0.35) {
    selectedVocab = currentTarget;
  } else {
    selectedVocab = vocabList[Math.floor(Math.random() * vocabList.length)];
  }

  balloon.innerText = selectedVocab.word;

  const randomColor = colors[Math.floor(Math.random() * colors.length)];
  balloon.style.backgroundColor = randomColor;

  const randomX = Math.random() * (window.innerWidth - 120);
  balloon.style.left = Math.max(10, randomX) + "px";

  const duration = Math.random() * 4 + 6;
  balloon.style.animationDuration = duration + "s";

  // 改用 pointerdown 支援行動裝置與滑鼠
  balloon.addEventListener("pointerdown", (e) => {
    if (!isPlaying || balloon.classList.contains("popping")) return;

    if (selectedVocab.word === currentTarget.word) {
      score += 10;
      document.getElementById("score-display").innerText = "分數: " + score;
      popEffect(balloon);
      setNewTarget();
    } else {
      score -= 5;
      document.getElementById("score-display").innerText = "分數: " + score;
      triggerShake();
      popEffect(balloon);
    }
    e.stopPropagation();
  });

  balloon.addEventListener("animationend", (e) => {
    if (e.animationName === "floatUp") {
      balloon.remove();
    }
  });

  container.appendChild(balloon);
}

function popEffect(balloon) {
  balloon.classList.add("popping");
  setTimeout(() => {
    balloon.remove();
  }, 180);
}

function triggerShake() {
  const container = document.getElementById("game-container");
  container.classList.add("shake");
  setTimeout(() => {
    container.classList.remove("shake");
  }, 300);
}

function endGame() {
  isPlaying = false;
  clearInterval(gameInterval);
  clearInterval(spawnInterval);

  document.querySelectorAll('.balloon').forEach(b => b.remove());

  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  overlay.querySelector("h1").innerText = "時間到！";
  overlay.querySelector("p").innerHTML = `你的最終得分是：<b>${score}</b> 分`;
  document.getElementById("start-btn").innerText = "再玩一次";
}
</script>
</body>
</html>
